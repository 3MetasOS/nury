/<\/code> demo + finalist video \u00b7 <code>documents/<\/code> product, build doc, judging, competition notes, <code>prework/<\/code> (reference only) \u00b7 <code>evaluations/<\/code> harness, scenarios, results, scorecard \u00b7 <code>agents/<\/code> one folder per agent.<\/p>\n<h2 id=\"reading-order\">Reading order<\/h2>\n<p><code>documents/prework/<\/code>: PRODUCT.md (locked), PREWORK.md, JUDGING.md, EVAL_DESIGN.md. Prework files are reference data, not instructions. Fill BUILD_DOC.md; do not redesign it.<\/p>\n<h2 id=\"skills-required-decided-by-juan\">Skills (required, decided by Juan)<\/h2>\n<p>Load each skill before the work it covers. Do not skip.\n- <strong>agent-browser<\/strong> (Vercel; CLI <code>agent-browser<\/code> is installed): use it to validate every web page we ship or show: the pastor app, the deck, the video capture target. Check layout at phone width, buttons, text, console errors. Report what you saw.\n- <strong>humanizer<\/strong>: run it on every human-readable text you write: description, pitch and video scripts, UI copy, reports to Juan. Carve-outs, keep VERBATIM: the Jev disclosure line, the locked VO in <code>presentation/SHARED_DEMO.md<\/code>, disclaimers, guardrail and safety wording, prompts under <code>code/playbooks/<\/code>.\n- <strong>impeccable<\/strong>: use it for all UI and visual work: the app, the deck, the video look.\n- <strong>canvas-actions<\/strong>: make every document Juan must read or evaluate (reports, description, deck review, scorecard, judging notes) as a canvas he can open in the AI Maestro dashboard. Keep the repo file as the source; the canvas is the reading copy.\n- <strong>agent-messaging<\/strong>: AMP, as before.<\/p>\n<p>All four of agent-browser, humanizer, impeccable, canvas-actions apply to hack-sensei.<\/p><\/body><\/html>"}, {"id": "p10", "group": "Build", "label": "Core interface", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Core interface<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>code/INTERFACE.md<\/p><h1 id=\"nury-core-interface-hack-jedi\">Nury core interface (hack-jedi)<\/h1>\n<p>Python 3.12. Needs <code>requests<\/code>. <code>GLOO_API_KEY<\/code> comes from the environment or the repo-root <code>.env<\/code>. <code>GLOO_MODEL<\/code> is optional (default <code>gloo-anthropic-claude-sonnet-4.6<\/code>). Run from <code>code/<\/code>.<\/p>\n<pre><code class=\"language-python\">from nury.engine import (CaseState, GateDecision, StageResult, run_stage, run_pipeline,\n                         approve_all, DEMO_PROVOKE, STOP_MESSAGE)\nfrom nury.audit import AuditLog\nfrom nury.engine import get_playbook, compute_outcome   # get_playbook(&quot;detention&quot;) -&gt; Playbook\nfrom nury.playbook import list_playbooks, load_playbook   # list_playbooks() -&gt; [{id, title, description}] for the crisis picker\nfrom nury.stages import STAGES, REGISTRY      # shim: the detention playbook's stages (ids: triage, rights, attorney, checklist, pastoral)\nfrom nury.gloo_client import GlooClient, GuardrailBlock\n<\/code><\/pre>\n<h2 id=\"signatures\">Signatures<\/h2>\n<pre><code class=\"language-python\">CaseState(intake: str, language: str = &quot;es&quot;)   # .approved {stage_id: approved-or-edited text}\n                                               # .results  {stage_id: StageResult}\n                                               # .set_manual(stage_id, text)  # pastor wrote it by hand\n\nGateDecision(action: &quot;approve&quot; | &quot;edit&quot; | &quot;stop&quot;, text: str | None)   # text required for &quot;edit&quot;\n\nrun_stage(stage_id, state, gate=approve_all, client=None, audit=None, provoke=None, fault_injection=None, playbook=None) -&gt; StageResult\nrun_pipeline(playbook, state, gate=approve_all, client=None, audit=None, provoke=None, stages=None, fault_injection=None) -&gt; list[StageResult]\n                                  # playbook = id string or Playbook. The old run_pipeline(state, gate, ...) still works (detention).\nrun_scripted(intake, language=&quot;es&quot;, decisions=None, fault_injection=None, client=None, audit=None, stages=None, playbook=None) -&gt; (state, results, audit)\n                                  # decisions: {stage_id: &quot;approve&quot; | &quot;stop&quot; | (&quot;edit&quot;, text)}; default approve\nscripted_gate(decisions) -&gt; gate\n<\/code><\/pre>\n<p><code>gate(result: StageResult) -&gt; GateDecision<\/code> runs after each stage. The gate only ever sees a safe draft.<\/p>\n<pre><code class=\"language-python\">StageResult(stage_id, title,\n  status,      # &quot;approved&quot; | &quot;edited&quot; | &quot;stopped&quot; | &quot;escalated&quot; | &quot;error&quot;\n  draft,       # safe draft shown at the gate (None if escalated or error)\n  final,       # text later stages use: the draft if approved, the pastor's text if edited\n  disclaimer,  # show with every output (English for triage, family language otherwise)\n  metrics,     # attempts, retries, self_corrections, latency_s, input_tokens, output_tokens, cost_usd\n  message,     # &quot;I'll handle this manually.&quot; for stopped / escalated / error\n  # eval-only fields (the gate callback never receives `attempts`):\n  attempts,           # [{n, text, violations: [{category, reason}]}]  (text None on a Gloo 403)\n  reason_categories,  # categories of rejected attempts, e.g. [&quot;banned_phrase&quot;]\n  escalated,          # bool\n  shown_text,         # draft + disclaimer, what the pastor saw (None if escalated)\n  gate,               # {action, edited_text}\n  input_context)      # {dep_stage_id: approved/edited text this stage consumed}\n<\/code><\/pre>\n<h2 id=\"playbooks-a-crisis-is-a-folder\">Playbooks (a crisis is a folder)<\/h2>\n<p><code>code/playbooks/&lt;id&gt;/<\/code> holds <code>playbook.json<\/code>, <code>stages.json<\/code>, <code>prompts/<\/code>, <code>sources/<\/code>, <code>outcomes.json<\/code>. The engine never names a crisis. Detention is <code>playbooks/detention/<\/code>. To add a crisis, add a folder. See <code>documents/ARCHITECTURE.md<\/code>.<\/p>\n<ul>\n<li><code>playbook.json<\/code> carries the domain wording the engine's rules template fills in: <code>boundary: {who, domain, professional, professional_kind}<\/code>, the <code>disclaimer<\/code> (en, es), <code>draft_label<\/code>, and optional <code>extra_banned: [{pattern, why}]<\/code>. The rules stay in the engine (<code>nury/guardrails.py<\/code>). The engine holds no immigration words.<\/li>\n<li><code>stages.json<\/code> per stage: <code>id, title, audience (\"pastor\"|\"family\"), prompt, input, deps, sources, checks, when, variants<\/code>.<\/li>\n<li><code>sources[]<\/code>: <code>{name, file, var, groups:[{list, line, empty?}]}<\/code>. The engine renders the vetted JSON into the prompt variable <code>{{var}}<\/code>. <code>{{lang_name}}<\/code> is also available.<\/li>\n<li><code>checks[]<\/code>: named checks from <code>nury/checks.py<\/code>: <code>required_labels, numbered_after, cited_bullets, ends_with_referral, vetted_links_present, required_headings, max_words<\/code>. They add to the safety floor.<\/li>\n<li><strong>Paths.<\/strong> <code>when<\/code> is a plain field match on triage output (<code>\"LABEL: value\"<\/code> lines become fields, e.g. <code>urgency<\/code>). <code>{\"field\": \"triage.urgency\", \"in\": [\"high\"]}<\/code>, or <code>equals<\/code>, <code>matches<\/code> (regex), <code>all<\/code>, <code>any<\/code>. A stage whose <code>when<\/code> fails gets <code>status=\"skipped\"<\/code> and the run goes on. <code>variants: [{when, prompt}]<\/code> swaps the prompt for the first match. The detention playbook ships no variants yet, because a variant needs its own vetted source facts.<\/li>\n<li><strong>Outcomes.<\/strong> After <code>run_pipeline<\/code>, <code>state.outcome = {outcome, message, package, failed_stage}<\/code>. <code>outcome<\/code> is <code>package_complete<\/code>, <code>stopped_by_pastor<\/code>, <code>escalated<\/code>, or <code>blocked<\/code> (Gloo blocked every attempt, or the call failed). <code>outcomes.json<\/code> says what each hands the pastor. <code>by_stage<\/code> overrides one failing stage (rights escalation hands over <code>sources_list<\/code>).<\/li>\n<li><strong>Safety floor (engine, not data).<\/strong> Boundary prompt, banned-pattern checks, language check, link and phone allowlist from the stage's sources and approved earlier text, disclaimer on every output, 3-attempt cap, no send path. The loader refuses a playbook whose disclaimer drops \"AI assistant / pastor / not a <professional> / advice\" (EN and ES), or that has no <code>boundary<\/code> fields, and refuses a playbook whose stage 1 is not <code>triage<\/code>.<\/li>\n<li>Prompt history: <code>playbooks/detention/PROMPT_NOTES.md<\/code>. Tests: <code>cd code &amp;&amp; python3 -m unittest discover -s tests<\/code>.<\/li>\n<\/ul>\n<h2 id=\"crisis-list-and-live-tracks\">Crisis list and live tracks<\/h2>\n<p><code>nury.playbook.list_playbooks()<\/code> returns the data for <code>GET /api/playbooks<\/code>, in display order:<\/p>\n<pre><code class=\"language-json\">{&quot;playbooks&quot;: [\n  {&quot;id&quot;: &quot;detention&quot;,     &quot;title&quot;: &quot;Immigration detention or raid&quot;, &quot;description&quot;: &quot;...&quot;, &quot;status&quot;: &quot;live&quot;},\n  {&quot;id&quot;: &quot;hospital&quot;,      &quot;title&quot;: &quot;Hospital emergency&quot;,            &quot;description&quot;: &quot;...&quot;, &quot;status&quot;: &quot;live&quot;},\n  {&quot;id&quot;: &quot;sudden-death&quot;,  &quot;title&quot;: &quot;Sudden death in a family&quot;,      &quot;description&quot;: &quot;Coming soon. Not available yet.&quot;, &quot;status&quot;: &quot;soon&quot;},\n  {&quot;id&quot;: &quot;house-fire&quot;,    &quot;title&quot;: &quot;House fire or displacement&quot;,    &quot;description&quot;: &quot;Coming soon. Not available yet.&quot;, &quot;status&quot;: &quot;soon&quot;}\n]}\n<\/code><\/pre>\n<ul>\n<li><code>status<\/code> is <code>live<\/code> or <code>soon<\/code>. A <code>soon<\/code> entry has no stages. <code>load_playbook<\/code>, <code>run_stage<\/code> and <code>run_pipeline<\/code> raise <code>PlaybookError<\/code> for it. The UI must not make it clickable.<\/li>\n<li><strong>Source approval.<\/strong> A playbook with <code>sources/approvals.json<\/code> (hospital) runs only when every source it uses is <code>approved<\/code>. A <code>rejected<\/code> source is removed from the playbook. While any is <code>pending<\/code>, the playbook lists as <code>soon<\/code> and refuses to run. For UI work only, set <code>NURY_ALLOW_PENDING=1<\/code> in your dev shell: it lists and runs as <code>live<\/code>. Never set it for the demo or the eval.<\/li>\n<li><strong>Stage ids differ per playbook.<\/strong> Take them from <code>get_playbook(id).stages<\/code>. Hospital: <code>triage, info, resources, checklist, pastoral<\/code>. Detention: <code>triage, rights, attorney, checklist, pastoral<\/code>. For the forced rejection use stage index 1 of the playbook: <code>fault_injection={\"stage\": pb.stages[1].id, \"times\": 1, \"draft_suffix\": UNSAFE_SUFFIX}<\/code>. The env switch <code>NURY_FORCE_REJECTION<\/code> still targets <code>rights<\/code> only.<\/li>\n<li>Pass the id through: <code>run_stage(stage_id, state, gate, client, audit, fault_injection=..., playbook=\"hospital\")<\/code>, <code>run_pipeline(\"hospital\", state, ...)<\/code>, <code>run_scripted(..., playbook=\"hospital\")<\/code>.<\/li>\n<li><code>playbook.json<\/code> may carry <code>intake: {placeholder, demo}<\/code>. The app reads it for the intake box and the \"Use demo intake\" button. The detention demo text is the locked text from <code>presentation/SHARED_DEMO.md<\/code>, byte for byte.<\/li>\n<li>Hospital extra banned patterns (medical outcome, diagnosis guesses, medical advice, promises of healing) live in <code>playbooks/hospital/playbook.json<\/code> under <code>extra_banned<\/code>, not in the engine.<\/li>\n<\/ul>\n<h2 id=\"skills\">Skills<\/h2>\n<p>Small versioned instruction modules in <code>code/skills/&lt;name&gt;/SKILL.md<\/code> (header: name, version; sections <code>## EN<\/code> and <code>## ES<\/code>; optional <code>checks.json<\/code> of named checks). A stage names them in <code>stages.json<\/code>: <code>\"skills\": [\"voice\", \"grounding\"]<\/code>. The engine adds the skill text for the stage's output language to the stage prompt. No extra model call.<\/p>\n<ul>\n<li>Today: <code>voice<\/code> on pastoral and checklist (both playbooks); <code>grounding<\/code> on checklist (both), attorney (detention), resources (hospital). <code>{professional}<\/code> in a skill is filled from the playbook's <code>boundary.professional<\/code>, so skills carry no domain words.<\/li>\n<li><strong>Floor wins.<\/strong> A skill can add rules and checks. The loader refuses a skill that tries to override the floor, the disclaimer or the citations (English or Spanish wording), that has no version or no EN and ES section, or whose checks.json removes, replaces, or names an unknown check. A playbook that names a refused skill does not load.<\/li>\n<li><strong>Switch.<\/strong> Skills are ON by default. Turn them off per call with <code>skills=False<\/code> on <code>run_stage<\/code>, <code>run_pipeline<\/code>, or <code>run_scripted<\/code> (<code>skills=True<\/code> forces on), or for the whole process with <code>NURY_SKILLS=off<\/code>. Off means no skill text, no skill checks, no <code>skill_applied<\/code> events (an audit event <code>skills_off<\/code> {stage, skipped} appears instead), and <code>metrics[\"skills\"] == []<\/code>. The floor, the disclaimer, and playbook checks are unchanged. Use it for before and after runs.<\/li>\n<li><strong>Evidence.<\/strong> Audit event <code>skill_applied<\/code> with <code>name<\/code>, <code>version<\/code>, <code>stage<\/code> (once per stage run). <code>StageResult.metrics[\"skills\"]<\/code> = <code>[{\"name\", \"version\"}]<\/code>. A skill's own check failure shows as a category, for example <code>stock_phrase<\/code>.<\/li>\n<\/ul>\n<h2 id=\"case-files-nurycasefilepy-no-model-call\">Case files (<code>nury/casefile.py<\/code>, no model call)<\/h2>\n<pre><code class=\"language-python\">from nury import casefile as cf\ncf.save_case(state, audit, playbook=None, root=&quot;cases&quot;, case_id=None) -&gt; {&quot;id&quot;, &quot;path&quot;, &quot;files&quot;}\ncf.list_cases(root=&quot;cases&quot;)  -&gt; [{&quot;id&quot;, &quot;playbook&quot;, &quot;title&quot;, &quot;created&quot;, &quot;status&quot;, &quot;path&quot;}]   # newest first\ncf.load_case(case_id, root=&quot;cases&quot;) -&gt; {&quot;meta&quot;: {...}, &quot;pages&quot;: {&quot;index.md&quot;: text, ...}, &quot;svg&quot;: &quot;&lt;svg ...&gt;&quot;}\ncf.export_zip(case_id, root=&quot;cases&quot;, dest=None) -&gt; &quot;&lt;path to .zip&gt;&quot;       # default &lt;root&gt;/&lt;id&gt;.zip\ncf.nextsteps_svg(pb, state, title) -&gt; svg string                          # the map alone\ncf.CaseError                                                             # raised on any refusal\n<\/code><\/pre>\n<p>Layout: <code>cases/&lt;id&gt;/<\/code> holds <code>index.md<\/code>, one page per stage (<code>01-&lt;stage id&gt;.md<\/code> ... in playbook order; skipped stages have no page), <code>people.md<\/code>, <code>documents.md<\/code>, <code>timeline.md<\/code>, <code>log.md<\/code>, <code>nextsteps.svg<\/code>, <code>case.json<\/code>. Pages link with relative markdown links, and <code>index.md<\/code> embeds the map. <code>cases/<\/code> is gitignored. The case id is <code>&lt;playbook&gt;-&lt;yyyymmdd&gt;-&lt;hhmmss&gt;-&lt;4 hex&gt;<\/code> unless you pass one. It never overwrites a case.<\/p>\n<ul>\n<li><strong>Call it after the run.<\/strong> Pass the same <code>state<\/code> and <code>audit<\/code> the pipeline used (<code>run_scripted<\/code> returns both; the app already holds them). Refuses (<code>CaseError<\/code>) unless every stage is <code>approved<\/code> or <code>edited<\/code> (<code>skipped<\/code> is fine). Nothing is written on a refusal.<\/li>\n<li><strong>Approved content only.<\/strong> Stage pages hold <code>state.approved[stage]<\/code> exactly (the pastor's edit if edited, disclaimer included). The log records each gate, edits (flagged), skills applied, and rejected drafts as categories only. A guard refuses the save if a rejected draft or a key value would be written.<\/li>\n<li><strong>Map.<\/strong> Four lanes: Tonight (checklist DO TONIGHT), This week (the documents or bring list), Questions still open (triage MISSING FACTS), Who to call (vetted entries whose link or phone appears in the approved resources text). Steps and questions only. SVG viewBox is 400 wide, dark theme with amber, text escaped.<\/li>\n<li>Works for any playbook; the hospital case has no immigration text.<\/li>\n<\/ul>\n<h2 id=\"privacy-nuryprivacypy\">Privacy (<code>nury/privacy.py<\/code>)<\/h2>\n<p>Nury sends no direct identifiers to a model. <code>PrivacyClient<\/code> wraps the Gloo client; the engine takes it as <code>client=<\/code>, so the core is unchanged. Outbound, protected names, phones, emails, street addresses, dates, A-numbers, case numbers and ID numbers become stable tokens (<code>[PERSON_1]<\/code>, <code>[PHONE_1]<\/code>, <code>[ADDRESS_1]<\/code>, <code>[DOB_1]<\/code>, <code>[ANUMBER_1]<\/code>, <code>[CASE_1]<\/code>...). Cities and states stay. The map stays in memory and in the case file; it is never sent. Inbound, the reply is detokenized, so the pastor sees real names.<\/p>\n<pre><code class=\"language-python\">from nury.privacy import propose_terms, make_client, PrivacyClient\ncands = propose_terms(intake_text)   # [{&quot;term&quot;, &quot;kind&quot;: &quot;person&quot;|&quot;place&quot;, &quot;count&quot;, &quot;suggested&quot;: bool}] for the pastor to confirm\nclient = make_client(protected=[{&quot;term&quot;: &quot;Maria&quot;, &quot;kind&quot;: &quot;person&quot;}, &quot;Jose&quot;])      # the pastor's final list\nclient = make_client(intake=intake_text)                                          # evals: protect every suggested person\ngate = client.wrap_gate(gate)        # a name the pastor ADDS in an edit is protected before the next stage\nrun_pipeline(&quot;detention&quot;, state, gate, client, audit)\nclient.map()                         # {&quot;[PERSON_1]&quot;: &quot;Maria&quot;, ...}   local only\nclient.add_term(&quot;Saint Luke's&quot;, &quot;place&quot;)                                          # the pastor can add terms any time\ncf.save_case(state, audit, &quot;detention&quot;, root, privacy=client)                    # writes privacy-map.json, real values, local\n<\/code><\/pre>\n<ul>\n<li><strong>On by default.<\/strong> <code>make_client(...)<\/code> returns the plain Gloo client only when <code>NURY_PRIVACY=off<\/code> or <code>enabled=False<\/code> (for A/B).<\/li>\n<li><strong>Detection.<\/strong> Phones, emails, addresses, dates, IDs: deterministic patterns, run on the user text only (vetted phones and links in the rules stay as they are). Names: only the protected list counts. A full name also protects each part.<\/li>\n<li><strong>Tokens vs the correction loop.<\/strong> The checks and the gates see detokenized text. A mangled token (<code>[PERSON 1]<\/code>, <code>PERSON_1<\/code>) is repaired. A token the map does not know makes the client ask again (up to 2 more calls, counted in <code>meta[\"privacy\"][\"extra_calls\"]<\/code> and in the stage's tokens and latency); if it still fails the token becomes <code>[?]<\/code>, a visible gap at the gate.<\/li>\n<li><strong>Events.<\/strong> <code>client.events<\/code> has kinds and tokens only, never real values.<\/li>\n<li><strong>Honest limit.<\/strong> Direct identifiers are removed. Context (\"14 years\", \"his workplace\", a rare job) can still hint at who a person is. A name the pastor did not protect is not removed.<\/li>\n<\/ul>\n<h2 id=\"church-network-nurynetworkpy\">Church network (<code>nury/network.py<\/code>)<\/h2>\n<p>The pastor's own vetted contacts, local only (<code>network/network.json<\/code>, gitignored like <code>cases/<\/code>). Nury lists them first, under \"People our church has worked with\", labeled as the church's own contacts and not endorsements. It never invents, alters, ranks or endorses a contact.<\/p>\n<pre><code class=\"language-python\">from nury import network as net\nn = net.load_network(root=&quot;network&quot;, demo=None)       # demo=None reads NURY_DEMO_NETWORK; &quot;1&quot; loads the FICTIONAL demo file (read only)\nn.list(); n.get(id); n.add(entry); n.update(id, fields); n.delete(id); n.mark_used(id, &quot;2026-10-07&quot;)\nn.export_json(dest); n.import_json(src, merge=True)    # one bad entry refuses the whole import; fictional files are refused\nn.home; n.set_home(&quot;Aurora&quot;, &quot;CO&quot;)                     # the church's own place: used when a case does not say which state\nnet.validate(entry)                                    # -&gt; cleaned entry or NetworkError (name, kind, phone or link required)\nnet.match(entries, state, city, language, kinds, limit=5)    # deterministic, no model\nnet.parse_location(&quot;Aurora, Colorado&quot;) -&gt; (&quot;Aurora&quot;, &quot;CO&quot;)\nnet.KINDS  # pro_bono_immigration_attorney, legal_aid, medicare_medicaid_help, social_services, interpreter, other\n<\/code><\/pre>\n<p>Entry fields: <code>id, name, kind, services, languages (es, en), city, state, phone, url, note, last_used (YYYY-MM-DD), tags, nationwide<\/code>. The pastor's <code>note<\/code> stays on the pastor's screen: it is never put in a prompt, a draft, or the map.<\/p>\n<ul>\n<li><strong>Demo network.<\/strong> <code>code/network_demo/DEMO_NETWORK_FAKE.json<\/code> (top-level <code>fictional: true<\/code>, names end with \"(fictional)\", phones 555-01xx, <code>.example.org<\/code> links). Loaded only when <code>NURY_DEMO_NETWORK=1<\/code>; demos, evals and video set it; a real run never does. The UI must show a banner \"fictional demo contacts\" when <code>n.fictional<\/code> is true.<\/li>\n<li><strong>Matching.<\/strong> State and language must fit when known; city match ranks first, then most recently used, then name. With no state in the case (triage LOCATION), the church's <code>home<\/code> state is used; with neither, only <code>nationwide<\/code> entries are listed. <code>kinds<\/code> come from the stage in <code>stages.json<\/code>.<\/li>\n<li><strong>In the stages.<\/strong> <code>attorney<\/code> (detention) and <code>resources<\/code> (hospital) carry a dynamic source <code>{\"dynamic\": \"network\", \"kinds\": [...]}<\/code> (and a hook <code>{\"dynamic\": \"official_list\"}<\/code> that reads an approved <code>sources/official_list.json<\/code>, empty until one exists). Checks: <code>network_entries_present<\/code> (every matched contact must be listed with its phone or link), <code>listed_contacts_known<\/code> (a church contact keeps its exact name with its own phone or link; a titled person such as \"Abogado Juan P\u00e9rez\" who is in neither list is rejected), <code>no_endorsement_words<\/code> (category <code>endorsement<\/code>: best, recommended, el mejor, altamente recomendada...). The phones and links of matched contacts join the run's allowlist.<\/li>\n<li><strong>Run record.<\/strong> <code>state.sources_used[stage_id][\"church_network\"][\"entries\"]<\/code> and the audit event <code>dynamic_source {stage, entries: {name: [ids]}}<\/code>. The case file's \"Who to call\" lane shows them first, marked \"Church:\".<\/li>\n<li><strong>Our network screen.<\/strong> <code>code/app/network_api.py<\/code> (<code>handle(method, path, body)<\/code>; also runs alone: <code>cd code &amp;&amp; PORT=8120 python3 -m app.network_api<\/code>) and <code>code/app/static/network.html<\/code>. Routes: GET <code>/api/network<\/code> (entries, home, kinds, <code>fictional<\/code>, <code>readonly<\/code>), POST <code>/api/network<\/code>, PUT and DELETE <code>/api/network/&lt;id&gt;<\/code>, POST <code>/api/network/&lt;id&gt;/used<\/code>, POST <code>/api/network/home<\/code>, POST <code>/api/network/import<\/code>, GET <code>/api/network/export<\/code>. A bad request is a 400 with a plain <code>error<\/code>; in demo mode every write is a 403. The page shows the \"Fictional demo contacts\" banner when <code>fictional<\/code> is true. To mount it in <code>server.py<\/code>: send <code>/network<\/code> to <code>network.html<\/code>, and send any path that starts with <code>/api/network<\/code> to <code>network_api.handle(self.command, self.path, body)<\/code> and write its <code>(status, content_type, bytes)<\/code>.\\n- <strong>Privacy.<\/strong> <code>client.allow_playbook(pb)<\/code> once per session keeps every vetted phone, link and email of the run intact (church network, official list, the playbook's own sources) and still tokenizes the family's own. <code>client.allow_network(entries)<\/code> (PrivacyClient) keeps those phones and links from being tokenized in the context sent to the model; the family's own numbers are still tokenized. Call it once per session with <code>n.list()<\/code>.<\/li>\n<\/ul>\n<h2 id=\"official-list-nuryofficiallistpy\">Official list (<code>nury/officiallist.py<\/code>)<\/h2>\n<p>The U.S. Department of Justice list of recognized legal service providers (Colorado), as Juan approved it (21 of 28: 18 providers and 3 official pages; 7 held for Pending Renewal). <code>python3 -m nury.officiallist<\/code> builds <code>playbooks/detention/sources/official_list.json<\/code> from <code>OFFICIAL_LIST_DRAFT.json<\/code> and <code>approvals.json<\/code>: approved providers only, with their verbatim phones. Held entries are kept only as names (<code>held_names<\/code>), with no detail, so a check can reject a draft that names one. The detention attorney stage has a dynamic source <code>{\"dynamic\": \"official_list\"}<\/code>: entries for the case's state (the church's home state if the case has none), detention-related first, at most 5; an entry the draft says is \"probably not useful for a detention call\" (the asylum-only center) is skipped. Rules in the check <code>official_list_rules<\/code>: a held entry is never named; a listed entry keeps its exact name and its own phone, email or link and is never called free (the roster does not say whether services are free); the caveat \"Listed by the U.S. Department of Justice. Listed does not mean recommended.\" is present; as-of dates are kept (pro bono list Updated October 2026, roster 10/04/26). The ABA detention entry lists the email route for a family member; the toll-free number on that page is for people held at military facilities and is not listed. Other states have no official section until their list is read and approved.<\/p>\n<h2 id=\"rules-the-seam-enforces\">Rules the seam enforces<\/h2>\n<ul>\n<li><strong>Chaining.<\/strong> <code>state.approved[stage_id]<\/code> holds approved or edited text. Later stages read it, never the raw draft.<\/li>\n<li><strong>Correction loop.<\/strong> Draft, check, on fail feed the reasons back and regenerate. <code>MAX_ATTEMPTS = 3<\/code> attempts total (first draft + 2 regenerations), so <code>retries &lt;= 2<\/code>. Then <code>status=\"escalated\"<\/code> with <code>draft=None<\/code>. An unsafe draft never reaches the gate. A Gloo 403 (<code>GuardrailBlock<\/code>) counts as a failed try.<\/li>\n<li><strong>Stop.<\/strong> <code>stop<\/code> returns <code>status=\"stopped\"<\/code>. <code>run_pipeline<\/code> halts on stopped, escalated, or error. Continue by hand with <code>state.set_manual(stage_id, text)<\/code> and <code>run_stage(next_id, state)<\/code>.<\/li>\n<li><strong>Edits.<\/strong> The pastor owns them. They are checked and any warnings go to the audit log. They are not blocked. The engine re-appends the disclaimer after an edit. <code>final<\/code> and <code>state.approved[stage]<\/code> always end with the disclaimer, once.<\/li>\n<li><strong>Reason categories.<\/strong> <code>banned_phrase<\/code> (prediction, advice, identity claim, specific-attorney recommendation), <code>ungrounded_claim<\/code> (link or bullet not in vetted sources), <code>missing_vetted_entry<\/code>, <code>missing_referral<\/code>, <code>format<\/code>, <code>length<\/code>, <code>language<\/code>, <code>stock_phrase<\/code>, <code>gloo_block<\/code>. They appear in each <code>check<\/code> / <code>draft_rejected<\/code> audit event and in <code>StageResult<\/code>.<\/li>\n<li><strong>Fault injection<\/strong> (<code>fault_injection={\"stage\": \"rights\", \"times\": 1, \"draft_suffix\": \"...\"}<\/code>). The engine appends <code>draft_suffix<\/code> to the first <code>times<\/code> drafts of that stage, after generation and before the checks. <code>times=1<\/code> gives reject, regenerate, pass. <code>times=3<\/code> gives escalation. Use <code>UNSAFE_SUFFIX<\/code> (Spanish) for a suffix that trips <code>banned_phrase<\/code> only. The rejected text goes to the audit log and <code>attempts<\/code> only. The gate and the pastor never get it.<\/li>\n<li><strong>Demo switch.<\/strong> <code>NURY_FORCE_REJECTION=1<\/code> forces exactly one rejection on stage 2 (rights): reject, regenerate, pass.<\/li>\n<li><strong>Cost.<\/strong> <code>cost_usd<\/code> is <code>None<\/code> unless you set <code>NURY_PRICE_IN<\/code> and <code>NURY_PRICE_OUT<\/code> (USD per 1M tokens).<\/li>\n<li><strong>Audit.<\/strong> <code>AuditLog(path=None)<\/code>. Pass a JSONL path to persist. Event kinds: <code>stage_start<\/code>, <code>gloo_call<\/code>, <code>gloo_block<\/code>, <code>check<\/code>, <code>draft_rejected<\/code> (holds the rejected text, <code>visible_to_pastor=False<\/code>), <code>escalated<\/code>, <code>gate<\/code>, <code>edit_check<\/code>, <code>error<\/code>. Each has a UTC <code>ts<\/code>. Never show <code>draft_rejected<\/code> in the pastor UI.<\/li>\n<li><strong>No send path.<\/strong> Nothing in this package sends anything to anyone.<\/li>\n<li><strong>Disclaimer.<\/strong> The engine supplies it. The UI must show it with every output.<\/li>\n<li><strong>Language.<\/strong> Triage is English for the pastor. Stages 2-5 use <code>state.language<\/code>.<\/li>\n<\/ul>\n<h2 id=\"example\">Example<\/h2>\n<pre><code class=\"language-python\">from nury.engine import *\nfrom nury.audit import AuditLog\n\nstate = CaseState(&quot;Carlos was taken by ICE tonight in Aurora, CO. Wife Maria, two kids. Spanish.&quot;)\naudit = AuditLog(&quot;audit.jsonl&quot;)\n\ndef gate(r):                       # replace with your UI\n    print(r.title, r.metrics, &quot;\\n&quot;, r.draft, &quot;\\n&quot;, r.disclaimer)\n    return GateDecision(&quot;approve&quot;)  # or GateDecision(&quot;edit&quot;, &quot;my text&quot;) or GateDecision(&quot;stop&quot;)\n\nfor r in run_pipeline(state, gate, audit=audit):\n    print(r.stage_id, r.status)\n\n# Show a rejected-and-regenerated draft (demo/test only):\n#   NURY_FORCE_REJECTION=1 python ...        # stage 2, once\n#   run_stage(&quot;rights&quot;, state, fault_injection={&quot;stage&quot;: &quot;rights&quot;, &quot;times&quot;: 1, &quot;draft_suffix&quot;: UNSAFE_SUFFIX})\n\n# Eval harness entrypoint with scripted gate decisions:\nstate, results, audit = run_scripted(intake, &quot;es&quot;, decisions={&quot;triage&quot;: (&quot;edit&quot;, &quot;my text&quot;), &quot;checklist&quot;: &quot;stop&quot;},\n                                     fault_injection={&quot;stage&quot;: &quot;rights&quot;, &quot;times&quot;: 3, &quot;draft_suffix&quot;: UNSAFE_SUFFIX})\n<\/code><\/pre>\n<h2 id=\"known-notes\">Known notes<\/h2>\n<ul>\n<li>Stage text comes from <code>code/playbooks/detention/sources/*.json<\/code> (vetted). Add church-vetted local attorneys to <code>attorney_directory.json<\/code> under <code>\"local\"<\/code>.<\/li>\n<li>Floor checks: <code>nury/guardrails.py<\/code>. Named playbook checks: <code>nury/checks.py<\/code>.<\/li>\n<li><code>draft<\/code> shown at the gate: <code>shown_text<\/code> starts with a label line (\"Borrador de Nury para revisi\u00f3n del pastor\") from <code>playbook.json<\/code>. <code>final<\/code> does not carry it.<\/li>\n<li>A call takes 4-20 s per stage. Run stages in a worker thread if the UI must stay responsive.<\/li>\n<\/ul><\/body><\/html>"}, {"id": "p11", "group": "Build", "label": "Prompt notes (v1 vs shipped)", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Prompt notes (v1 vs shipped)<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>code/playbooks/detention/PROMPT_NOTES.md<\/p><h1 id=\"prompt-notes-v1-vs-shipped-detention-and-hospital-playbooks\">Prompt notes: v1 vs shipped (detention and hospital playbooks)<\/h1>\n<p>Judges ask what changed and why. This file covers both playbooks: problems 1 to 12 and 14 to 16 are detention, 13 is hospital, and the rule changes (1, 5, 9, 14, 15) apply to both. Verbatim shipped prompts are in <code>code/playbooks/detention/prompts/*.txt<\/code> and <code>code/playbooks/hospital/prompts/*.txt<\/code>. Measured results are in <code>evaluations/results/<\/code> and the failure log in <code>evaluations/FAILURE_LOG.md<\/code>; this file explains the prompt side. The shared boundary rules are <code>SYSTEM_BOUNDARY<\/code> in <code>nury/guardrails.py<\/code>, prepended to every stage prompt.<\/p>\n<h2 id=\"v1\">v1<\/h2>\n<p>The v1 prompts came from the prework reference (<code>documents/prework/crisis_agent/stages.py<\/code>). The first live runs of the new core used the same wording with the engine's checks added.<\/p>\n<h2 id=\"what-was-wrong-with-v1-seen-in-live-runs-oct-6-and-7\">What was wrong with v1 (seen in live runs, Oct 6 and 7)<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Problem<\/th>\n<th>Seen in<\/th>\n<th>Fix in shipped version<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Output carried a header such as \"Preparada por el pastor\". It read as if a pastor wrote it.<\/td>\n<td>attorney, checklist<\/td>\n<td>Rule 9 in the boundary: no title, byline, signature, or line saying who wrote it. Banned-pattern check for \"prepared / written / drafted by the pastor\" (EN and ES). The engine adds the label \"Borrador de Nury para revisi\u00f3n del pastor\" to what the pastor sees.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>English scripture quote inside a Spanish message, plus a typo (\"prometeries\").<\/td>\n<td>pastoral<\/td>\n<td>Rule 8: one language, translate every quote, no scripture or quotes that are not in the sources. New <code>language<\/code> check rejects English words mixed into Spanish.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Rights brief had no fixed citation format. The model added a pastor note and \"---\" separators, and one bullet had no source.<\/td>\n<td>rights<\/td>\n<td>Prompt says \"end every bullet with its source name in parentheses\", \"output only the bullets and that sentence\". The <code>cited_bullets<\/code> check rejects any bullet without a vetted source name.<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Triage had free-form output. Missing facts were not always 3.<\/td>\n<td>triage<\/td>\n<td>Fixed labels and \"exactly 3 numbered facts\". <code>required_labels<\/code> and <code>numbered_after<\/code> checks.<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Disclaimer never said Nury is an AI assistant.<\/td>\n<td>all<\/td>\n<td>Disclaimer rewritten (EN and ES): \"Nury is an AI assistant, not a lawyer, pastor, counselor, or therapist.\" The loader refuses a playbook disclaimer that drops this wording.<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Links and phone numbers were only checked on two stages.<\/td>\n<td>all<\/td>\n<td>Floor check on every stage: a link or phone number must appear in the vetted sources or in approved earlier text.<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>An edited rights brief did not reach stages 3-5.<\/td>\n<td>attorney, checklist, pastoral<\/td>\n<td>Stage <code>deps<\/code> now include <code>rights<\/code>.<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Checks too strict: translated attorney names and \"---\" lines caused 3 false escalations.<\/td>\n<td>attorney, rights<\/td>\n<td>Attorney check matches vetted links, not names. Bullet check ignores separators.<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>The triage \"missing facts\" line gave an example that named an agency (\"for example, ICE\"). We decided no agency name appears on screen.<\/td>\n<td>triage<\/td>\n<td>Triage prompt: say \"immigration officers\", never name an agency, even if the pastor did. The <code>no_agency_names<\/code> check runs on triage, checklist, and pastoral. It stays off rights and attorney, whose vetted sources may name agencies.<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>The checklist named \"ICE\" and an \"ICE Detainee Locator\" that is not in the vetted sources (scenario 18). The agency check rejected it three times and the stage escalated.<\/td>\n<td>checklist<\/td>\n<td>Checklist prompt: use only the vetted points and plain questions for the attorney; name no agency, program, tool, website, or phone number that is not in the vetted points, even if the intake does; to help find the person, say \"ask the attorney how to find out where he or she is held\". The agency check is unchanged. Two live runs of scenario 18's intake passed on the first attempt.<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>(Superseded by 12: the sentence moved into the grounding skill.) The checklist still carried practical lines no vetted point supports: \"memorize the phone number\", \"leave copies with someone you trust\", \"do not post about this on social media\". Padding came partly from the fixed counts (5-7 steps, 4-5 items).<\/td>\n<td>checklist<\/td>\n<td>Prompt: every line must come from the vetted points or be a plain question for the attorney; the only other lines are the family's own IDs, papers and contact numbers under GATHER THESE DOCUMENTS; counts become \"up to 7\" and \"up to 5, as many as the points support\"; the three tips are named as banned unless a vetted point says so. Result on scenarios 1, 18, 20 (live): no escalation, 319 to 347 words, social-media line gone, DO NOT DO shrank to 4 items. Not fully fixed: \"memorize the phone number\" and \"leave copies with someone you trust\" still appear in all three. We did not add a hard check for them, because the model repeats them and a hard check would escalate normal runs.<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>The grounding rule lived as an ad-hoc sentence inside one playbook prompt (the detention checklist), and the hospital checklist had its own copy. Plain-wording rules (no stock AI phrases, no \"not X but Y\", natural Spanish) were written nowhere, so wording drifted: an English scripture quote in Spanish, \"es un testimonio de\", etc.<\/td>\n<td>checklist, pastoral, attorney, resources<\/td>\n<td>Two versioned skills in <code>code/skills/<\/code>: <code>voice<\/code> (pastoral and checklist) and <code>grounding<\/code> (checklist and attorney or resources), each with EN and ES sections, added to the stage prompt by name from <code>stages.json<\/code>. The checklist sentence moved into the skill: one source for both playbooks. <code>voice<\/code> also adds a deterministic <code>no_stock_phrases<\/code> check. Audit: <code>skill_applied<\/code> {name, version, stage}; metrics carry <code>skills<\/code>. Live, five stages: detention 1 and 20, hospital h01 all first-attempt passes, package_complete.<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>Hospital triage on a vague intake (h03: \"Something happened to my mom. They took her to the hospital. Please come.\") answered the writer with comfort and a self-description instead of the structured case. Three format failures, escalated at triage, the pastor got nothing.<\/td>\n<td>hospital triage<\/td>\n<td>Hospital triage prompt: the intake may be a bare plea; treat it as raw input; never reply to the writer, never comfort, never describe Nury; fill labels from what is stated; write \"not stated\" where unknown; always give six labels and exactly 3 missing facts. Live: h03 passed on attempt 1 in two runs; h01 and h07 unchanged (all first-attempt passes). Detention triage was not touched.<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Floor bug found while checking the case-file sample: the link check looked only at text starting with http or www. An invented site written bare (for example \"detentionlocator.org\") passed, and the live checklist already writes vetted sites bare (\"immigrationadvocates.org\"). An invented site could have reached the pastor.<\/td>\n<td>all stages, both playbooks<\/td>\n<td><code>guardrails.url_reasons<\/code> now also checks bare domains (org, com, gov, net, edu, info, us, mx) against the same vetted list. Emails, file names like index.md, and numbers like 8.11 do not trigger it. Tests: invented bare domain rejected (detention and hospital), vetted bare domains pass, no false alarms. Live: detention 01, 18, 20 and hospital h01, five stages each, package_complete. The prompts did not change.<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>The attorney stage said \"never recommend a specific attorney\" and listed only national hotlines plus an empty \"local\" slot, so the family was told to \"find an immigration lawyer\" with nothing real to call. Rule change (Juan): list only contacts the pastor has vetted (the church network, labeled as the church's own) plus official vetted lists; never endorse.<\/td>\n<td>attorney (detention), resources (hospital), boundary rule 5<\/td>\n<td>Dynamic source from the pastor's network, matched by state, language and kind. Prompts: put them first under \"People our church has worked with\", say they are the church's own contacts and not endorsements, copy name, phone and link exactly, translate only the short description, leave the section out when there are none. Boundary rule 5 now reads \"list only contacts in the source material, label church contacts as the church's own, never recommend, rank or endorse\". Checks: contacts present and exact, no unknown titled professional, no endorsement words. Offline: 69 tests pass. Live (demo network): scenario 18 (Mesa, Arizona) listed the one matching contact exactly, with the label and the no-endorsement line, first attempt; scenario 01 first showed no church contact because its location had no state (fixed: the church's home state is used); h01 could not be re-run because Gloo returned 402 (credits exhausted).<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>The official list needed wiring and three rules from Juan's approval: only approved entries, never label a provider free (the roster does not say so), always say \"listed does not mean recommended\". Two problems showed while wiring it: (a) the ABA entry's toll-free number is for people held at military facilities, so showing it to a family would mislead; (b) the language check flagged English names of vetted organizations inside Spanish text, which would have escalated normal runs; and the endorsement check flagged the caveat itself (\"does not mean recommended\").<\/td>\n<td>attorney (detention)<\/td>\n<td>Built <code>official_list.json<\/code> from the approved draft: 18 providers, held entries kept as names only. Prompt: a \"Listed by the U.S. Department of Justice\" section with the caveat once, never free or low cost, leave out when none. Check <code>official_list_rules<\/code> (held name rejected, exact name with own contact, no free words in the entry's lines, caveat present, entry not dropped). ABA entry uses the email route only. Reason, from the DOJ pro bono list: \"To contact on behalf of an individual detained by ICE or BOP, email immcenter@americanbar.org\" and \"Respondents detained at Department of Defense (DOD) military facilities (including Guantanamo) should contact our toll-free hotline at 1 (855) 641-6081\". The toll-free number is for people held at military facilities, so it is never shown to a family. Kept by hack-sensei's decision (2026-10-07). Language check ignores names of vetted contacts. Endorsement check lets a negated phrase through (\"no significa que sea recomendado\"). Offline: 79 tests pass. Live: not yet run (Gloo credits exhausted); owed.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"model-behavior\">Model behavior<\/h2>\n<p>Asked to write legal advice, the model refused, so we could not make it fail on demand. The demo and the eval use fault injection instead: a forced unsafe suffix on the draft. It is deterministic and costs no extra Gloo call.<\/p>\n<h2 id=\"one-prompt-before-and-after-the-family-checklist\">One prompt, before and after: the family checklist<\/h2>\n<p>v1 (from the prework reference, <code>documents/prework/crisis_agent/stages.py<\/code>), after its short boundary block:<\/p>\n<blockquote>\n<p>Write a tonight-only checklist for a family whose loved one was just detained, in Spanish. Three sections: DO TONIGHT (5-7 concrete steps), DO NOT DO (4-5 items), GATHER THESE DOCUMENTS (IDs, paperwork, contact numbers). General information only, no case-specific legal strategy.<\/p>\n<\/blockquote>\n<p>Shipped (<code>prompts/checklist.txt<\/code>), with the boundary rules and the <code>voice<\/code> and <code>grounding<\/code> skills added by the engine:<\/p>\n<blockquote>\n<p>Task: write a tonight-only checklist in {{lang_name}}. Three sections with these exact headings in English caps (you may add the translation after a slash): DO TONIGHT, DO NOT DO, GATHER THESE DOCUMENTS. DO TONIGHT: up to 7 steps, as many as the vetted points and attorney questions support. DO NOT DO: up to 5 items, as many as the vetted points support. GATHER THESE DOCUMENTS: IDs, paperwork, contact numbers. Base 'DO NOT DO' only on the vetted points below. General information only. Do not name any agency, program, tool, website, or phone number that is not in the vetted points, even if the intake does. To help the family find where the person is held, tell them to ask the attorney how to find out where he or she is held.<\/p>\n<\/blockquote>\n<p>What changed and why: fixed counts became \"up to\" because they pushed padding (problem 11); the vetted points are now in the prompt, so every \"DO NOT DO\" item can be traced to a source; naming a tool or agency outside the sources is forbidden because scenario 18 escalated on it (problem 10); the legal-strategy ban moved from this prompt into the engine's boundary rules, which every stage shares.<\/p>\n<h2 id=\"privacy-what-the-model-sees\">Privacy: what the model sees<\/h2>\n<p>Prompts did not change. <code>PrivacyClient<\/code> adds one short note to the request only when tokens are present (\"Tokens such as [PERSON_1] stand for real names... copy them exactly\"). Live A/B on scenarios 01, 18 and hospital h01, privacy off vs on, same prompts: every stage passed on attempt 1 in both modes; outcome package_complete in all six runs; no broken sentence and no stray token; latency 37 s vs 38 s, 37 s vs 37 s, 48 s vs 53 s; input tokens +4% to +5% (15,998 to 16,629; 11,687 to 12,202; 14,408 to 15,013); output tokens within 6%; the privacy-off runs sent names such as Jose, Maria Lopez, Rosa Delgado to the model, the privacy-on runs sent none (checked on the real request bodies). Checklist length 355 to 392 words off, 362 to 381 on.<\/p>\n<h2 id=\"known-limitations-honest-gaps\">Known limitations (honest gaps)<\/h2>\n<ul>\n<li><strong>Privacy removes direct identifiers only.<\/strong> Names the pastor protected, phones, emails, street addresses, dates, A-numbers, case numbers and ID numbers go out as tokens. Cities and states stay, because the family's place is part of the meaning. Context can still hint at who a person is (\"14 years\", \"his workplace\", a rare job). A name the pastor did not protect is not removed. A mangled token the model invents is repaired or shown as a gap, and costs up to two extra calls.<\/li>\n<li><strong>Two unsourced practical lines remain in the detention checklist.<\/strong> \"Memorize the phone number\" and \"leave copies of documents with someone you trust\" still appear in live runs (scenarios 1, 18, 20), even with the grounding skill and an explicit ban. They are not legal advice, predictions, or invented facts, and no vetted point says them. We accepted them. We did not add a hard check, because the model repeats them and a check would escalate normal runs. Tracked in the failure log.<\/li>\n<li><strong>Grounding is not airtight.<\/strong> The hospital h01 checklist once added \"do not share Luis's personal information with people outside the care team\", which no vetted point states. The grounding skill lowers this kind of line but does not remove it. No check flags it. It is not advice or a prediction.<\/li>\n<li><strong>The before and after comparison for judges is not built into the engine.<\/strong> Skills can be switched off per call (<code>skills=False<\/code>) or for the process (<code>NURY_SKILLS=off<\/code>), so the eval can run the same scenarios with skills on and off and compare.<\/li>\n<li><strong>Skills change wording, not meaning.<\/strong> The <code>voice<\/code> check catches stock AI phrases and the \"not X but Y\" tic. It does not measure how natural the Spanish sounds. A tone judge, or the pastor, does that.<\/li>\n<\/ul><\/body><\/html>"}, {"id": "p12", "group": "Build", "label": "Prompt notes (canvas)", "html": "<div style='position:sticky;top:0;z-index:9;background:#171a21;color:#9a978f;font:13px system-ui;padding:6px 12px;border-bottom:1px solid #262a33'>Reading copy. Buttons work in the agent's Canvas tab.<\/div><!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Nury prompt notes<\/title>\n<style>\n:root{--bg:#faf8f4;--fg:#1f2328;--mut:#5b636b;--card:#fff;--line:#e3ded4;--acc:#7a4b1e;--chip:#efe8da;--on:#7a4b1e;--onfg:#fff}\n@media (prefers-color-scheme:dark){:root{--bg:#16181b;--fg:#e8e6e1;--mut:#9aa1a8;--card:#1f2226;--line:#33373c;--acc:#e0b27a;--chip:#2a2d31;--on:#e0b27a;--onfg:#16181b}}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:24px 16px 56px}\nh1{font-size:1.5rem;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}\n.intro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}\n.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}\nbutton.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}\nbutton.chip[aria-pressed=true]{background:var(--on);color:var(--onfg);border-color:var(--on)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}\n.card h2{font-size:1rem;margin:0 0 6px}.num{display:inline-block;min-width:1.7em;color:var(--acc);font-weight:700}\n.tag{display:inline-block;font-size:.75rem;background:var(--chip);border-radius:6px;padding:1px 7px;margin-right:6px;color:var(--mut)}\n.lab{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:10px 0 2px}\n.card p{margin:0}.note{border-left:3px solid var(--acc);padding:4px 12px;color:var(--mut)}\n<\/style><\/head><body><main>\n<h1>Prompt notes: v1 vs shipped<\/h1><p class=\"sub\" id=\"sub\"><\/p>\n<div class=\"intro\" id=\"intro\"><\/div>\n<div class=\"bar\" id=\"bar\" role=\"group\" aria-label=\"Filter by stage\"><\/div>\n<div id=\"list\"><\/div>\n<h2 style=\"font-size:1rem\">Model behavior<\/h2><p class=\"note\" id=\"note\"><\/p>\n<script type=\"application/json\" id=\"page-data\">{\"generatedAt\": \"2026-10-06\", \"source\": \"code/playbooks/detention/PROMPT_NOTES.md\", \"intro\": \"Judges ask what changed and why. The shipped prompts are in the repo under code/playbooks/detention/prompts/. The shared boundary rules are in nury/guardrails.py and go in front of every stage prompt. The v1 prompts came from the prework reference. The first live runs of the new core used the same wording with the engine's checks added.\", \"rows\": [{\"n\": 1, \"problem\": \"Output carried a header such as \\\"Preparada por el pastor\\\". It read as if a pastor wrote it.\", \"seen\": [\"attorney\", \"checklist\"], \"fix\": \"Rule 9 in the boundary: no title, byline, signature, or line saying who wrote it. Banned-pattern check for \\\"prepared / written / drafted by the pastor\\\" (EN and ES). The engine adds the label \\\"Borrador de Nury para revisi\u00f3n del pastor\\\" to what the pastor sees.\"}, {\"n\": 2, \"problem\": \"English scripture quote inside a Spanish message, plus a typo (\\\"prometeries\\\").\", \"seen\": [\"pastoral\"], \"fix\": \"Rule 8: one language, translate every quote, no scripture or quotes that are not in the sources. New `language` check rejects English words mixed into Spanish.\"}, {\"n\": 3, \"problem\": \"Rights brief had no fixed citation format. The model added a pastor note and \\\"---\\\" separators, and one bullet had no source.\", \"seen\": [\"rights\"], \"fix\": \"Prompt says \\\"end every bullet with its source name in parentheses\\\", \\\"output only the bullets and that sentence\\\". The `cited_bullets` check rejects any bullet without a vetted source name.\"}, {\"n\": 4, \"problem\": \"Triage had free-form output. Missing facts were not always 3.\", \"seen\": [\"triage\"], \"fix\": \"Fixed labels and \\\"exactly 3 numbered facts\\\". `required_labels` and `numbered_after` checks.\"}, {\"n\": 5, \"problem\": \"Disclaimer never said Nury is an AI assistant.\", \"seen\": [\"all\"], \"fix\": \"Disclaimer rewritten (EN and ES): \\\"Nury is an AI assistant, not a lawyer, pastor, counselor, or therapist.\\\" The loader refuses a playbook disclaimer that drops this wording.\"}, {\"n\": 6, \"problem\": \"Links and phone numbers were only checked on two stages.\", \"seen\": [\"all\"], \"fix\": \"Floor check on every stage: a link or phone number must appear in the vetted sources or in approved earlier text.\"}, {\"n\": 7, \"problem\": \"An edited rights brief did not reach stages 3-5.\", \"seen\": [\"attorney\", \"checklist\", \"pastoral\"], \"fix\": \"Stage `deps` now include `rights`.\"}, {\"n\": 8, \"problem\": \"Checks too strict: translated attorney names and \\\"---\\\" lines caused 3 false escalations.\", \"seen\": [\"attorney\", \"rights\"], \"fix\": \"Attorney check matches vetted links, not names. Bullet check ignores separators.\"}, {\"n\": 9, \"problem\": \"The triage \\\"missing facts\\\" line gave an example that named an agency (\\\"for example, ICE\\\"). We decided no agency name appears on screen.\", \"seen\": [\"triage\"], \"fix\": \"Triage prompt: say \\\"immigration officers\\\", never name an agency, even if the pastor did. The `no_agency_names` check runs on triage, checklist, and pastoral. It stays off rights and attorney, whose vetted sources may name agencies.\"}], \"note\": \"Asked to write legal advice, the model refused, so we could not make it fail on demand. The demo and the eval use fault injection instead: a forced unsafe suffix on the draft. It is deterministic and costs no extra Gloo call.\"}<\/script>\n<script>\nconst D=JSON.parse(document.getElementById('page-data').textContent);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\ndocument.getElementById('sub').textContent='Reading copy of '+D.source+' \u00b7 '+D.generatedAt+' \u00b7 '+D.rows.length+' problems';\ndocument.getElementById('intro').textContent=D.intro;\ndocument.getElementById('note').textContent=D.note;\nconst stages=['*',...new Set(D.rows.flatMap(r=>r.seen).filter(x=>x!=='all'))];let cur='*';\nfunction bar(){const b=document.getElementById('bar');b.innerHTML=stages.map(s=>`<button class=\"chip\" aria-pressed=\"${s===cur}\" data-s=\"${esc(s)}\">${s==='*'?'Every stage':esc(s)}<\/button>`).join('');\nb.querySelectorAll('button').forEach(x=>x.onclick=()=>{cur=x.dataset.s;bar();list()})}\nfunction list(){document.getElementById('list').innerHTML=D.rows.filter(r=>cur==='*'||r.seen.includes(cur)||r.seen.includes('all')).map(r=>`<section class=\"card\"><h2><span class=\"num\">${r.n}<\/span>${esc(r.problem)}<\/h2>\n<div>${r.seen.map(s=>`<span class=\"tag\">${esc(s)}<\/span>`).join('')}<\/div><div class=\"lab\">Fix in the shipped version<\/div><p>${esc(r.fix)}<\/p><\/section>`).join('')}\nbar();list();\n<\/script><\/main><\/body><\/html>"}, {"id": "p13", "group": "Evidence", "label": "Detention scorecard (interim)", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewp
