has passed or is near. Confirm each one is still active before you approve it.<\/p>'+P.map(card).join('')+'<h2>The rest<\/h2>':'')+O.map(card).join('');\n $('list').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{state[b.dataset.id]=b.dataset.d;\n  try{maestro.send('click','decide:'+b.dataset.id,{id:b.dataset.id,decision:b.dataset.d})}catch(e){}render()})}\nrender();\n<\/script><\/body><\/html>"}, {"id": "p24", "group": "Presentation", "label": "250-word description", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>250-word description<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>presentation/description.txt<\/p><pre style='white-space:pre-wrap'>Nury \u2014 the crisis-response agent for solo pastors.\n\nNury is a crisis-management engine that runs playbooks. Its first playbook is a family detention.\n\nIt is 2 AM. A solo pastor has no staff and no lawyer on the line. A panicked immigrant family calls: a relative was detained. The pastor has only a phone.\n\nNury turns that call into a complete response package. The pastor types what the family said. Nury runs five stages: triage the case, write a plain-language rights brief, list attorney resources, build a family checklist, and draft a short pastoral message. Family materials come out in Spanish.\n\nThe pastor stays in charge. After every stage, the pastor can Approve, Edit, or Stop. Later stages use the pastor's edits. Nury has no send path. Nothing reaches the family except through the pastor.\n\nNury gives legal information only, never advice or predictions. Every rights point cites a vetted source file. There is no open web. Every output carries a disclaimer and urges an attorney. Nury never recommends a specific attorney. Nury is not a pastor, counselor, or lawyer.\n\nEach draft passes a guardrail check. An unsafe draft is rejected and regenerated, up to three tries, then escalated. The pastor never sees it.\n\nNury runs on Gloo's guarded Responses endpoint. We tested 20 hand-built scenarios. Results: [PLACEHOLDER: scorecard numbers].\n\nEvaluation harness uses the Jev decision API (my prior project) as typed judges; disclosed as prior technology per the rules.\n\nEntry by Juan Pelaez, 3Metas.\n<\/pre><\/body><\/html>"}, {"id": "p25", "group": "Presentation", "label": "Deck", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Nury pitch deck<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#0d1015;--surface:#131824;--text:#ece7dc;--muted:#9a9a9a;--amber:#e8a33d;--ok:#5fb37c;--bad:#d9605a}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:Inter,system-ui,sans-serif}\n.slide{display:none;min-height:100vh;padding:6vh 7vw;flex-direction:column;justify-content:center;gap:2.2vh}\n.slide.on{display:flex}\nh1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;line-height:1.1}\nh1{font-size:clamp(44px,8vw,96px)} h2{font-size:clamp(30px,4.6vw,56px)}\np,li{font-size:clamp(18px,2.4vw,30px);line-height:1.4;margin:0}\nul{margin:0;padding-left:1.1em;display:grid;gap:1.4vh}\n.amber{color:var(--amber)} .muted{color:var(--muted);font-size:clamp(14px,1.6vw,20px)}\n.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2vw}\n.card{background:var(--surface);border-radius:14px;padding:2.2vh 1.6vw;border-top:3px solid var(--amber)}\n.card b{display:block;margin-bottom:.6vh;font-family:Fraunces,serif}\n.card p{font-size:clamp(15px,1.7vw,22px)}\n.chip{display:inline-block;padding:.2em .7em;border-radius:99px;font-size:clamp(14px,1.6vw,20px);color:#0d1015}\n.bad{background:var(--bad)} .ok{background:var(--ok)}\n.ph{outline:2px dashed var(--amber);padding:0 .3em;color:var(--amber)}\n.foot{position:fixed;bottom:2vh;left:7vw;right:7vw;display:flex;justify-content:space-between;color:var(--muted);font-size:14px}\n.flow{list-style:none;margin:0;padding:0;counter-reset:n;display:grid;gap:1.6vh;max-width:62ch}\n.flow li{counter-increment:n;display:grid;grid-template-columns:2.2em 1fr;column-gap:.4em;font-size:clamp(18px,2.4vw,30px);line-height:1.3}\n.flow li::before{content:counter(n);color:var(--amber);font-family:Fraunces,serif;font-weight:600;grid-row:span 2}\n.flow b{font-family:Fraunces,serif;font-weight:600}\n.flow span{color:var(--muted);font-size:clamp(15px,1.8vw,22px)}\n.proof{border-collapse:collapse;font-size:clamp(18px,2.4vw,30px);max-width:62ch;width:100%}\n.proof th{text-align:left;font-weight:400;padding:1.2vh 1.5vw 1.2vh 0;border-bottom:1px solid #263044}\n.proof td{padding:1.2vh 0;border-bottom:1px solid #263044}\n::selection{background:var(--amber);color:var(--ink)}\n:focus-visible{outline:2px solid var(--amber);outline-offset:3px}\nh1,h2{text-wrap:balance}\n.shot{min-height:22vh;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(15px,1.8vw,22px);max-width:62ch;padding:2vh 2vw}\n.sel{list-style:none;padding:0;display:grid;gap:1vh}.sel span{color:var(--muted);font-size:.8em;margin-left:.6em}.sel span.ph{color:var(--amber)}\n@media print{.slide{display:flex;page-break-after:always}.foot{display:none}}\n<\/style><\/head><body>\n\n<section class=\"slide on\" id=\"s1\"><!-- 0:00 -->\n<h1>Nury<\/h1>\n<p>The crisis-response agent for solo pastors.<\/p>\n<p class=\"muted\">Juan Pelaez \u00b7 3Metas \u00b7 Gloo AI Hackathon \u00b7 Track 1<\/p><\/section>\n\n<section class=\"slide\" id=\"s2\">\n<h2><span class=\"amber\">2:07 AM.<\/span> A solo pastor's phone rings.<\/h2>\n<ul>\n<li>A solo pastor. No staff. No lawyer on the line.<\/li>\n<li>A panicked call from an immigrant family. Sunday afternoon, or 2 AM.<\/li>\n<li>They have a phone and a few minutes.<\/li><\/ul>\n<p class=\"amber\">Nury is humanitarian and takes no political side. The subject is a family and a night.<\/p><\/section>\n\n<section class=\"slide\" id=\"s2b\">\n<h2>The app opens on a crisis selector<\/h2>\n<div class=\"shot ph\">[SCREENSHOT SLOT: crisis selector from the live app, phone width. Capture after hack-artisans ships it.]<\/div>\n<ul class=\"sel\">\n<li><b>Detention<\/b> <span>flagship, the demo<\/span><\/li>\n<li><b>Hospital emergency<\/b> <span class=\"ph\">[confirm live in writing before showing]<\/span><\/li>\n<li><b>Sudden death in a family<\/b> <span>coming soon<\/span><\/li>\n<li><b>House fire or displacement<\/b> <span>coming soon<\/span><\/li><\/ul>\n<p class=\"muted\">Each card is a playbook. Nothing is claimed about the coming-soon cards.<\/p><\/section>\n\n<section class=\"slide\" id=\"s3\">\n<h2>Playbook #1: detention. Five stages, the pastor decides each.<\/h2>\n<ol class=\"flow\">\n<li><b>Triage<\/b><span>States the facts without advice.<\/span><\/li>\n<li><b>Rights brief<\/b><span>Family's language. Vetted source. Every point cited.<\/span><\/li>\n<li><b>Attorney resources<\/b><span>Hotlines and church-vetted entries. Never one named attorney.<\/span><\/li>\n<li><b>Family checklist<\/b><span>Do tonight. Do not do. Gather these documents.<\/span><\/li>\n<li><b>Pastoral message<\/b><span>Under 120 words. Warm and steady.<\/span><\/li><\/ol>\n<p class=\"muted\">Demo: Maria, Jose, two children (8 and 11). Live app or the 90-second video.<\/p><\/section>\n\n<section class=\"slide\" id=\"s4\">\n<h2>Safety you can see<\/h2>\n<p>Approve \u00b7 Edit \u00b7 Stop after every stage.<\/p>\n<p><span class=\"chip bad\">Draft rejected by guardrail<\/span> \u2192 Regenerating (2 of 3) \u2192 <span class=\"chip ok\">Passed<\/span><\/p>\n<ul><li>Up to three tries, then escalate to the pastor.<\/li>\n<li>The pastor never sees the unsafe draft.<\/li>\n<li>Nury has no send path. The pastor copies the text and sends it by hand.<\/li><\/ul><\/section>\n\n<section class=\"slide\" id=\"s5\">\n<h2>How it is built<\/h2>\n<ul>\n<li>One engine runs crisis playbooks. Detention is playbook #1.<\/li>\n<li>Adding a crisis is adding a playbook folder. The engine does not change. Tested with a test playbook.<\/li>\n<li>Gloo guarded Responses endpoint.<\/li>\n<li>Legal information only, from a vetted source file. No open web.<\/li>\n<li>Nury is not a pastor, counselor, therapist or lawyer, and says so on every output.<\/li>\n<li>English screen for the pastor. Spanish output for the family.<\/li><\/ul><\/section>\n\n<section class=\"slide\" id=\"s6\">\n<h2>Proof<\/h2>\n<p>Hand-built scenarios, scored by typed judges.<\/p>\n<table class=\"proof\">\n<tr><th>Pass rate<\/th><td class=\"ph\">[PLACEHOLDER]<\/td><\/tr>\n<tr><th>Drafts rejected and regenerated<\/th><td class=\"ph\">[PLACEHOLDER]<\/td><\/tr>\n<tr><th>Cost per run<\/th><td class=\"ph\">[PLACEHOLDER]<\/td><\/tr>\n<tr><th>Latency per run<\/th><td class=\"ph\">[PLACEHOLDER]<\/td><\/tr>\n<tr><th>Hospital scenarios and pass rate<\/th><td class=\"ph\">[PLACEHOLDER, only if confirmed]<\/td><\/tr><\/table>\n<p class=\"muted\">Fill from hack-artisans' real scorecard only (not the mock). No real numbers by Oct 7 16:00 MDT: delete this slide.<\/p>\n<p class=\"muted\">Evaluation harness uses the Jev decision API (my prior project) as typed judges; disclosed as prior technology per the rules.<\/p><\/section>\n\n<section class=\"slide\" id=\"s7\">\n<h2>Who built it<\/h2>\n<ul><li>Juan Pelaez, 3Metas.<\/li>\n<li>A small team of AI agents, coordinating over a messaging protocol.<\/li>\n<li>Every step is in the commit log.<\/li><\/ul>\n<p class=\"muted\">Named for Juan's late t\u00eda Nury, always ready to help at her church.<\/p><\/section>\n\n<section class=\"slide\" id=\"s8\">\n<h1>Nury<\/h1>\n<p>The crisis-response agent for solo pastors.<\/p>\n<p class=\"muted\">Legal information only. Not legal advice.<\/p><\/section>\n\n<div class=\"foot\"><span>Nury<\/span><span id=\"n\">1 / 9<\/span><\/div>\n<script>\nconst S=[...document.querySelectorAll('.slide')];let i=0;\nfunction go(k){i=Math.max(0,Math.min(S.length-1,k));S.forEach((s,j)=>s.classList.toggle('on',j===i));document.getElementById('n').textContent=(i+1)+' / '+S.length}\ngo(0);\naddEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key))go(i+1);if(['ArrowLeft','PageUp'].includes(e.key))go(i-1)});\naddEventListener('click',e=>go(e.clientX>innerWidth/2?i+1:i-1));\n<\/script><\/body><\/html>\n"}, {"id": "p26", "group": "Presentation", "label": "Pitch script (3 min)", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Pitch script (3 min)<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>presentation/PITCH_SCRIPT.md<\/p><h1 id=\"nury-3-minute-pitch-script\">Nury: 3-minute pitch script<\/h1>\n<p>Speaker: Juan Pelaez (3Metas). Target 3:00 spoken at a calm pace (about 140 words a minute, about 400 words).\nTags: <code>[90s]<\/code> lines stay in the 90-second cut. Untagged lines are 3-minute only.\nFamily and intake: see <code>SHARED_DEMO.md<\/code>. Slide numbers match <code>deck.html<\/code>.\n<code>[NUMBER]<\/code> = placeholder. Fill from hack-artisans' scorecard only. If no real number exists, say the fallback line.<\/p>\n<h2 id=\"000-to-025-slide-1-and-2-the-user-conceptproduct\">0:00 to 0:25  Slide 1 and 2: the user  (Concept/Product)<\/h2>\n<p>[90s] It is 2 AM. A solo pastor's phone rings.\n[90s] A family. A husband was detained last evening. The pastor has no staff and no lawyer on the line.\n[90s] The pastor wants to help. But they are not a lawyer. They have minutes, and a phone.\nThat is the job Nury is built for.\n[90s] Nury. The crisis-response agent for solo pastors.<\/p>\n<h2 id=\"025-to-135-slide-3-live-demo-product-use-of-ai\">0:25 to 1:35  Slide 3: live demo  (Product, Use of AI)<\/h2>\n<p>Play the 90-second video, or run the app live on the locked intake. Speak over it or cue it.\n[90s] The pastor types what the family said. Nury runs five stages: triage, rights brief, attorney resources, a family checklist, and a pastoral message.\n[90s] After every stage, the pastor decides: Approve, Edit, or Stop. Later stages use the pastor's edits.\n[90s] Watch this. A draft crosses from information into advice. Nury rejects it and regenerates. The pastor never sees it.\n[90s] The rights brief comes out in Spanish, built only from a vetted source, every point cited.\n[90s] At the end, the pastor has a package. Copy, not Send. Nury never sends. The pastor does.<\/p>\n<h2 id=\"135-to-210-slide-4-and-5-why-it-works-innovation-use-of-ai\">1:35 to 2:10  Slide 4 and 5: why it works  (Innovation, Use of AI)<\/h2>\n<p>Nury is a crisis-management engine. The app opens on a crisis selector. Each card is a playbook. Detention is the one you just saw.\n[ONLY AFTER SENSEI CONFIRMS IN WRITING THAT HOSPITAL RUNS AND IS SCORED] A second playbook, hospital emergency, runs on the same engine. [PLACEHOLDER: hospital scenario count and pass rate from the scorecard]\nTwo more cards, sudden death in a family and house fire or displacement, say coming soon. Say nothing more about them.\nAdding a crisis is adding a playbook folder. The engine does not change. We tested that with a test playbook. Until sensei confirms hospital in writing, say only that detention runs and is scored.\nTwo design choices keep the pastor in control.\nFirst, the approval gate. The agent drafts. The pastor decides. Nothing reaches the family except through the pastor's hands.\nSecond, the self-correction loop. Every draft is checked. Unsafe drafts are rejected and regenerated, up to three tries, then handed to the pastor. The pastor never sees the unsafe one.\nNury runs on Gloo's guarded Responses endpoint. It gives legal information only, from a vetted source file. No open web. It is not a pastor, a counselor, or a lawyer, and it says so.<\/p>\n<h2 id=\"210-to-240-slide-6-proof-impact-and-execution\">2:10 to 2:40  Slide 6: proof  (Impact and Execution)<\/h2>\n<p>We tested it.\n[ONLY IF TRUE] Twenty hand-built scenarios, scored by typed judges. [NUMBER: pass rate], [NUMBER: drafts rejected and regenerated], [NUMBER: cost per run], [NUMBER: latency per run].\nFallback if no scorecard: \"We built twenty scenarios and scored each stage. The scorecard is in our build document.\"\nThe harness uses the Jev decision API, my prior project, as typed judges. Disclosed as prior technology per the rules.<\/p>\n<h2 id=\"240-to-300-slide-7-and-8-team-and-close-teamworkpresentation\">2:40 to 3:00  Slide 7 and 8: team and close  (Teamwork/Presentation)<\/h2>\n<p>Built by Juan Pelaez at 3Metas, with a small team of AI agents that coordinate over a messaging protocol. Every step is in the commit log.\n[90s] Nury is named for my late t\u00eda Nury, a woman who was always ready to help at her church.\n[90s] The next call will come. Nury is there when the pastor picks up.\n[90s] Nury. The crisis-response agent for solo pastors.<\/p>\n<h2 id=\"90-second-cut-how-to-run-it\">90-second cut: how to run it<\/h2>\n<p>Say only the <code>[90s]<\/code> lines. Run the 90-second video over the demo lines. Drop slides 4 to 6.\nJudges' rules doc says 90 s, Discord says 3 min. Verify at the venue. Both versions are ready.<\/p>\n<h2 id=\"rules-for-the-speaker\">Rules for the speaker<\/h2>\n<ul>\n<li>Say \"legal information\", never \"legal advice\".<\/li>\n<li>Never say Nury \"helps the family directly\". It helps the pastor, who helps the family.<\/li>\n<li>Do not name an agency or a party. Humanitarian, never political.<\/li>\n<li>Do not claim a pastor tested it. We have not validated with one. Say so if asked.<\/li>\n<\/ul><\/body><\/html>"}, {"id": "p27", "group": "Presentation", "label": "Finalist script (90 s)", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Finalist script (90 s)<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:to <td>0:23-0:28<\/td>\n<td>Shot 4: Approve pulse<\/td>\n<td>\"After every stage, the pastor decides.\"<\/td>\n<td>Approve / Edit / Stop<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>0:28-0:40<\/td>\n<td>Shot 5: Spanish rights brief, citation chip<\/td>\n<td>\"Rights in the family's own language. Built only from a vetted source. Every point cited.\"<\/td>\n<td>2 Rights brief. Vetted sources only.<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>0:40-0:52<\/td>\n<td>Shot 6: guardrail strip, no draft text<\/td>\n<td>\"When a draft crosses the line from information into advice, Nury rejects it and tries again. The pastor never sees it.\"<\/td>\n<td>Rejected. Regenerating (2 of 3). Passed.<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>0:52-1:00<\/td>\n<td>Shot 7: attorney resources, checklist<\/td>\n<td>\"Attorney hotlines. A checklist for tonight.\"<\/td>\n<td>3 Attorneys \u00b7 4 Checklist<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>1:00-1:08<\/td>\n<td>Shot 8: pastoral message, one edit<\/td>\n<td>\"And a short, warm message, in the pastor's hands to edit.\"<\/td>\n<td>5 Pastoral message<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>1:08-1:16<\/td>\n<td>NEW proof beat: scorecard card on ink, large numbers<\/td>\n<td>\"We tested it. [NUMBER: pass rate] across [NUMBER: scenarios] scenarios. [NUMBER: rejected drafts] unsafe drafts caught and regenerated.\" [Fallback: \"We tested it on hand-built scenarios. The scorecard is in our build document.\"]<\/td>\n<td>Real numbers only<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>1:16-1:24<\/td>\n<td>Shot 9: Copy, no Send; disclaimer<\/td>\n<td>\"Nury is not a pastor, and it never sends. The pastor does.\"<\/td>\n<td>Nury does not send. The pastor does.<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>1:24-1:30<\/td>\n<td>Shot 10: end card<\/td>\n<td>\"Nury. The crisis-response agent for solo pastors.\"<\/td>\n<td>Nury \u00b7 Legal information only. Not legal advice.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>VO is about 120 words. Silence is fine.<\/p>\n<h2 id=\"notes\">Notes<\/h2>\n<ul>\n<li>Re-time storyboard shots 1-10 to the table. Shots 1-5, 7, 8 are unchanged footage. Shot 6 gets 12 s (was 12). Shot 9 is the only new footage: a still card, no recording.<\/li>\n<li>Drop shot 9's proof beat if numbers are not real. Give the 8 s back to shots 5 and 6.<\/li>\n<li>Jev disclosure: not in the video. It lives in the submission text and the deck proof slide.<\/li>\n<li>Check every frame for keys, tokens and terminal history before export.<\/li>\n<\/ul><\/body><\/html>"}, {"id": "p28", "group": "Presentation", "label": "Shared demo", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Shared demo<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>presentation/SHARED_DEMO.md<\/p><h1 id=\"shared-demo-one-family-one-intake-one-vo\">Shared demo: one family, one intake, one VO<\/h1>\n<p>Locked by hack-ninja with hack-video. Deck, pitch, finalist script and video all use this. Change it here first.<\/p>\n<h2 id=\"the-family\">The family<\/h2>\n<p>Maria (caller, Spanish-speaking), Jose (her husband, detained), two children, 8 and 11, both US citizens. Aurora. Jose has lived here 14 years. Synthetic. No real people, no real numbers.<\/p>\n<h2 id=\"the-intake-what-the-pastor-types\">The intake (what the pastor types)<\/h2>\n<p>\"Maria called at 2:07 AM, very upset, speaking Spanish. Her husband Jose was detained by immigration officers outside his workplace in Aurora around 6 PM yesterday. She does not know if the officers showed a warrant. Jose has lived here 14 years. They have two children, 8 and 11, both US citizens. Maria is afraid to leave the house tomorrow. She wants to know what to do tonight.\"<\/p>\n<p>Changes from <code>demo_scenario.py<\/code>: time 9:10 PM to 2:07 AM; \"ICE\" to \"immigration officers\" (humanitarian, no agency name on screen); \"today\" to \"yesterday\" so 2 AM reads true. The app run must use this exact text. Owner of the code change: hack-artisans.<\/p>\n<h2 id=\"guardrail-beat\">Guardrail beat<\/h2>\n<p>Status strip only: \"Draft rejected by guardrail. Regenerating (2 of 3).\" then green \"Passed\". Never show the unsafe text. Three attempts total: first draft plus two regenerations.<\/p>\n<h2 id=\"locked-vo-90-s-video\">Locked VO (90 s video)<\/h2>\n<ol>\n<li>\"It is two in the morning. A family is calling their pastor.\"<\/li>\n<li>\"Her husband was detained last evening. The pastor has no staff, and no lawyer on the line.\"<\/li>\n<li>\"Nury turns the call into a clear case. Facts only. No advice.\"<\/li>\n<li>\"After every stage, the pastor decides.\"<\/li>\n<li>\"Rights in the family's own language. Built only from a vetted source. Every point cited.\"<\/li>\n<li>\"When a draft crosses the line from information into advice, Nury rejects it and tries again. The pastor never sees it.\"<\/li>\n<li>\"Attorney hotlines. A checklist for tonight.\"<\/li>\n<li>\"And a short, warm message, in the pastor's hands to edit.\"<\/li>\n<li>\"Nury is not a pastor, and it never sends. The pastor does.\"<\/li>\n<li>\"Nury. The crisis-response agent for solo pastors.\"<\/li>\n<\/ol>\n<p>Edits to the storyboard draft: shot 2 (\"taken today\" to \"detained last evening\"); shot 6 (\"Sometimes a draft crosses\" to \"When a draft crosses\", so we do not imply a failure rate we have not measured).<\/p><\/body><\/html>"}, {"id": "p29", "group": "Presentation", "label": "Review (canvas)", "html": "<div style='position:sticky;top:0;z-index:9;background:#171a21;color:#9a978f;font:13px system-ui;padding:6px 12px;border-bottom:1px solid #262a33'>Reading copy. Buttons work in the agent's Canvas tab.<\/div><!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Nury review pack<\/title>\n<style>:root{--ink:#0d1015;--s:#131824;--t:#ece7dc;--m:#9a9a9a;--a:#e8a33d}\nbody{margin:0;background:var(--ink);color:var(--t);font:16px/1.5 system-ui,sans-serif;padding:20px;max-width:820px;margin-inline:auto}\nh1,h2{font-family:Georgia,serif;margin:.2em 0}h2{margin-top:1.6em;border-top:1px solid #263044;padding-top:.8em}\npre{white-space:pre-wrap;background:var(--s);padding:14px;border-radius:10px;font:15px/1.5 system-ui,sans-serif}\n.m{color:var(--m);font-size:14px}.ol li{margin:.3em 0}button{font:inherit;padding:10px 16px;border-radius:8px;border:0;margin-right:8px;cursor:pointer}\n.ok{background:var(--a) ormation into advice. Nury rejects it and regenerates. The pastor never sees it.\\n[90s] The rights brief comes out in Spanish, built only from a vetted source, every point cited.\\n[90s] At the end, the pastor has a package. Copy, not Send. Nury never sends. The pastor does.\\n\\n## 1:35 to 2:10  Slide 4 and 5: why it works  (Innovation, Use of AI)\\nNury is a crisis-management engine. It runs playbooks. The first playbook is a detention, and that is what you just saw.\\nAdding a crisis is adding a playbook folder. The engine does not change. We tested that with a second, test playbook. Do not say a second crisis ships or is scored. Only detention does.\\nTwo design choices keep the pastor in control.\\nFirst, the approval gate. The agent drafts. The pastor decides. Nothing reaches the family except through the pastor's hands.\\nSecond, the self-correction loop. Every draft is checked. Unsafe drafts are rejected and regenerated, up to three tries, then handed to the pastor. The pastor never sees the unsafe one.\\nNury runs on Gloo's guarded Responses endpoint. It gives legal information only, from a vetted source file. No open web. It is not a pastor, a counselor, or a lawyer, and it says so.\\n\\n## 2:10 to 2:40  Slide 6: proof  (Impact and Execution)\\nWe tested it.\\n[ONLY IF TRUE] Twenty hand-built scenarios, scored by typed judges. [NUMBER: pass rate], [NUMBER: drafts rejected and regenerated], [NUMBER: cost per run], [NUMBER: latency per run].\\nFallback if no scorecard: \\\"We built twenty scenarios and scored each stage. The scorecard is in our build document.\\\"\\nThe harness uses the Jev decision API, my prior project, as typed judges. Disclosed as prior technology per the rules.\\n\\n## 2:40 to 3:00  Slide 7 and 8: team and close  (Teamwork/Presentation)\\nBuilt by Juan Pelaez at 3Metas, with a small team of AI agents that coordinate over a messaging protocol. Every step is in the commit log.\\n[90s] Nury is named for my late t\\u00eda Nury, a woman who was always ready to help at her church.\\n[90s] The next call will come. Nury is there when the pastor picks up.\\n[90s] Nury. The crisis-response agent for solo pastors.\\n\\n## 90-second cut: how to run it\\nSay only the `[90s]` lines. Run the 90-second video over the demo lines. Drop slides 4 to 6.\\nJudges' rules doc says 90 s, Discord says 3 min. Verify at the venue. Both versions are ready.\\n\\n## Rules for the speaker\\n- Say \\\"legal information\\\", never \\\"legal advice\\\".\\n- Never say Nury \\\"helps the family directly\\\". It helps the pastor, who helps the family.\\n- Do not name an agency or a party. Humanitarian, never political.\\n- Do not claim a pastor tested it. We have not validated with one. Say so if asked.\\n\", \"finalist\": \"# Nury: 90-second finalist script (video, due 09:00 MDT Oct 8)\\n\\nFor hack-video. Same family, intake and footage as `SHARED_DEMO.md` and `video/STORYBOARD.md`. Judges at finals have seen the prelim, so this cut adds one proof beat and a tighter close.\\n`[NUMBER]` = real scorecard number from hack-artisans only. If none exists, use the fallback VO in brackets. Never invent.\\n\\n| # | Time | Visual (storyboard shot) | VO | On-screen text |\\n|---|---|---|---|---|\\n| 1 | 0:00-0:07 | Shot 1: phone lights up, 2:07 AM, Maria calling | \\\"It is two in the morning. A family is calling their pastor.\\\" | 2:07 AM |\\n| 2 | 0:07-0:14 | Shot 2: intake typed | \\\"Her husband was detained last evening. The pastor has no staff, and no lawyer on the line.\\\" | Solo pastor. No staff. No lawyer. |\\n| 3 | 0:14-0:23 | Shot 3: triage card | \\\"Nury turns the call into a clear case. Facts only. No advice.\\\" | 1 Triage |\\n| 4 | 0:23-0:28 | Shot 4: Approve pulse | \\\"After every stage, the pastor decides.\\\" | Approve / Edit / Stop |\\n| 5 | 0:28-0:40 | Shot 5: Spanish rights brief, citation chip | \\\"Rights in the family's own language. Built only from a vetted source. Every point cited.\\\" | 2 Rights brief. Vetted sources only. |\\n| 6 | 0:40-0:52 | Shot 6: guardrail strip, no draft text | \\\"When a draft crosses the line from information into advice, Nury rejects it and tries again. The pastor never sees it.\\\" | Rejected. Regenerating (2 of 3). Passed. |\\n| 7 | 0:52-1:00 | Shot 7: attorney resources, checklist | \\\"Attorney hotlines. A checklist for tonight.\\\" | 3 Attorneys \\u00b7 4 Checklist |\\n| 8 | 1:00-1:08 | Shot 8: pastoral message, one edit | \\\"And a short, warm message, in the pastor's hands to edit.\\\" | 5 Pastoral message |\\n| 9 | 1:08-1:16 | NEW proof beat: scorecard card on ink, large numbers | \\\"We tested it. [NUMBER: pass rate] across [NUMBER: scenarios] scenarios. [NUMBER: rejected drafts] unsafe drafts caught and regenerated.\\\" [Fallback: \\\"We tested it on hand-built scenarios. The scorecard is in our build document.\\\"] | Real numbers only |\\n| 10 | 1:16-1:24 | Shot 9: Copy, no Send; disclaimer | \\\"Nury is not a pastor, and it never sends. The pastor does.\\\" | Nury does not send. The pastor does. |\\n| 11 | 1:24-1:30 | Shot 10: end card | \\\"Nury. The crisis-response agent for solo pastors.\\\" | Nury \\u00b7 Legal information only. Not legal advice. |\\n\\nVO is about 120 words. Silence is fine.\\n\\n## Notes\\n- Re-time storyboard shots 1-10 to the table. Shots 1-5, 7, 8 are unchanged footage. Shot 6 gets 12 s (was 12). Shot 9 is the only new footage: a still card, no recording.\\n- Drop shot 9's proof beat if numbers are not real. Give the 8 s back to shots 5 and 6.\\n- Jev disclosure: not in the video. It lives in the submission text and the deck proof slide.\\n- Check every frame for keys, tokens and terminal history before export.\\n\", \"slides\": [\"Nury The crisis-response agent for solo pastors. Juan Pelaez \\u00b7 3Metas \\u00b7 Gloo AI Hackathon \\u00b7 Track 1\", \"2:07 AM. A solo pastor's phone rings. A solo pastor. No staff. No lawyer on the line. A panicked call from an immigrant family. Sunday afternoon, or 2 AM. They have a phone and a few minutes. Nury is humanitarian and takes no political side. The subject is a family and a night.\", \"Playbook #1: detention. Five stages, the pastor decides each. Triage States the facts without advice. Rights brief Family's language. Vetted source. Every point cited. Attorney resources Hotlines and church-vetted entries. Never one named attorney. Family checklist Do tonight. Do not do. Gather these documents. Pastoral message Under 120 words. Warm and steady. Demo: Maria, Jose, two children (8 and 11). Live app or the 90-second video.\", \"Safety you can see Approve \\u00b7 Edit \\u00b7 Stop after every stage. Draft rejected by guardrail \\u2192 Regenerating (2 of 3) \\u2192 Passed Up to three tries, then escalate to the pastor. The pastor never sees the unsafe draft. Nury has no send path. The pastor copies the text and sends it by hand.\", \"How it is built One engine runs crisis playbooks. Detention is playbook #1. Adding a crisis is adding a playbook folder. The engine does not change. Tested with a test playbook. Gloo guarded Responses endpoint. Legal information only, from a vetted source file. No open web. Nury is not a pastor, counselor, therapist or lawyer, and says so on every output. English screen for the pastor. Spanish output for the family.\", \"Proof Hand-built scenarios, scored by typed judges. Pass rate [PLACEHOLDER] Drafts rejected and regenerated [PLACEHOLDER] Cost per run [PLACEHOLDER] Latency per run [PLACEHOLDER] Fill from hack-artisans' real scorecard only (not the mock). No real numbers by Oct 7 16:00 MDT: delete this slide. Evaluation harness uses the Jev decision API (my prior project) as typed judges; disclosed as prior technology per the rules.\", \"Who built it Juan Pelaez, 3Metas. A small team of AI agents, coordinating over a messaging protocol. Every step is in the commit log. Named for Juan's late t\\u00eda Nury, always ready to help at her church.\", \"Nury The crisis-response agent for solo pastors. Legal information only. Not legal advice.\"], \"open\": [\"Proof numbers (slide 6, description sentence, pitch 2:10 block, finalist beat 9): waiting on a real --agent nury scorecard from hack-artisans. Cut rule: none by Oct 7 16:00 MDT, then cut.\", \"The mock scorecard on main is not used anywhere.\", \"Locked, not edited: Jev line, brand line, locked VO.\"], \"source\": \"Repo files in presentation/ are the source. This page is a reading copy.\"}<\/script>\n<script>const D=JSON.parse(document.getElementById('page-data').textContent);\nconst $=i=>document.getElementById(i);const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\n$('meta').textContent=D.status+' \u00b7 generated '+D.generatedAt;$('wc').textContent='('+D.wordCount+' words, limit 250)';\n$('open').innerHTML=D.open.map(x=>'<li>'+esc(x)+'<\/li>').join('');$('desc').textContent=D.description;\n$('slides').innerHTML=D.slides.map((s,i)=>'<div class=\"s\"><b>'+(i+1)+'<\/b> '+esc(s)+'<\/div>').join('');\n$('pitch').textContent=D.pitch;$('fin').textContent=D.finalist;$('src').textContent=D.source;\nfunction go(v){maestro.send('submit','review-decision',{decision:v,note:$('note').value.slice(0,500)});$('a').disabled=$('c').disabled=true}\n$('a').onclick=()=>go('approve');$('c').onclick=()=>go('changes');<\/script><\/body><\/html>"}, {"id": "p30", "group": "Video", "label": "Storyboard", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Storyboard<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>video/STORYBOARD.md<\/p><h1 id=\"nury-demo-video-storyboard-and-shot-list-90-s\">Nury demo video: storyboard and shot list (90 s)<\/h1>\n<p>Owner: hack-video. Status: v1.1. VO wording and intake are LOCKED in <code>presentation/SHARED_DEMO.md<\/code> (that file wins over the VO column below). Finalist re-timing is in <code>presentation/FINALIST_SCRIPT.md<\/code>. VO is TTS until Juan supplies a recording (swap in if it arrives before Oct 7, 17:00 MDT). Scratch VO: <code>video/build_vo.sh<\/code>.\nRecording starts only when hack-sensei says the app works (expected Oct 7, ~15:00 MDT).<\/p>\n<h2 id=\"story-in-one-line\">Story in one line<\/h2>\n<p>At 2 AM a family calls their pastor after a detention. The pastor types what they said. Nury runs five stages, the pastor approves each one, and a message for the family is ready for the pastor to send by hand.<\/p>\n<h2 id=\"rules-the-video-must-show-or-respect\">Rules the video must show or respect<\/h2>\n<ul>\n<li>Humanitarian, never political. No flags, no agency logos, no officers on screen, no party or policy words. The subject is a family and a night.<\/li>\n<li>Nury is not a pastor. Say it once in VO and once on screen.<\/li>\n<li>No send path. The final screen has Copy, not Send. VO says \"Nury does not send. The pastor does.\"<\/li>\n<li>The pastor never sees an unsafe draft. The video shows the guardrail catching one as a status line only. The unsafe text is never on screen.<\/li>\n<li>Legal information only. The disclaimer is visible on every output shot.<\/li>\n<li>English UI. Spanish output for the family, set in the serif face.<\/li>\n<li>Demo family: use the names in <code>documents/prework/demo/demo_scenario.py<\/code> (Maria, Jose, two children). Time changed to 2:07 AM. No real people, no real phone numbers.<\/li>\n<\/ul>\n<h2 id=\"look\">Look<\/h2>\n<p>Source: <code>documents/prework/refugio.html<\/code> and PRODUCT.md. \"Lantern in the dark.\"\n- Background ink <code>#0d1015<\/code>, surface <code>#131824<\/code>, text <code>#ece7dc<\/code>.\n- One accent: amber <code>#e8a33d<\/code>. Green and red only for approved and rejected chips.\n- Fraunces (serif) for family words. Inter for chrome.\n- Phone-first. Record a phone-width viewport (390 x 844) at 2x, placed on the ink background. No device frame.\n- Motion: slow fades, one amber pulse on approve. No whooshes, no zooms past 110%.\n- Audio: low warm pad, VO dry and steady. Phone buzz only in shot 1.<\/p>\n<h2 id=\"shot-list\">Shot list<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Time<\/th>\n<th>Visual<\/th>\n<th>VO (draft)<\/th>\n<th>On-screen text<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>0:00-0:08<\/td>\n<td>Black. A phone lights up: 2:07 AM, \"Maria\" calling. One amber glow.<\/td>\n<td>\"It is two in the morning. A family is calling their pastor.\"<\/td>\n<td>\"2:07 AM\"<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>0:08-0:15<\/td>\n<td>Slow push on the Intake view, empty cursor. Pastor types the intake (sped up, 3x).<\/td>\n<td>\"Her husband was taken today. The pastor has no staff, and no lawyer on the line.\"<\/td>\n<td>\"Solo pastor. No staff. No lawyer.\"<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>0:15-0:25<\/td>\n<td>Intake sent. Pipeline view: five-step stepper, step 1 lights amber. Triage card fills: situation, people, location, language, urgency, 3 missing facts.<\/td>\n<td>\"Nury turns the call into a clear case. Facts only. No advice.\"<\/td>\n<td>\"1 Triage\"<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>0:25-0:30<\/td>\n<td>Thumb taps Approve. Amber pulse. Stepper moves to step 2. Show Approve / Edit / Stop for one beat.<\/td>\n<td>\"After every stage, the pastor decides.\"<\/td>\n<td>\"Approve / Edit / Stop\"<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>0:30-0:44<\/td>\n<td>Rights brief streams in Spanish (serif). Each point carries a citation chip. Pause on one chip.<\/td>\n<td>\"Rights in the family's own language. Built only from a vetted source. Every point cited.\"<\/td>\n<td>\"2 Rights brief. Vetted sources only.\"<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>0:44-0:56<\/td>\n<td><strong>Guardrail beat.<\/strong> A status strip appears under the brief: \"Draft rejected by guardrail. Regenerating (2 of 3).\" Red chip, then green \"Passed\". No draft text visible. The clean brief replaces the card.<\/td>\n<td>\"Sometimes a draft crosses the line from information into advice. Nury rejects it and tries again. The pastor never sees it.\"<\/td>\n<td>\"Guardrail: rejected, regenerated. Max 3 tries.\"<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>0:56-1:06<\/td>\n<td>Fast montage, 2.5 s each: Attorney resources (hotlines, church-vetted entries, no named attorney); Family checklist (DO TONIGHT / DO NOT DO / GATHER THESE DOCUMENTS). Two taps on Approve.<\/td>\n<td>\"Attorney hotlines. A checklist for tonight.\"<\/td>\n<td>\"3 Attorney resources\" then \"4 Family checklist\"<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>1:06-1:18<\/td>\n<td>Stage 5 card: the pastoral message, under 120 words, in Spanish, serif, large. Pastor edits one word (Edit), then Approve.<\/td>\n<td>\"And a short, warm message, in the pastor's hands to edit.\"<\/td>\n<td>\"5 Pastoral message\"<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>1:18-1:25<\/td>\n<td>Package view. Buttons: Copy, Download. No Send. Cursor circles the empty place where Send would be. Disclaimer line visible. A phone shows the pastor pasting into their own messages app.<\/td>\n<td>\"Nury is not a pastor, and it never sends. The pastor does.\"<\/td>\n<td>\"Nury does not send. The pastor does.\"<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>1:25-1:30<\/td>\n<td>End card on ink. Amber lantern mark.<\/td>\n<td>\"Nury. The crisis-response agent for solo pastors.\"<\/td>\n<td>\"Nury\", tagline, \"Legal information only. Not legal advice.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>VO runs about 105 words. At a calm 150 wpm that is about 42 s of speech across 90 s. Silence is intentional.<\/p>\n<h2 id=\"screen-capture-plan\">Screen-capture plan<\/h2>\n<ul>\n<li>App: run from the repo <code>code/<\/code> app in Chrome. Resize the window to 390 x 844 (Claude in Chrome <code>resize_window<\/code>). Hide bookmarks and extensions. Dark system theme, Do Not Disturb on.<\/li>\n<li>Capture: macOS <code>screencapture -v<\/code> or ffmpeg <code>avfoundation<\/code> on the browser window, 60 fps, then cut to 30 fps. Record each stage as its own take.<\/li>\n<li>Live vs canned: take one fully live run (Gloo). Gloo latency will be slow, so record each stage separately and cut the waits. Keep a <code>--dry-run<\/code> run as backup footage.<\/li>\n<li>Guardrail beat (shot 6) needs a real rejection. Ask hack-jedi for a switch or a seeded scenario that forces one rejection on the Rights brief. Record the status strip, not the text.<\/li>\n<li>Capture the guardrail log to a file for BUILD_LOG proof. It stays off screen.<\/li>\n<li>Make a clean-state script: fresh session, same intake text, same time stamp, so retakes match.<\/li>\n<li>Keys: <code>GLOO_API_KEY<\/code> stays in the environment. Check every frame for keys, URLs with tokens, and terminal history before export.<\/li>\n<\/ul>\n<h2 id=\"tooling-decision\">Tooling decision<\/h2>\n<ul>\n<li>ffmpeg (installed at <code>/opt/homebrew/bin/ffmpeg<\/code>) for cut, speed ramps, crossfades, captions (burned-in SRT) and final encode. Scripted, so retakes rebuild in minutes. Fits the commit-small rule.<\/li>\n<li>Chrome plus <code>screencapture<\/code> for footage. No paid editor. No new installs.<\/li>\n<li>VO: scratch track now with macOS <code>say<\/code> for timing. Final VO needs a human voice. Ask Juan whether he will read it at the venue, or whether to use a TTS voice. Decision needed by Oct 7, 17:00.<\/li>\n<li>Spanish text is shown, not spoken. If hack-sensei wants a spoken Spanish line, a native speaker should check it.<\/li>\n<li>Export: 1920x1080 H.264 MP4, AAC, under 100 MB, with the phone view centered on ink. Also a 1080x1920 vertical cut if time allows.<\/li>\n<li>Captions on by default (judges may watch muted).<\/li>\n<\/ul>\n<h2 id=\"overnight-plan-oct-7-to-8\">Overnight plan (Oct 7 to 8)<\/h2>\n<ul>\n<li>Top 25 is announced at midnight. Stand by from 23:00.<\/li>\n<li>hack-ninja supplies the 90 s finalist script. Re-time shots 1-10 to that script. Same footage, new VO and captions.<\/li>\n<li>Budget: 00:30 script in hand, 03:00 rough cut, 06:00 final cut, 07:30 upload to Google Drive, 08:00 give hack-sensei the link. Hard deadline 09:00 MDT.<\/li>\n<li>Keep raw takes and the ffmpeg script in <code>video/<\/code> so a re-cut needs no new recording.<\/li>\n<\/ul>\n<h2 id=\"update-oct-6-crisis-selector-shot-juans-decision-see-documentsarchitecturemd-crisis-selector-and-live-tracks\">Update Oct 6: crisis selector shot (Juan's decision, see documents/ARCHITECTURE.md \"Crisis selector and live tracks\")<\/h2>\n<p>The app now opens on a crisis selector. Detention is the demo. Add a 4 s shot after shot 1. On-screen caption only, no new VO (locked VO stays).<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Time<\/th>\n<th>Visual<\/th>\n<th>VO<\/th>\n<th>On-screen text<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1b<\/td>\n<td>0:07-0:11<\/td>\n<td>Selector view. Cursor rests on the Detention card, amber highlight, tap. Other cards stay as the app draws them: hospital emergency available, two \"Coming soon\" cards labeled and not clickable.<\/td>\n<td>(silence, pad only)<\/td>\n<td>\"The pastor picks the crisis.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Re-time to keep 90 s: shots 2 to 11 each shift 4 s later. Take the 4 s from silence: shot 2 runs 0:11-0:16 (was 7 s), shot 3 0:16-0:24 (was 9 s), shot 7 0:56-1:02. VO lines keep their order and all still fit (longest speech line is 7.5 s).\nRules for this shot:\n- Never open or run the hospital track in the video unless hack-sensei confirms it is scored.\n- Say nothing about the \"Coming soon\" crises. The video shows them as the app labels them.\n- <code>capture/record.py<\/code> needs one new click (Detention card) before \"Use demo intake\". Selector ids are unknown until hack-artisans pushes. Re-capture only on hack-sensei's word.<\/p>\n<h2 id=\"open-questions\">Open questions<\/h2>\n<ol>\n<li>Show a redacted reason on the guardrail strip (for example \"reason: advice, not information\")? Only if the app already has the category. Needs hack-jedi.<\/li>\n<li>Who reads the VO? Juan, or TTS?<\/li>\n<li>Does the pitch deck use the same family and intake? Keep them identical across deck and video (hack-ninja).<\/li>\n<li>Is a 3-minute prelim version of the video wanted, or only the 90 s? (JUDGING.md lists both lengths.)<\/li>\n<\/ol><\/body><\/html>"}, {"id": "p31", "group": "Video", "label": "Storyboard (canvas)", "html": "<div style='position:sticky;top:0;z-index:9;background:#171a21;color:#9a978f;font:13px system-ui;padding:6px 12px;border-bottom:1px solid #262a33'>Reading copy. Buttons work in the agent's Canvas tab.<\/div><!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Nury 90-second video: storyboard<\/title>\n<style>\n:root{--bg:#0d1015;--s:#131824;--line:rgba(236,231,220,.12);--amber:#e8a33d;--text:#ece7dc;--muted:#a79f8d}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,Inter,sans-serif;padding:20px;max-width:900px;margin:auto}\nh1{font:600 26px Georgia,serif;color:var(--amber);margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 18px}\n.card{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}\n.t{color:var(--amber);font-weight:600;font-size:13px}.vo{font-family:Georgia,serif;font-size:17px;margin:6px 0}.on{color:var(--muted);font-size:13px}\n.note{border-left:3px solid var(--amber);padding-left:12px;color:var(--muted);margin:12px 0}\nbutton{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:4px 6px 0 0;cursor:pointer}button:hover{border-color:var(--amber)}\n.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted);margin-left:6px}\n<\/style><\/head><body>\n<h1>Nury: 90-second demo video<\/h1><p class=\"sub\" id=\"meta\"><\/p>\n<div class=\"note\">Rules on screen: humanitarian, never political. No agency names. Nury is not a pastor. No Send button. The unsafe draft is never shown, only the guardrail status line.<\/div>\n<div id=\"shots\"><\/div>\n<div class=\"card\"><div class=\"t\">Decisions<\/div><div id=\"dec\"><\/div><\/div>\n<div class=\"card\"><div class=\"t\">Your call<\/div>\n<button onclick=\"maestro.send('click','approve-storyboard',{})\">Approve storyboard<\/button>\n<button onclick=\"maestro.send('click','change-request',{note:'see comment'})\">Ask for changes<\/button><\/div>\n<script type=\"application/json\" id=\"page-data\">\n{\"generatedAt\":\"2026-10-06T20:20:00-06:00\",\"source\":\"video/STORYBOARD.md and presentation/SHARED_DEMO.md\",\n\"shots\":[\n[\"1\",\"0:00-0:07\",\"Phone lights up: 2:07 AM, Maria calling.\",\"It is two in the morning. A family is calling their pastor.\",\"2:07 AM\"],\n[\"2\",\"0:07-0:14\",\"Pastor types the intake (3x speed).\",\"Her husband was detained last evening. The pastor has no staff, and no lawyer on the line.\",\"Solo pastor. No staff. No lawyer.\"],\n[\"3\",\"0:14-0:23\",\"Triage card fills.\",\"Nury turns the call into a clear case. Facts only. No advice.\",\"1 Triage\"],\n[\"4\",\"0:23-0:28\",\"Tap Approve. Amber pulse.\",\"After every stage, the pastor decides.\",\"Approve / Edit / Stop\"],\n[\"5\",\"0:28-0:40\",\"Spanish rights brief with citation chips.\",\"Rights in the family's own language. Built only from a vetted source. Every point cited.\",\"2 Rights brief. Vetted sources only.\"],\n[\"6\",\"0:40-0:52\",\"Status strip: rejected, regenerating (2 of 3), then Passed. No draft text.\",\"When a draft crosses the line from information into advice, Nury rejects it and tries again. The pastor never sees it.\",\"Rejected. Regenerating (2 of 3). Passed.\"],\n[\"7\",\"0:52-1:00\",\"Attorney resources, then the family checklist.\",\"Attorney hotlines. A checklist for tonight.\",\"3 Attorneys, 4 Checklist\"],\n[\"8\",\"1:00-1:08\",\"Pastoral message in Spanish. One edit, then Approve.\",\"And a short, warm message, in the pastor's hands to edit.\",\"5 Pastoral message\"],\n[\"9\",\"1:08-1:16\",\"Proof card with real scorecard numbers (finalist cut only).\",\"(Finalist cut) We tested it. Numbers from the scorecard only.\",\"Real numbers only\"],\n[\"10\",\"1:16-1:24\",\"Copy and Download, no Send. Disclaimer visible.\",\"Nury is not a pastor, and it never sends. The pastor does.\",\"Nury does not send. The pastor does.\"],\n[\"11\",\"1:24-1:30\",\"End card on ink.\",\"Nury. The crisis-response agent for solo pastors.\",\"Legal information only. Not legal advice.\"]],\n\"decisions\":[\"Voice: text-to-speech now. Juan's recording replaces it if it arrives before Oct 7, 17:00 MDT.\",\"Tools: Chrome capture at 390x844, ffmpeg for the cut and burned-in captions.\",\"Prelim: the 90 s video plays inside the 3-minute pitch. No separate 3-minute video.\",\"Final recording waits for hack-sensei's go.\"]}\n<\/script>\n<script>\nconst D=JSON.parse(document.getElementById('page-data').textContent);\nconst e=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\ndocument.getElementById('meta').textContent='Generated '+D.generatedAt+' from '+D.source;\ndocument.getElementById('shots').innerHTML=D.shots.map(s=>`<div class=\"card\"><div class=\"t\">Shot ${e(s[0])} \u00b7 ${e(s[1])}${s[0]==='9'?'<span class=\"tag\">finalist cut<\/span>':''}<\/div><div>${e(s[2])}<\/div><div class=\"vo\">\u201c${e(s[3])}\u201d<\/div><div class=\"on\">On screen: ${e(s[4])}<\/div><button onclick=\"maestro.send('click','comment-shot-${e(s[0])}',{shot:'${e(s[0])}'})\">Comment on this shot<\/button><\/div>`).join('');\ndocument.getElementById('dec').innerHTML=D.decisions.map(d=>'<div>\u2022 '+e(d)+'<\/div>').join('');\n<\/script><\/body><\/html>\n"}, {"id": "p32", "group": "Video", "label": "Remotion vs ffmpeg", "html": "<div style='position:sticky;top:0;z-index:9;background:#171a21;color:#9a978f;font:13px system-ui;padding:6px 12px;border-bottom:1px solid #262a33'>Reading copy. Buttons work in the agent's Canvas tab.<\/div><!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Remotion vs ffmpeg<\/title>\n<style>:root{--bg:#0d1015;--s:#131824;--amber:#e8a33d;--t:#ece7dc;--m:#a79f8d;--l:rgba(236,231,220,.12)}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 -apple-system,Inter,sans-serif;padding:20px;max-width:1000px;margin:auto}h1{font:600 26px Georgia,serif;color:var(--amber)}table{bo nder time (needs network; fix: self-host fonts)<\/td><td>None new. Uses system fonts (Georgia, Helvetica).<\/td><\/tr>\n<tr><td>Data-driven proof card<\/td><td>Yes, renders nothing without real numbers<\/td><td>Skipped unless real numbers are given<\/td><\/tr><\/table>\n<p><b>Pick:<\/b> Remotion for the final cut, ffmpeg kept working as the fallback. Remotion is better but not by a lot, so the pick holds only if fonts are self-hosted before the final render.<\/p>\n<button onclick=\"maestro.send('click','pick-remotion',{})\">OK, Remotion<\/button><button onclick=\"maestro.send('click','pick-ffmpeg',{})\">Use ffmpeg<\/button>\n<\/body><\/html>\n"}, {"id": "p33", "group": "Project", "label": "Status (canvas)", "html": "<div style='position:sticky;top:0;z-index:9;background:#171a21;color:#9a978f;font:13px system-ui;padding:6px 12px;border-bottom:1px solid #262a33'>Reading copy. Buttons work in the agent's Canvas tab.<\/div><!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Nury status<\/title>\n<style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--ok:#6fbf8b;--warn:#e8a33d;--bad:#e0705f;--line:#262a33}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:20px;max-width:900px;margin:auto}\nh1{font:600 26px Georgia,serif;margin:0 0 4px}h2{font:600 16px system-ui;color:var(--amber);margin:28px 0 10px;letter-spacing:.04em;text-transform:uppercase}\n.sub{color:var(--mute);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}\n.row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}\n.done{color:var(--ok);border-color:var(--ok)}.doing{color:var(--warn);border-color:var(--warn)}.todo{color:var(--mute)}.need{color:var(--bad);border-color:var(--bad)}\nbutton{background:var(--amber);color:#1a1405;border:0;border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px;cursor:pointer}\nbutton.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.muted{color:var(--mute);font-size:13px}\ntextarea{width:100%;background:#0c0e12;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:60px;font:inherit}\n<\/style><\/head><body>\n<h1>Nury status<\/h1><div class=\"sub\" id=\"sub\"><\/div>\n<h2>Needs you<\/h2><div id=\"needs\"><\/div>\n<h2>Crew<\/h2><div id=\"crew\"><\/div>\n<h2>Milestones (MDT)<\/h2><div id=\"ms\"><\/div>\n<h2>Decisions made<\/h2><div id=\"dec\"><\/div>\n<h2>Your note to hack-sensei<\/h2>\n<div class=\"card\"><textarea id=\"note\" placeholder=\"Anything to change? Write it here.\"><\/textarea><p><button onclick=\"sendNote()\">Send note<\/button><\/p><div class=\"muted\" id=\"sent\"><\/div><\/div>\n<script type=\"application/json\" id=\"page-data\">\n{\"generatedAt\":\"2026-10-06T20:20:00-06:00\",\n\"needs\":[\n {\"id\":\"skills\",\"title\":\"Skills policy: confirm\",\"text\":\"I wrote it into every CLAUDE.md: agent-browser, humanizer, impeccable, canvas. Humanizer never touches the Jev line, the locked voiceover, disclaimers or guardrail wording.\"},\n {\"id\":\"venue\",\"title\":\"Verify the prelim format at the venue\",\"text\":\"Rules doc says 90 s. Discord says 3 min. Ask an organizer and tell me.\"},\n {\"id\":\"read18\",\"title\":\"Read the description and deck at 18:00 Oct 7\",\"text\":\"Description is 245 words. Deck has 8 slides.\"}],\n\"crew\":[\n {\"n\":\"hack-jedi\",\"s\":\"done\",\"t\":\"Engine, playbook loader, guardrail loop (3 attempts), gates, fault injection, agency-name check. 16 tests pass.\"},\n {\"n\":\"hack-artisans\",\"s\":\"doing\",\"t\":\"App built. Fixing stage-2 demo rejection, line breaks, one-screen Copy. 20-scenario eval re-run next, then Jev judges.\"},\n {\"n\":\"hack-ninja\",\"s\":\"doing\",\"t\":\"Description v1, pitch script, 8-slide deck, finalist script. Proof numbers wait for the scorecard.\"},\n {\"n\":\"hack-video\",\"s\":\"doing\",\"t\":\"Storyboard, TTS scratch voiceover, rehearsal capture proven. Final recording waits for my go.\"}],\n\"ms\":[\n {\"w\":\"Oct 6\",\"t\":\"Repo, crew, live Gloo call, engine, playbook refactor, app, harness\",\"s\":\"done\"},\n {\"w\":\"Oct 7 09:00\",\"t\":\"App on the engine with crisis picker\",\"s\":\"doing\"},\n {\"w\":\"Oct 7 11:00\",\"t\":\"First real eval run and scorecard\",\"s\":\"doing\"},\n {\"w\":\"Oct 7 15:00\",\"t\":\"End-to-end demo with one rejected-and-regenerated draft\",\"s\":\"todo\"},\n {\"w\":\"Oct 7 18:00\",\"t\":\"Description and deck final, Juan reads\",\"s\":\"todo\"},\n {\"w\":\"Oct 7 20:30\",\"t\":\"Deck, script, video in Juan's hands\",\"s\":\"todo\"},\n {\"w\":\"Oct 7 21:00\",\"t\":\"SUBMITTED. Hard stop.\",\"s\":\"todo\"},\n {\"w\":\"Oct 8 09:00\",\"t\":\"Finalist video, only if top 25\",\"s\":\"todo\"}],\n\"dec\":[\n \"Nury is a crisis-management engine that runs playbooks. A new crisis is a folder, not engine code. Detention is playbook #1.\",\n \"Guardrail loop: 3 attempts in total (first draft plus 2 regenerations), then escalate. The pastor never sees an unsafe draft.\",\n \"One flagship crisis. A second playbook only after the first real eval run.\",\n \"Voiceover: text-to-speech first. Your recording replaces it only if it arrives before 17:00 Oct 7.\",\n \"No agency names on screen. The engine says 'immigration officers'.\",\n \"Keys live in the gitignored .env. Rotate both after the hackathon.\",\n \"Model: sonnet-4.6 at $3 in and $15 out per 1M tokens.\"]}\n<\/script>\n<script>\nconst D=JSON.parse(document.getElementById('page-data').textContent);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\ndocument.getElementById('sub').textContent='Generated '+new Date(D.generatedAt).toLocaleString()+'. Repo: 3MetasOS/nury (private).';\ndocument.getElementById('needs').innerHTML=D.needs.map(n=>`<div class=\"card\"><div class=\"row\"><b>${esc(n.title)}<\/b><span class=\"tag need\">you<\/span><\/div><div class=\"muted\">${esc(n.text)}<\/div><p><button onclick=\"maestro.send('click','ok-${n.id}',{id:'${n.id}'})\">Done / OK<\/button> <button class=\"alt\" onclick=\"maestro.send('click','change-${n.id}',{id:'${n.id}'})\">I want a change<\/button><\/p><\/div>`).join('');\ndocument.getElementById('crew').innerHTML=D.crew.map(c=>`<div class=\"card\"><div class=\"row\"><b>${esc(c.n)}<\/b><span class=\"tag ${c.s}\">${c.s==='done'?'delivered':'in progress'}<\/span><\/div><div class=\"muted\">${esc(c.t)}<\/div><\/div>`).join('');\ndocument.getElementById('ms').innerHTML=D.ms.map(m=>`<div class=\"card\"><div class=\"row\"><span><b>${esc(m.w)}<\/b> ${esc(m.t)}<\/span><span class=\"tag ${m.s}\">${m.s}<\/span><\/div><\/div>`).join('');\ndocument.getElementById('dec').innerHTML=D.dec.map(d=>`<div class=\"card\">${esc(d)}<\/div>`).join('');\nfunction sendNote(){const v=document.getElementById('note').value.trim();if(!v)return;maestro.send('submit','note',{text:v});document.getElementById('sent').textContent='Sent.';}\n<\/script><\/body><\/html>\n"}]</script>
<script>
const PAGES = JSON.parse(document.getElementById('data').textContent);
const menu = document.getElementById('menu'), view = document.getElementById('view'), nav = document.getElementById('nav');
const cur = document.getElementById('cur');
function render(filter){
  const f=(filter||'').toLowerCase(); menu.innerHTML=''; let g='';
  PAGES.forEach(p=>{
    if(f && !(p.label+' '+p.group).toLowerCase().includes(f)) return;
    if(p.group!==g){g=p.group; const h=document.createElement('div'); h.className='grp'; h.textContent=g; menu.appendChild(h);}
    const a=document.createElement('a'); a.href='#'+p.id; a.textContent=p.label; a.dataset.id=p.id; menu.appendChild(a);
  });
  mark();
}
function mark(){ const id=(location.hash||'#p0').slice(1); menu.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===id)); }
function show(){
  const id=(location.hash||'#p0').slice(1); const p=PAGES.find(x=>x.id===id)||PAGES[0];
  view.srcdoc=p.html; cur.textContent=p.label; document.title=p.label+' - Nury hub'; mark(); nav.classList.remove('open');
}
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
document.getElementById('open').addEventListener('click',()=>nav.classList.toggle('open'));
window.addEventListener('hashchange',show);
render(''); show();
</script></body></html>
