<script type="application/json" id="data">[{"id": "p0", "group": "Overview", "label": "Start here", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Start here<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body>\n<h1>Nury<\/h1>\n<p><b>The crisis-response agent for solo pastors.<\/b> Nury helps a pastor who takes a panicked call from a family in crisis. The pastor types what the family said. Nury works through stages, one at a time. After every stage the pastor decides: <b>Approve, Edit or Stop<\/b>. Nothing reaches the family except through the pastor.<\/p>\n<div class='card'><b>Who it is for.<\/b> A solo pastor with no staff and no lawyer on the line, on a phone, often at 2 AM. Flagship demo: a family member detained in an immigration raid. A second playbook runs hospital emergencies.<\/div>\n<h2>What Nury will never do<\/h2>\n<ul><li>Give legal or medical advice, or predict how a case or an illness will turn out.<\/li><li>Claim to be a pastor, a lawyer, a counselor or a clinician.<\/li><li>Send anything to the family. There is no send path.<\/li><li>Search the open web while it runs, or use a source nobody vetted.<\/li><li>Send names, phones, addresses or ID numbers to a language model.<\/li><\/ul>\n<h2>The pastor's journey<\/h2>\n<ol><li><b>Pick the crisis<\/b> on the selector (detention and hospital are live; sudden death and house fire are coming soon).<\/li><li><b>Intake.<\/b> Type the call. Confirm which names to protect.<\/li><li><b>Stages with gates.<\/b> Triage, rights or information brief, attorney or hospital resources, family checklist, pastoral message. Each ends with Approve, Edit or Stop.<\/li><li><b>Package.<\/b> Copy or download. The pastor gives it to the family.<\/li><li><b>Case file.<\/b> Save a local folder of linked pages and a next-steps map.<\/li><li><b>Something changed.<\/b> Reopen the case, say what happened, and draft again as version 2.<\/li><\/ol>\n<h2>Concepts, in plain words<\/h2>\n<dl>\n<dt>Playbook<\/dt><dd>One crisis as a folder: stages, prompts, vetted sources, outcomes. A new crisis is a new folder; the engine does not change.<\/dd>\n<dt>Engine<\/dt><dd>Runs the stages, chains approved text forward, runs the correction loop, runs the gates, writes the audit log. It knows nothing about any one crisis.<\/dd>\n<dt>Safety floor<\/dt><dd>The rules no playbook can remove: no advice, no predictions, no identity claims, vetted links and phones only, a disclaimer on every output.<\/dd>\n<dt>Correction loop<\/dt><dd>Each draft is checked. If it fails, Nury rewrites it, up to 3 attempts in all, then hands over. The pastor never sees an unsafe draft.<\/dd>\n<dt>Gate<\/dt><dd>The Approve / Edit / Stop step after every stage. Edits flow into later stages.<\/dd>\n<dt>Skills<\/dt><dd>Small versioned instruction modules a stage includes by name (voice, grounding). They can add rules, never remove the floor.<\/dd>\n<dt>Privacy layer<\/dt><dd>Replaces names, phones, emails, addresses, birth dates and IDs with tokens before anything reaches Gloo, and restores them on the pastor's computer.<\/dd>\n<dt>Church network<\/dt><dd>The pastor's own list of contacts they have worked with. Listed first, labeled as the church's own, never endorsed by Nury.<\/dd>\n<dt>Official list<\/dt><dd>The U.S. Department of Justice list of legal service providers, approved by Juan. Listed does not mean recommended.<\/dd>\n<dt>Case file<\/dt><dd>A local folder of linked pages, a log of every gate, and a next-steps map. Approved text only.<\/dd>\n<dt>Evals<\/dt><dd>Four layers: deterministic checks, Jev yes/no and score judges, a cross-vendor red-team panel, and a human review by Juan.<\/dd>\n<\/dl>\n<h2>How the pieces run<\/h2>\n<p><b>At run time:<\/b> Gloo (guarded Responses endpoint, Claude Sonnet 4.6) writes drafts. Nury's own code checks them. <b>At test time:<\/b> Jev and the red-team panel judge the runs. Both keys sit in a local <code>.env<\/code> that git ignores.<\/p>\n<h2>The crew<\/h2>\n<div class='grid'>\n<div class='card'><b>hack-sensei<\/b><br>Coordinator. Owns CLAUDE.md and BUILD_LOG.<\/div>\n<div class='card'><b>hack-jedi<\/b><br>Architecture: engine, playbooks, privacy, network, case file.<\/div>\n<div class='card'><b>hack-artisans<\/b><br>App, eval harness, scorecards.<\/div>\n<div class='card'><b>hack-ninja<\/b><br>Description, deck, scripts, research, logo.<\/div>\n<div class='card'><b>hack-video<\/b><br>The 90-second demo video.<\/div>\n<\/div>\n<h2>Deadlines (MDT)<\/h2>\n<p>Oct 7 21:00 submission (hard stop). Prelim pitch 21:00 to 23:00. Top 25 at midnight. Oct 8 09:00 finalist video. Finals in person.<\/p>\n<\/body><\/html>"}, {"id": "p1", "group": "Overview", "label": "README", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>README<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>README.md<\/p><h1 id=\"nury\">Nury<\/h1>\n<p>Nury \u2014 the crisis-response agent for solo pastors. When an immigrant family faces a detention, raid, or sudden legal emergency, the pastor types what the family told them. Nury works through five stages (triage, rights brief, attorney resources, family checklist, pastoral message) and pauses for the pastor's approval after each one. Unsafe drafts are rejected and regenerated before the pastor sees them. Legal information comes only from vetted sources, and nothing reaches the family except through the pastor. Nury is not a pastor and never claims to be one.<\/p>\n<p>Entered by Juan Pelaez under 3Metas. Hackathon registration is under jkpelaez@hotmail.com (Solo Hacker ticket T000857383).<\/p>\n<p>License: MIT.<\/p>\n<h2 id=\"privacy\">Privacy<\/h2>\n<p>Nury removes direct identifiers before anything reaches a language model. Names, phone numbers, emails, street addresses, dates of birth and ID numbers become tokens on the pastor's computer; the real values stay local and are restored in the answers the pastor sees. The pastor confirms which names to protect. Limits: details such as a workplace or a rare job can still hint at who someone is, and a name the pastor did not protect is not removed. Case files stay on the pastor's computer.<\/p><\/body><\/html>"}, {"id": "p2", "group": "Overview", "label": "Product (locked)", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Product (locked)<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>documents/prework/PRODUCT.md<\/p><h1 id=\"productmd-nury-prototype\">PRODUCT.md \u2014 Nury (prototype)<\/h1>\n<p>Named for Juan's late t\u00eda Nury \u2014 devout Catholic, Legion of Mary, Cord of the\nDiscalced Carmelites, never married, always ready to help in the church.<\/p>\n<h2 id=\"what-it-is\">What it is<\/h2>\n<p>Nury is a crisis-response agent for a solo pastor. When an immigrant family\nfaces a detention, raid, or sudden legal emergency, the pastor types what the\nfamily told them; the agent works through five stages and produces a complete\nresponse package. Every stage pauses for pastor approval. Nothing reaches the\nfamily except through the pastor's hands.<\/p>\n<h2 id=\"the-user-specific-per-track-1\">The user (specific, per Track 1)<\/h2>\n<p>A solo pastor, no staff, no lawyer on the line \u2014 fielding a panicked call on a\nSunday afternoon or late at night, often from a church parking lot, on their phone.<\/p>\n<h2 id=\"the-job-five-stages\">The job (five stages)<\/h2>\n<ol>\n<li>Triage \u2014 raw intake \u2192 structured case (situation, people, location, family\n   language, urgency + reason, 3 missing facts). Factual, no advice.<\/li>\n<li>Rights brief \u2014 plain-language brief in the family's language, built ONLY from\n   a vetted local source file, every point cited. Ends urging attorney consult.<\/li>\n<li>Attorney resources \u2014 national hotlines + church-vetted local entries.\n   Never recommends a specific attorney.<\/li>\n<li>Family checklist \u2014 DO TONIGHT / DO NOT DO / GATHER THESE DOCUMENTS.<\/li>\n<li>Pastoral message draft \u2014 under 120 words, warm/steady/hopeful, family's language.<\/li>\n<\/ol>\n<h2 id=\"agent-behavior-the-real-agent-requirements\">Agent behavior (the \"real agent\" requirements)<\/h2>\n<ul>\n<li>Each stage: model call \u2192 guardrail check \u2192 on failure, feed failure reasons\n  back and retry (max 2 retries) \u2192 if all fail, escalate to the human.<\/li>\n<li>Guardrails: legal INFORMATION only (never advice/predictions/strategy);\n  attorney consult urged; claims grounded in provided sources with citation;\n  calm language; family's language; disclaimer on every output.<\/li>\n<li>Approval gate between stages: Approve / Edit / Stop. Stop = \"I'll handle\n  this manually.\"<\/li>\n<li>No send path. No open web: legal info comes only from vetted local sources.<\/li>\n<li>Audit log of every tool call, check, retry, timestamp (collapsible).<\/li>\n<\/ul>\n<h2 id=\"distribution-assumptions-labeled\">Distribution (assumptions \u2014 labeled)<\/h2>\n<ul>\n<li>Single self-contained HTML file. Pastor opens a URL (GitHub Pages). No install,\n  no server. Gloo AI Studio is the backend; pastor pastes their own API key once\n  (localStorage, never leaves the device).<\/li>\n<li>This prototype simulates the agent run with scripted data (no API key yet);\n  the JS is architected with a clean seam (<code>Agent.runStage<\/code>) so the event build\n  swaps simulation for live Gloo calls.<\/li>\n<\/ul>\n<h2 id=\"design-world-from-the-brief\">Design world (from the brief)<\/h2>\n<ul>\n<li>NOT a chat UI. Three views: Intake \u2192 Pipeline \u2192 Package.<\/li>\n<li>\"Lantern in the dark\": deep ink background, single warm amber accent, calm and\n  steady. Night-shift cockpit for crisis use.<\/li>\n<li>Serif (family-facing words deserve care) + quiet grotesque for chrome.<\/li>\n<li>Mobile-first: pastor is on their phone. Thumb-sized approval buttons.<\/li>\n<li>Mode: Operate. Scanability and the real usage scene outrank expression.<\/li>\n<\/ul><\/body><\/html>"}, {"id": "p3", "group": "Overview", "label": "Judging notes", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Judging notes<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>documents/prework/JUDGING.md<\/p><h1 id=\"judging-process-gloo-ai-hackathon\">Judging process \u2014 Gloo AI Hackathon<\/h1>\n<p>Sources: official rules doc (read 2026-10-05), Gloo FAQ, Discord organizer post\n(2026-10-06).<\/p>\n<h2 id=\"preliminary-judging-oct-7\">Preliminary judging \u2014 Oct 7<\/h2>\n<ul>\n<li>Submission deadline: working solution + 250-word English description by\n  <strong>9:00 PM MDT<\/strong> (video optional at this stage).<\/li>\n<li>Judging window: <strong>9:00\u201311:00 PM MDT<\/strong> (per FAQ).<\/li>\n<li>Format (Discord organizer post, 2026-10-06): teams get <strong>3 minutes<\/strong> to convince\n  judges \u2014 video, live presentation, or a combination, team's choice.<\/li>\n<li><strong>Conflict to verify at the event:<\/strong> the rules doc says \"every entrant gives a\n  90-second summary\"; the Discord post says 3 minutes. The Discord post is newer.\n  Also, the post closes with \"excited for next week,\" which suggests it may be a\n  repost \u2014 confirm the 3-minute format is current for 2026.<\/li>\n<li><strong>Top 25<\/strong> announced at <strong>midnight<\/strong> \u2192 finals.<\/li>\n<\/ul>\n<h2 id=\"finals-oct-8\">Finals \u2014 Oct 8<\/h2>\n<ul>\n<li>Finalists submit a <strong>90-second demo video by 9:00 AM MDT<\/strong>.<\/li>\n<li>Finalists present during the closing session (live presentation length TBD \u2014\n  ask at the event).<\/li>\n<li>Tight turnaround: midnight announcement \u2192 9 AM video deadline. If we make top\n  25, the video gets built overnight.<\/li>\n<\/ul>\n<h2 id=\"scoring-20-each\">Scoring (20% each)<\/h2>\n<ol>\n<li>Concept / Product<\/li>\n<li>Innovation<\/li>\n<li>Impact and Execution \u2014 <strong>first tie-break<\/strong><\/li>\n<li>Use of AI<\/li>\n<li>Teamwork / Presentation<\/li>\n<\/ol>\n<h2 id=\"deliverables-this-creates\">Deliverables this creates<\/h2>\n<ol>\n<li><strong>3-minute prelim pitch<\/strong> (Oct 7 evening) \u2014 video and/or live. NEW vs the\n   earlier 90-second assumption; the deck script needs a 3-minute version.<\/li>\n<li><strong>250-word description<\/strong> \u2014 Oct 7, 9:00 PM MDT.<\/li>\n<li><strong>90-second finalist video<\/strong> \u2014 Oct 8, 9:00 AM MDT, only if top 25.<\/li>\n<\/ol><\/body><\/html>"}, {"id": "p4", "group": "Architecture", "label": "Architecture decisions", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Architecture decisions<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>documents/ARCHITECTURE.md<\/p><h1 id=\"nury-architecture-a-crisis-management-system-driven-by-playbooks\">Nury architecture: a crisis-management system driven by playbooks<\/h1>\n<p>Decided by Juan and hack-sensei, 2026-10-06. Owner: hack-sensei. Built by hack-jedi.<\/p>\n<h2 id=\"idea\">Idea<\/h2>\n<p>Nury is one engine that runs crisis playbooks. A <strong>crisis<\/strong> is data, not code. Adding a new crisis and how to solve it means adding a playbook folder. The engine does not change.<\/p>\n<p>Detention is playbook #1 and the flagship demo. The engine, safety floor, gates, audit and eval harness are shared by every playbook.<\/p>\n<h2 id=\"layers\">Layers<\/h2>\n<ol>\n<li><strong>Engine<\/strong> (<code>code/nury/<\/code>): runs stages, chains approved or edited text, runs the correction loop (3 attempts total, then escalate), runs the approval gate (Approve / Edit / Stop), writes the audit log. Knows nothing about immigration.<\/li>\n<li><strong>Safety floor<\/strong> (in the engine, not in data): no legal advice, prediction or strategy; no claim to be a pastor, counselor or lawyer; disclaimer on every output; URL and phone allowlist from the playbook's vetted sources; no send path. A playbook can add checks. It cannot remove these.<\/li>\n<li><strong>Playbook<\/strong> (<code>code/playbooks/&lt;crisis_id&gt;/<\/code>): everything that is specific to one crisis.<\/li>\n<li><strong>App<\/strong> (<code>code/app/<\/code>): the pastor picks a crisis from the playbook list, then Intake, Pipeline, Package.<\/li>\n<li><strong>Evals<\/strong> (<code>evaluations/<\/code>): each scenario names its <code>playbook<\/code>. The harness runs any playbook. Scenarios per playbook, scored per playbook.<\/li>\n<\/ol>\n<h2 id=\"playbook-contract\">Playbook contract<\/h2>\n<pre><code>code/playbooks/detention/\n  playbook.json     id, title, one-line description, languages, disclaimer text (EN, ES)\n  stages.json       ordered stages; each has: id, title, prompt file, sources used,\n                    extra checks (by name), output language rule (pastor | family),\n                    optional &quot;when&quot; condition on triage fields (a path)\n  prompts/          one prompt file per stage (verbatim prompts are judged evidence)\n  sources/          vetted JSON files; the only facts the stages may use\n  outcomes.json     terminal outcomes and what the package contains for each\n<\/code><\/pre>\n<ul>\n<li><strong>Paths:<\/strong> a stage can run, or change its prompt or sources, depending on triage fields. Example: where the person was detained (workplace, traffic stop, home, check-in) selects a different checklist block. Conditions are plain field matches, no code.<\/li>\n<li><strong>Outcomes:<\/strong> <code>package_complete<\/code>, <code>stopped_by_pastor<\/code>, <code>escalated<\/code>, <code>blocked<\/code>. A playbook says what each outcome hands the pastor (for example, on <code>escalated<\/code> at stage 2: the sources list plus \"handle this manually\").<\/li>\n<li><strong>Triage is stage 1 of every playbook.<\/strong> Its output fields feed the paths.<\/li>\n<\/ul>\n<h2 id=\"what-changes-from-the-current-code\">What changes from the current code<\/h2>\n<p>hack-jedi's core already has the stage registry, chaining, loop and gates. The change is small: move the detention stages, prompts and sources out of Python into <code>code/playbooks/detention/<\/code>, add a playbook loader, and make <code>run_pipeline(playbook, state, ...)<\/code> take the loaded playbook. Behavior for detention stays the same. Keep <code>INTERFACE.md<\/code> current.<\/p>\n<h2 id=\"milestones-mdt\">Milestones (MDT)<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>When<\/th>\n<th>Milestone<\/th>\n<th>Owner<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M1<\/td>\n<td>Oct 6 done<\/td>\n<td>Gloo client live; core engine with correction loop and gates<\/td>\n<td>jedi<\/td>\n<\/tr>\n<tr>\n<td>M2<\/td>\n<td>Oct 6 done<\/td>\n<td>Playbook refactor: detention runs from <code>code/playbooks/detention/<\/code>, same tests pass<\/td>\n<td>jedi<\/td>\n<\/tr>\n<tr>\n<td>M2b<\/td>\n<td>Oct 6 23:00<\/td>\n<td>Hospital source list drafted for Juan's approval (canvas)<\/td>\n<td>jedi<\/td>\n<\/tr>\n<tr>\n<td>M2c<\/td>\n<td>Oct 7 08:00<\/td>\n<td>Hospital playbook runs end to end; detention unchanged<\/td>\n<td>jedi<\/td>\n<\/tr>\n<tr>\n<td>M3<\/td>\n<td>Oct 7 09:00<\/td>\n<td>Pastor app: crisis selector (2 live, 2 soon), Intake, Pipeline, Package, audit view<\/td>\n<td>artisans<\/td>\n<\/tr>\n<tr>\n<td>M4<\/td>\n<td>Oct 7 11:00<\/td>\n<td>Real eval run, 20 scenarios, first scorecard; failures fixed and logged<\/td>\n<td>artisans<\/td>\n<\/tr>\n<tr>\n<td>M5<\/td>\n<td>Oct 7 12:00<\/td>\n<td>Description draft; deck with real numbers<\/td>\n<td>ninja<\/td>\n<\/tr>\n<tr>\n<td>M6<\/td>\n<td>Oct 7 15:00<\/td>\n<td>End-to-end demo, one rejected-and-regenerated draft; harness scores final<\/td>\n<td>all<\/td>\n<\/tr>\n<tr>\n<td>M7<\/td>\n<td>Oct 7 18:00<\/td>\n<td>Description and deck final; Juan reads<\/td>\n<td>ninja<\/td>\n<\/tr>\n<tr>\n<td>M8<\/td>\n<td>Oct 7 20:30<\/td>\n<td>Deck, script, video in Juan's hands<\/td>\n<td>ninja, video<\/td>\n<\/tr>\n<tr>\n<td>M9<\/td>\n<td>Oct 7 21:00<\/td>\n<td>SUBMITTED. Hard stop.<\/td>\n<td>sensei<\/td>\n<\/tr>\n<tr>\n<td>M10<\/td>\n<td>Oct 8 09:00<\/td>\n<td>Finalist video, only if top 25<\/td>\n<td>video<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"crisis-selector-and-live-tracks-decided-by-juan-2026-10-06-2100-mdt\">Crisis selector and live tracks (decided by Juan, 2026-10-06 ~21:00 MDT)<\/h2>\n<p>The app opens on a <strong>crisis selector<\/strong>, not on intake. Each card is a playbook.\n- <strong>Live (2):<\/strong> <code>detention<\/code> (flagship, the demo) and <code>hospital<\/code> (hospital emergency: a family member in the ER or ICU). Both run on the same engine with no engine change. Each has its own vetted sources, at least 5 scored scenarios (detention has 20), and its own scorecard section.\n- <strong>Coming soon (labeled, not clickable):<\/strong> sudden death in a family; house fire or displacement. They are cards only. Nothing is claimed about them.\n- The pitch and description claim only what runs and is scored. The demo stays the detention family.\n- Hospital playbook rules: information only, no medical advice, no diagnosis or prognosis, no claim to be clergy or a clinician, vetted sources only, same approval gates and correction loop. Sources are drafted by hack-jedi from official public pages (build-time reading only; the runtime has no open web) and <strong>approved by Juan<\/strong> before they ship.\n- API: <code>GET /api/playbooks<\/code> returns id, title, one-line description and status (<code>live<\/code> or <code>soon<\/code>). The selector reads it. The UI never hardcodes a crisis.<\/p>\n<h2 id=\"nury-skills-our-own-light-skill-system-decided-by-juan-2026-10-06\">Nury skills (our own light skill system, decided by Juan 2026-10-06)<\/h2>\n<p>A <strong>skill<\/strong> is a small, versioned instruction module that a playbook stage can include by name. It is not a Claude Code skill; it is plain text that the engine adds to the stage prompt. A new crisis picks skills up by name.<\/p>\n<pre><code>code/skills/&lt;name&gt;/SKILL.md     the instructions (EN and ES sections), version in the header\ncode/skills/&lt;name&gt;/checks.json  optional named checks that go with the skill\nstages.json                     &quot;skills&quot;: [&quot;voice&quot;, &quot;grounding&quot;] on a stage\n<\/code><\/pre>\n<ul>\n<li><strong>Safety floor wins.<\/strong> A skill can add rules and checks. It can never remove or override the floor, the disclaimer or a playbook's banned patterns. The loader refuses a skill that tries.<\/li>\n<li><strong>Evidence.<\/strong> The audit log records a <code>skill_applied<\/code> event (name, version, stage) every time. The scorecard shows which skills ran.<\/li>\n<li><strong>First two skills.<\/strong> <code>voice<\/code> (distilled from the humanizer ideas: plain words, no stock phrases, no inflated language, natural Spanish for the family) on the pastoral and checklist stages. <code>grounding<\/code> (every line comes from the vetted points, or is a plain question for the professional) on checklist and resources stages.<\/li>\n<li><strong>Proof.<\/strong> Deterministic check for stock AI phrases, a Jev tone score, and a before/after comparison for the judges.<\/li>\n<li>No extra model call. Skills change the prompt, not the number of calls.<\/li>\n<\/ul>\n<h2 id=\"case-file-and-next-steps-map-decided-by-juan-2026-10-06\">Case file and next-steps map (decided by Juan 2026-10-06)<\/h2>\n<p>After the pastor approves a package, Nury can save it as a <strong>case file<\/strong>: a local folder of linked markdown pages (index, one page per stage, people, documents, timeline, log) the pastor can reopen, read, print and export. Style: a small personal wiki, compiled once from approved text.\n- <strong>Local only.<\/strong> Case files live on the pastor's machine in <code>cases/<\/code> (gitignored). Nothing is uploaded. Demo and evals use synthetic families only.\n- <strong>Approved content only.<\/strong> Pages hold what the pastor approved or edited. A rejected draft never enters a case file. <code>log.md<\/code> records each gate with a timestamp.\n- <strong>Built without a model call.<\/strong> Pages and the map are produced deterministically from the approved stage outputs and the audit log.\n- <strong>Next-steps map.<\/strong> One SVG per case: lanes for tonight, this week, questions still open, and who to call. It shows steps and questions, never outcomes. No future-tense claims about the case.\n- <strong>Later (not before submission):<\/strong> a possible-paths map from vetted process sources (<code>pathways.json<\/code> per playbook), and a case update loop where Nury proposes page edits and the pastor approves each one.<\/p>\n<h2 id=\"privacy-layer-pseudonymize-before-anything-leaves-the-device-decided-by-juan-2026-10-07\">Privacy layer: pseudonymize before anything leaves the device (decided by Juan 2026-10-07)<\/h2>\n<p>Nury sends no direct identifiers to any model. A <strong>PrivacyClient<\/strong> wraps the Gloo client (the engine already takes <code>client=<\/code>, so the core does not change).\n- <strong>Outbound:<\/strong> names, phone numbers, emails, street addresses, dates of birth, A-numbers and case numbers are replaced with tokens (<code>[PERSON_1]<\/code>, <code>[PHONE_1]<\/code>, <code>[PLACE_1]<\/code>...) before the request is sent. Places are generalized to the city or state level when a token would break the meaning.\n- <strong>Mapping stays local.<\/strong> The token map lives in memory for the run and in the case file on the pastor's machine. It is never sent anywhere.\n- <strong>Inbound:<\/strong> the response is detokenized locally, so the pastor sees real names. The family-facing message reads naturally.\n- <strong>Detection:<\/strong> deterministic rules for phones, emails, IDs, dates and addresses; for names, the pastor confirms a <strong>protected terms<\/strong> list on the intake screen (Nury proposes capitalized words it found; the pastor adds or removes). The pastor stays in charge of what counts as protected.\n- <strong>Honest limit:<\/strong> this removes direct identifiers. Context (\"14 years\", \"his workplace\") can still hint at who a person is. We say that plainly.\n- <strong>Proof:<\/strong> a leak test sends a synthetic intake full of canary names and numbers and checks the captured outbound request: none of them may appear. The same wrapper covers the eval harness's calls to Gloo; Jev only ever sees synthetic families.\n- On by default in the app and in the eval adapter.<\/p>\n<h2 id=\"case-revision-reload-a-case-and-run-a-second-path-decided-by-juan-2026-10-07\">Case revision: reload a case and run a second path (decided by Juan 2026-10-07)<\/h2>\n<p>A pastor reopens a saved case, records <strong>what happened<\/strong> (a step, and whether it went as hoped, did not, or is unknown, in the pastor's words), and Nury re-runs the affected stages with the new facts. Never a prediction; it is a record plus a new draft.\n- Built on existing pieces: the case file holds the approved text; a revision builds a new <code>CaseState<\/code> with the earlier approved stages kept, the update appended to the intake, and runs the stages from triage on (new facts always re-run triage), through the same correction loop and approval gates.\n- The case keeps <strong>versions<\/strong>: <code>v1<\/code> stays untouched; <code>v2<\/code> is saved beside it with a change log (what the pastor reported, which stages were re-run, what changed). The pastor can compare v1 and v2.\n- Revision runs go through the PrivacyClient like every other run.<\/p>\n<h2 id=\"church-network-and-official-lists-decided-by-juan-2026-10-07\">Church network and official lists (decided by Juan 2026-10-07)<\/h2>\n<p>Rule change (Juan): \"Nury never recommends a specific attorney\" becomes \"Nury lists only contacts the pastor has vetted, labeled as the church's own, plus official vetted lists. It never endorses anyone.\"\n- <strong>Church network:<\/strong> a local directory the pastor keeps (<code>network/<\/code>, gitignored, like <code>cases/<\/code>): name, kind (pro bono immigration lawyer, Medicare/Medicaid helper...), languages, city and state, phone or link, the pastor's note, last-used date. The attorney and resources stages match the case (place, language, need) and list these first under \"People our church has worked with\". The vetted link and phone allowlist includes them. A small \"Our network\" screen adds, edits and tags entries.\n- <strong>Official list:<\/strong> the U.S. Department of Justice list of recognized free legal service providers by state, ingested at build time as a vetted source (Juan approves it on a canvas first). Same pattern for other crises where an official list exists.\n- <strong>No open web at runtime.<\/strong> A later pastor-triggered \"find more\" panel (unverified candidates, never in a family message, one-click \"add to our network\" after the pastor checks them) is after submission. Reason: fake \"notario\" services target these families; search results can include them.<\/p>\n<h2 id=\"rules-that-stay\">Rules that stay<\/h2>\n<p>Vetted sources only. No open web. No send path. Nury is not a pastor. Humanitarian, never political. Keys from the environment only.<\/p><\/body><\/html>"}, {"id": "p5", "group": "Architecture", "label": "Diagrams (10 tabs)", "html": "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Nury architecture<\/title><style>\n:root{--bg:#0d1015;--surface:#131824;--surface2:#1a2233;--line:rgba(236,231,220,.14);--amber:#e8a33d;--amber-soft:rgba(232,163,61,.13);--text:#ece7dc;--muted:#a79f8d;--red:#e0785f;--red-soft:rgba(224,120,95,.12);--serif:Fraunces,Georgia,\"Times New Roman\",serif;--sans:Inter,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}\n*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans)}\n::selection{background:var(--amber);color:#1a1206}\nmain{max-width:1120px;margin:0 auto;padding:24px 16px 56px}\nh1{font:600 clamp(1.6rem,5vw,2.4rem)/1.15 var(--serif);margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}\n.lede{color:var(--muted);margin:0 0 20px;max-width:62ch}\n.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 20px;padding:0;list-style:none;font-size:.85rem;color:var(--muted)}\n.legend li{display:flex;align-items:center;gap:8px}\n.sw{width:26px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);flex:none}\n.sw.a{border-color:var(--amber);background:var(--amber-soft)}.sw.x{border:1.5px dashed var(--red);background:var(--red-soft)}.sw.p{border:1.5px dashed var(--muted);background:transparent}\n[role=tablist]{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 20px}\n@media(min-width:700px){[role=tablist]{grid-template-columns:repeat(5,1fr);gap:8px}}\n[role=tab]{font:500 .9rem var(--sans);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}\n[role=tab]:hover{color:var(--text);border-color:rgba(232,163,61,.5)}\n[role=tab][aria-selected=true]{color:#1a1206;background:var(--amber);border-color:var(--amber);font-weight:600}\n[role=tab]:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}\n.panel[hidden]{display:none}\n.panel{display:grid;gap:20px;grid-template-columns:1fr}\n@media(min-width:860px){.panel{grid-template-columns:minmax(0,460px) 1fr;gap:48px;align-items:start}}\n.fig{width:100%;max-width:460px;margin:0 auto}\nsvg{display:block;width:100%;height:auto}\nh2{font:600 1.4rem/1.2 var(--serif);margin:0 0 10px;text-wrap:balance}\n.txt p{margin:0 0 16px;max-width:60ch}\n.code{margin:0;padding:0;list-style:none;font:.82rem/1.7 var(--mono);color:var(--muted)}\n.code li{overflow-wrap:anywhere}\n.code-h{font:600 .85rem var(--sans);color:var(--text);margin:20px 0 4px}\n/* svg */\n.b{stroke:var(--line);stroke-width:1.5;fill:var(--surface)}\n.b.a{stroke:var(--amber);fill:var(--amber-soft)}\n.b.x{stroke:var(--red);stroke-dasharray:5 4;fill:var(--red-soft)}\n.b.p{stroke:var(--muted);stroke-dasharray:5 4;fill:transparent}\n.t{font:500 13px var(--sans);fill:var(--text)}.t.ti{font-weight:700;font-size:13.5px}.t.mu{fill:var(--muted);font-weight:400}\n.t.m{font-family:var(--mono);font-size:12px}.t.lab{font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}\n.ar{fill:none;stroke:var(--muted);stroke-width:1.6}.ar.dash{stroke-dasharray:4 4}.ar.x{stroke:var(--red);stroke-dasharray:4 4}\n.mk{fill:var(--muted)}.xm{stroke:var(--red);stroke-width:2.2;fill:none;stroke-linecap:round}\n@media(prefers-reduced-motion:no-preference){.panel{animation:in .35s cubic-bezier(.16,1,.3,1)}@keyframes in{from{opacity:0;transform:translateY(6px)}}}\n<\/style><\/head><body><main>\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"><defs><marker id=\"ae\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"mk\"/><\/marker><marker id=\"as\" viewBox=\"0 0 10 10\" refX=\"2\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M10 0 L0 5 L10 10 z\" class=\"mk\"/><\/marker><\/defs><\/svg><h1>How Nury is built<\/h1>\n<p class=\"lede\">Ten diagrams, drawn from the code in the repo at 1239be1. A solid box exists in the repo. A dashed grey box is a test fixture, a planned item, or built but not yet checked live; its label says which. A dashed red box is something Nury deliberately does not have.<\/p>\n<ul class=\"legend\"><li><span class=\"sw\"><\/span>exists<\/li><li><span class=\"sw a\"><\/span>where a guarantee lives<\/li><li><span class=\"sw x\"><\/span>deliberately absent<\/li><li><span class=\"sw p\"><\/span>planned, fixture, or live check pending<\/li><\/ul>\n<div role=\"tablist\" aria-label=\"Diagrams\"><button role=\"tab\" id=\"t-context\" aria-controls=\"p-context\" aria-selected=\"true\" tabindex=\"0\">Context<\/button><button role=\"tab\" id=\"t-layers\" aria-controls=\"p-layers\" aria-selected=\"false\" tabindex=\"-1\">Layers<\/button><button role=\"tab\" id=\"t-playbook\" aria-controls=\"p-playbook\" aria-selected=\"false\" tabindex=\"-1\">Playbook<\/button><button role=\"tab\" id=\"t-flow\" aria-controls=\"p-flow\" aria-selected=\"false\" tabindex=\"-1\">Run flow<\/button><button role=\"tab\" id=\"t-loop\" aria-controls=\"p-loop\" aria-selected=\"false\" tabindex=\"-1\">Correction<\/button><button role=\"tab\" id=\"t-privacy\" aria-controls=\"p-privacy\" aria-selected=\"false\" tabindex=\"-1\">Privacy<\/button><button role=\"tab\" id=\"t-sources\" aria-controls=\"p-sources\" aria-selected=\"false\" tabindex=\"-1\">Sources<\/button><button role=\"tab\" id=\"t-skills\" aria-controls=\"p-skills\" aria-selected=\"false\" tabindex=\"-1\">Skills<\/button><button role=\"tab\" id=\"t-casefile\" aria-controls=\"p-casefile\" aria-selected=\"false\" tabindex=\"-1\">Case file<\/button><button role=\"tab\" id=\"t-evals\" aria-controls=\"p-evals\" aria-selected=\"false\" tabindex=\"-1\">Evals<\/button><\/div>\n<section class=\"panel\" role=\"tabpanel\" id=\"p-context\" aria-labelledby=\"t-context\"><div class=\"fig\"><svg viewBox=\"0 0 400 740\" role=\"img\" aria-label=\"System context: pastor, Nury with its privacy layer, Gloo endpoint sees tokens only, vetted sources, local church network and case files. Open web and a send path are absent.\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"b n\" x=\"16\" y=\"12\" width=\"150\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"91.0\" y=\"36.0\" text-anchor=\"middle\">Pastor<\/text><text class=\"t mu\" x=\"91.0\" y=\"52.0\" text-anchor=\"middle\">on a phone<\/text><rect class=\"b p\" x=\"234\" y=\"12\" width=\"150\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"309.0\" y=\"36.0\" text-anchor=\"middle\">Family<\/text><text class=\"t mu\" x=\"309.0\" y=\"52.0\" text-anchor=\"middle\">hears from the pastor<\/text><path class=\"ar dash\" d=\"M166 40 L234 40\" marker-end=\"url(#ae)\"/><text class=\"t mu lab\" x=\"200\" y=\"32\" text-anchor=\"middle\">by hand<\/text><path class=\"ar \" d=\"M91 68 L91 108\" marker-end=\"url(#ae)\" marker-start=\"url(#as)\"/><text class=\"t mu lab\" x=\"104\" y=\"92\" text-anchor=\"start\">intake, drafts, Approve / Edit / Stop<\/text><rect class=\"b a\" x=\"16\" y=\"110\" width=\"368\" height=\"262\" rx=\"10\"/><text class=\"t ti\" x=\"200\" y=\"132\" text-anchor=\"middle\">Nury<\/text><rect class=\"b n\" x=\"30\" y=\"142\" width=\"340\" height=\"50\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"163.0\" text-anchor=\"middle\">App<\/text><text class=\"t m\" x=\"200.0\" y=\"179.0\" text-anchor=\"middle\">code/app<\/text><rect class=\"b a\" x=\"30\" y=\"202\" width=\"340\" height=\"52\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"216.0\" text-anchor=\"middle\">Privacy layer<\/text><text class=\"t m\" x=\"200.0\" y=\"232.0\" text-anchor=\"middle\">nury/privacy.py<\/text><text class=\"t mu\" x=\"200.0\" y=\"248.0\" text-anchor=\"middle\">names and numbers become tokens<\/text><rect class=\"b n\" x=\"30\" y=\"264\" width=\"340\" height=\"94\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"291.0\" text-anchor=\"middle\">Engine<\/text><text class=\"t m\" x=\"200.0\" y=\"307.0\" text-anchor=\"middle\">code/nury<\/text><text class=\"t mu\" x=\"200.0\" y=\"323.0\" text-anchor=\"middle\">stages, gates, correction loop, safety floor,<\/text><text class=\"t mu\" x=\"200.0\" y=\"339.0\" text-anchor=\"middle\">skills, playbook loader, case file writer<\/text><path class=\"ar \" d=\"M72 408 L72 372\" marker-end=\"url(#ae)\"/><path class=\"ar \" d=\"M300 372 L300 408\" marker-end=\"url(#ae)\" marker-start=\"url(#as)\"/><text class=\"t mu lab\" x=\"308\" y=\"394\" text-anchor=\"start\">tokens only<\/text><rect class=\"b n\" x=\"16\" y=\"410\" width=\"178\" height=\"92\" rx=\"10\"/><text class=\"t ti\" x=\"105.0\" y=\"436.0\" text-anchor=\"middle\">Vetted sources<\/text><text class=\"t m\" x=\"105.0\" y=\"452.0\" text-anchor=\"middle\">playbooks/*/sources<\/text><text class=\"t mu\" x=\"105.0\" y=\"468.0\" text-anchor=\"middle\">rights, directory, hospital<\/text><text class=\"t mu\" x=\"105.0\" y=\"484.0\" text-anchor=\"middle\">DOJ official list<\/text><rect class=\"b n\" x=\"206\" y=\"410\" width=\"178\" height=\"92\" rx=\"10\"/><text class=\"t ti\" x=\"295.0\" y=\"436.0\" text-anchor=\"middle\">Gloo guarded<\/text><text class=\"t\" x=\"295.0\" y=\"452.0\" text-anchor=\"middle\">Responses<\/text><text class=\"t mu\" x=\"295.0\" y=\"468.0\" text-anchor=\"middle\">key from env<\/text><text class=\"t m\" x=\"295.0\" y=\"484.0\" text-anchor=\"middle\">GLOO_API_KEY<\/text><text class=\"t ti\" x=\"16\" y=\"538\" text-anchor=\"start\">On this computer only<\/text><rect class=\"b n\" x=\"16\" y=\"548\" width=\"178\" height=\"84\" rx=\"10\"/><text class=\"t ti\" x=\"105.0\" y=\"570.0\" text-anchor=\"middle\">Church network<\/text><text class=\"t m\" x=\"105.0\" y=\"586.0\" text-anchor=\"middle\">network/ (local)<\/text><text class=\"t mu\" x=\"105.0\" y=\"602.0\" text-anchor=\"middle\">the pastor's own contacts<\/text><text class=\"t mu\" x=\"105.0\" y=\"618.0\" text-anchor=\"middle\">listed, never ranked<\/text><rect class=\"b n\" x=\"206\" y=\"548\" width=\"178\" height=\"84\" rx=\"10\"/><text class=\"t ti\" x=\"295.0\" y=\"570.0\" text-anchor=\"middle\">Audit log, cases<\/text><text class=\"t m\" x=\"295.0\" y=\"586.0\" text-anchor=\"middle\">cases/ (local)<\/text><text class=\"t mu\" x=\"295.0\" y=\"602.0\" text-anchor=\"middle\">case files, token map,<\/text><text class=\"t mu\" x=\"295.0\" y=\"618.0\" text-anchor=\"middle\">each gate and check<\/text><text class=\"t ti\" x=\"16\" y=\"662\" text-anchor=\"start\">Not in Nury<\/text><rect class=\"b x\" x=\"16\" y=\"672\" width=\"176\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"104.0\" y=\"696.0\" text-anchor=\"middle\">Open web<\/text><text class=\"t mu\" x=\"104.0\" y=\"712.0\" text-anchor=\"middle\">no search, no browsing<\/text><rect class=\"b x\" x=\"208\" y=\"672\" width=\"176\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"296.0\" y=\"696.0\" text-anchor=\"middle\">Send path to family<\/text><text class=\"t mu\" x=\"296.0\" y=\"712.0\" text-anchor=\"middle\">no email, SMS, or chat<\/text><path class=\"xm\" d=\"M176 680 l10 10 M186 680 l-10 10\"/><path class=\"xm\" d=\"M368 680 l10 10 M378 680 l-10 10\"/><\/svg><\/div><div class=\"txt\"><h2>System context<\/h2><p>The pastor talks to the Nury app on a phone. Between the engine and Gloo sits the privacy layer, so Gloo sees tokens, not names. Nury reads the vetted sources and the pastor's own church network, and keeps cases and the audit log on this computer. It has no web access and no way to send anything to the family. The pastor shares text by hand.<\/p><div class=\"code-h\">Where it lives<\/div><ul class=\"code\"><li>code/app/server.py<\/li><li>code/nury/privacy.py<\/li><li>code/nury/gloo_client.py<\/li><li>platform.ai.gloo.com<\/li><li>POST /ai/v2/guarded/responses<\/li><li>code/nury/audit.py<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"p-layers\" aria-labelledby=\"t-layers\" hidden><div class=\"fig\"><svg viewBox=\"0 0 400 700\" role=\"img\" aria-label=\"Layers: app and evals call the engine. Inside the engine sit the safety floor, skills, privacy, network and case file modules. A playbook feeds the engine and cannot remove the floor.\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"b n\" x=\"16\" y=\"12\" width=\"178\" height=\"92\" rx=\"10\"/><text class=\"t ti\" x=\"105.0\" y=\"38.0\" text-anchor=\"middle\">App<\/text><text class=\"t m\" x=\"105.0\" y=\"54.0\" text-anchor=\"middle\">code/app<\/text><text class=\"t mu\" x=\"105.0\" y=\"70.0\" text-anchor=\"middle\">pastor screens, sessions,<\/text><text class=\"t mu\" x=\"105.0\" y=\"86.0\" text-anchor=\"middle\">Our network screen<\/text><rect class=\"b n\" x=\"206\" y=\"12\" width=\"178\" height=\"92\" rx=\"10\"/><text class=\"t ti\" x=\"295.0\" y=\"38.0\" text-anchor=\"middle\">Evals<\/text><text class=\"t m\" x=\"295.0\" y=\"54.0\" text-anchor=\"middle\">evaluations/<\/text><text class=\"t mu\" x=\"295.0\" y=\"70.0\" text-anchor=\"middle\">scenarios, judges, panel,<\/text><text class=\"t mu\" x=\"295.0\" y=\"86.0\" text-anchor=\"middle\">scorecard<\/text><path class=\"ar \" d=\"M105 104 L105 140\" marker-end=\"url(#ae)\"/><path class=\"ar \" d=\"M295 104 L295 140\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"142\" width=\"368\" height=\"340\" rx=\"10\"/><text class=\"t ti\" x=\"200\" y=\"164\" text-anchor=\"middle\">Engine  \u00b7  code/nury<\/text><text class=\"t mu\" x=\"200\" y=\"182\" text-anchor=\"middle\">stages, gates, chaining, audit, outcomes.<\/text><rect class=\"b a\" x=\"30\" y=\"194\" width=\"340\" height=\"150\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"241.0\" text-anchor=\"middle\">Safety floor<\/text><text class=\"t m\" x=\"200.0\" y=\"257.0\" text-anchor=\"middle\">guardrails.py + engine.py<\/text><text class=\"t mu\" x=\"200.0\" y=\"273.0\" text-anchor=\"middle\">boundary rules in every prompt, banned patterns,<\/text><text class=\"t mu\" x=\"200.0\" y=\"289.0\" text-anchor=\"middle\">language, link, phone, email allowlist,<\/text><text class=\"t mu\" x=\"200.0\" y=\"305.0\" text-anchor=\"middle\">disclaimer, 3-attempt cap, no send path<\/text><rect class=\"b n\" x=\"30\" y=\"356\" width=\"166\" height=\"54\" rx=\"10\"/><text class=\"t ti\" x=\"113.0\" y=\"371.0\" text-anchor=\"middle\">Skills<\/text><text class=\"t m\" x=\"113.0\" y=\"387.0\" text-anchor=\"middle\">skills.py<\/text><text class=\"t mu\" x=\"113.0\" y=\"403.0\" text-anchor=\"middle\">voice, grounding<\/text><rect class=\"b n\" x=\"204\" y=\"356\" width=\"166\" height=\"54\" rx=\"10\"/><text class=\"t ti\" x=\"287.0\" y=\"371.0\" text-anchor=\"middle\">Privacy<\/text><text class=\"t m\" x=\"287.0\" y=\"387.0\" text-anchor=\"middle\">privacy.py<\/text><text class=\"t mu\" x=\"287.0\" y=\"403.0\" text-anchor=\"middle\">tokens, local map<\/text><rect class=\"b n\" x=\"30\" y=\"418\" width=\"166\" height=\"54\" rx=\"10\"/><text class=\"t ti\" x=\"113.0\" y=\"433.0\" text-anchor=\"middle\">Network<\/text><text class=\"t m\" x=\"113.0\" y=\"449.0\" text-anchor=\"middle\">network.py<\/text><text class=\"t mu\" x=\"113.0\" y=\"465.0\" text-anchor=\"middle\">church list, DOJ list<\/text><rect class=\"b n\" x=\"204\" y=\"418\" width=\"166\" height=\"54\" rx=\"10\"/><text class=\"t ti\" x=\"287.0\" y=\"433.0\" text-anchor=\"middle\">Case file<\/text><text class=\"t m\" x=\"287.0\" y=\"449.0\" text-anchor=\"middle\">casefile.py<\/text><text class=\"t mu\" x=\"287.0\" y=\"465.0\" text-anchor=\"middle\">local pages, map<\/text><path class=\"ar \" d=\"M200 548 L200 482\" marker-end=\"url(#ae)\"/><text class=\"t mu lab\" x=\"212\" y=\"520\" text-anchor=\"start\">loader reads<\/text><rect class=\"b n\" x=\"16\" y=\"550\" width=\"368\" height=\"62\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"577.0\" text-anchor=\"middle\">Playbook  \u00b7  code/playbooks/&lt;id&gt;/<\/text><text class=\"t mu\" x=\"200.0\" y=\"593.0\" text-anchor=\"middle\">one crisis, one folder: prompts, sources, stages, outcomes<\/text><rect class=\"b a\" x=\"16\" y=\"628\" width=\"368\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"652.0\" text-anchor=\"middle\">A playbook and a skill add checks and words.<\/text><text class=\"t\" x=\"200.0\" y=\"668.0\" text-anchor=\"middle\">They cannot remove the floor.<\/text><\/svg><\/div><div class=\"txt\"><h2>Layers and ownership<\/h2><p>The app and the eval harness both call the engine. The engine runs a stage, the gates, chaining and the audit log. The safety floor lives in code, not in data. Skills, privacy, the network and the case file are modules around it. A playbook is data. It can add checks and words, and so can a skill. Neither can remove the floor.<\/p><div class=\"code-h\">Where it lives<\/div><ul class=\"code\"><li>code/app<\/li><li>code/nury/engine.py, guardrails.py, checks.py, playbook.py<\/li><li>code/nury/skills.py, privacy.py, network.py, officiallist.py, casefile.py<\/li><li>code/playbooks/&lt;id&gt;/<\/li><li>evaluations/<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"p-playbook\" aria-labelledby=\"t-playbook\" hidden><div class=\"fig\"><svg viewBox=\"0 0 400 790\" role=\"img\" aria-label=\"Playbook anatomy: the folder, the loader that validates it, field-match paths, detention and hospital live, two coming-soon cards.\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"b n\" x=\"16\" y=\"12\" width=\"368\" height=\"206\" rx=\"10\"/><text class=\"t ti m\" x=\"30\" y=\"36\" text-anchor=\"start\">code/playbooks/detention/<\/text><text class=\"t m\" x=\"30\" y=\"64\" text-anchor=\"start\">playbook.json<\/text><text class=\"t mu\" x=\"160\" y=\"64\" text-anchor=\"start\">id, disclaimer, boundary words<\/text><text class=\"t m\" x=\"30\" y=\"95\" text-anchor=\"start\">stages.json<\/text><text class=\"t mu\" x=\"160\" y=\"95\" text-anchor=\"start\">stages, checks, skills, when<\/text><text class=\"t m\" x=\"30\" y=\"126\" text-anchor=\"start\">prompts/<\/text><text class=\"t mu\" x=\"160\" y=\"126\" text-anchor=\"start\">one text file per stage<\/text><text class=\"t m\" x=\"30\" y=\"157\" text-anchor=\"start\">sources/<\/text><text class=\"t mu\" x=\"160\" y=\"157\" text-anchor=\"start\">vetted JSON, DOJ list, approvals<\/text><text class=\"t m\" x=\"30\" y=\"188\" text-anchor=\"start\">outcomes.json<\/text><text class=\"t mu\" x=\"160\" y=\"188\" text-anchor=\"start\">the four outcomes<\/text><path class=\"ar \" d=\"M200 218 L200 252\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"16\" y=\"254\" width=\"368\" height=\"112\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"282.0\" text-anchor=\"middle\">Loader  \u00b7  nury/playbook.py<\/text><text class=\"t mu\" x=\"200.0\" y=\"298.0\" text-anchor=\"middle\">load_playbook() checks:<\/text><text class=\"t mu\" x=\"200.0\" y=\"314.0\" text-anchor=\"middle\">stage 1 is triage, deps come earlier, checks and<\/text><text class=\"t mu\" x=\"200.0\" y=\"330.0\" text-anchor=\"middle\">skills exist, disclaimer keeps the floor wording,<\/text><text class=\"t mu\" x=\"200.0\" y=\"346.0\" text-anchor=\"middle\">a playbook with pending sources does not run<\/text><path class=\"ar \" d=\"M200 366 L200 400\" marker-end=\"url(#ae)\"/><text class=\"t mu lab\" x=\"212\" y=\"390\" text-anchor=\"start\">Playbook object<\/text><rect class=\"b n\" x=\"16\" y=\"402\" width=\"368\" height=\"44\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"428.0\" text-anchor=\"middle\">Engine  \u00b7  run_stage<\/text><rect class=\"b a\" x=\"16\" y=\"466\" width=\"368\" height=\"150\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"505.0\" text-anchor=\"middle\">Paths: a plain field match, no code<\/text><text class=\"t mu\" x=\"200.0\" y=\"521.0\" text-anchor=\"middle\">triage text:  URGENCY: High, kids at home<\/text><text class=\"t mu\" x=\"200.0\" y=\"537.0\" text-anchor=\"middle\">becomes fields:  urgency = 'high, kids...'<\/text><text class=\"t mu\" x=\"200.0\" y=\"553.0\" text-anchor=\"middle\">stage when {field: urgency, in: [high]}<\/text><text class=\"t mu\" x=\"200.0\" y=\"569.0\" text-anchor=\"middle\">match: stage runs.  No match: skipped.<\/text><text class=\"t mu\" x=\"200.0\" y=\"585.0\" text-anchor=\"middle\">dynamic sources fill in at run time (network)<\/text><text class=\"t ti\" x=\"16\" y=\"650\" text-anchor=\"start\">Playbooks<\/text><rect class=\"b a\" x=\"16\" y=\"660\" width=\"176\" height=\"44\" rx=\"10\"/><text class=\"t ti\" x=\"104.0\" y=\"678.0\" text-anchor=\"middle\">detention<\/text><text class=\"t mu\" x=\"104.0\" y=\"694.0\" text-anchor=\"middle\">#1, live<\/text><rect class=\"b a\" x=\"208\" y=\"660\" width=\"176\" height=\"44\" rx=\"10\"/><text class=\"t ti\" x=\"296.0\" y=\"678.0\" text-anchor=\"middle\">hospital<\/text><text class=\"t mu\" x=\"296.0\" y=\"694.0\" text-anchor=\"middle\">#2, live, sources approved<\/text><rect class=\"b p\" x=\"16\" y=\"714\" width=\"176\" height=\"44\" rx=\"10\"/><text class=\"t ti\" x=\"104.0\" y=\"732.0\" text-anchor=\"middle\">sudden death<\/text><text class=\"t mu\" x=\"104.0\" y=\"748.0\" text-anchor=\"middle\">coming soon, card only<\/text><rect class=\"b p\" x=\"208\" y=\"714\" width=\"176\" height=\"44\" rx=\"10\"/><text class=\"t ti\" x=\"296.0\" y=\"732.0\" text-anchor=\"middle\">house fire<\/text><text class=\"t mu\" x=\"296.0\" y=\"748.0\" text-anchor=\"middle\">coming soon, card only<\/text><\/svg><\/div><div class=\"txt\"><h2>Anatomy of a playbook<\/h2><p>A new crisis is a new folder. The loader checks the folder before the engine uses it, and a playbook whose sources are not all approved does not run. Paths are plain field matches on the triage text. Some sources fill in at run time, such as the church network. Detention and hospital are live. Sudden death and house fire are cards only.<\/p><div class=\"code-h\">Where it lives<\/div><ul class=\"code\"><li>code/playbooks/detention/<\/li><li>code/playbooks/hospital/<\/li><li>code/nury/playbook.py<\/li><li>code/tests/test_core.py<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"p-flow\" aria-labelledby=\"t-flow\" hidden><div class=\"fig\"><svg viewBox=\"0 0 400 818\" role=\"img\" aria-label=\"Run flow: five stages, an approval gate after each, chaining of approved or edited text, four outcomes.\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"b n\" x=\"16\" y=\"10\" width=\"368\" height=\"38\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"33.0\" text-anchor=\"middle\">Pastor's intake<\/text><path class=\"ar \" d=\"M126 48 L126 70\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"70\" width=\"218\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"125.0\" y=\"94.0\" text-anchor=\"middle\">1  Triage<\/text><text class=\"t mu\" x=\"125.0\" y=\"110.0\" text-anchor=\"middle\">reads: intake<\/text><path class=\"ar \" d=\"M234 98 L250 98\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"250\" y=\"70\" width=\"134\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"317.0\" y=\"94.0\" text-anchor=\"middle\">Gate<\/text><text class=\"t mu\" x=\"317.0\" y=\"110.0\" text-anchor=\"middle\">Approve \u00b7 Edit \u00b7 Stop<\/text><path class=\"ar \" d=\"M126 138 L126 160\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"160\" width=\"218\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"125.0\" y=\"184.0\" text-anchor=\"middle\">2  Rights brief<\/text><text class=\"t mu\" x=\"125.0\" y=\"200.0\" text-anchor=\"middle\">reads: triage<\/text><path class=\"ar \" d=\"M234 188 L250 188\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"250\" y=\"160\" width=\"134\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"317.0\" y=\"184.0\" text-anchor=\"middle\">Gate<\/text><text class=\"t mu\" x=\"317.0\" y=\"200.0\" text-anchor=\"middle\">Approve \u00b7 Edit \u00b7 Stop<\/text><path class=\"ar \" d=\"M126 228 L126 250\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"250\" width=\"218\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"125.0\" y=\"274.0\" text-anchor=\"middle\">3  Attorney resources<\/text><text class=\"t mu\" x=\"125.0\" y=\"290.0\" text-anchor=\"middle\">reads: triage, rights<\/text><path class=\"ar \" d=\"M234 278 L250 278\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"250\" y=\"250\" width=\"134\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"317.0\" y=\"274.0\" text-anchor=\"middle\">Gate<\/text><text class=\"t mu\" x=\"317.0\" y=\"290.0\" text-anchor=\"middle\">Approve \u00b7 Edit \u00b7 Stop<\/text><path class=\"ar \" d=\"M126 318 L126 340\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"340\" width=\"218\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"125.0\" y=\"364.0\" text-anchor=\"middle\">4  Family checklist<\/text><text class=\"t mu\" x=\"125.0\" y=\"380.0\" text-anchor=\"middle\">reads: triage, rights, attorney<\/text><path class=\"ar \" d=\"M234 368 L250 368\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"250\" y=\"340\" width=\"134\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"317.0\" y=\"364.0\" text-anchor=\"middle\">Gate<\/text><text class=\"t mu\" x=\"317.0\" y=\"380.0\" text-anchor=\"middle\">Approve \u00b7 Edit \u00b7 Stop<\/text><path class=\"ar \" d=\"M126 408 L126 430\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"430\" width=\"218\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"125.0\" y=\"454.0\" text-anchor=\"middle\">5  Pastoral message<\/text><text class=\"t mu\" x=\"125.0\" y=\"470.0\" text-anchor=\"middle\">reads: triage, rights, checklist<\/text><path class=\"ar \" d=\"M234 458 L250 458\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"250\" y=\"430\" width=\"134\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"317.0\" y=\"454.0\" text-anchor=\"middle\">Gate<\/text><text class=\"t mu\" x=\"317.0\" y=\"470.0\" text-anchor=\"middle\">Approve \u00b7 Edit \u00b7 Stop<\/text><text class=\"t mu\" x=\"16\" y=\"530\" text-anchor=\"start\">Approved or edited text, plus the<\/text><text class=\"t mu\" x=\"16\" y=\"546\" text-anchor=\"start\">disclaimer, is what later stages read.<\/text><text class=\"t ti\" x=\"16\" y=\"580\" text-anchor=\"start\">Outcome<\/text><rect class=\"b a\" x=\"16\" y=\"592\" width=\"178\" height=\"66\" rx=\"10\"/><text class=\"t m\" x=\"105.0\" y=\"621.0\" text-anchor=\"middle\">package_complete<\/text><text class=\"t mu\" x=\"105.0\" y=\"637.0\" text-anchor=\"middle\">all five approved or edited<\/text><rect class=\"b n\" x=\"206\" y=\"592\" width=\"178\" height=\"66\" rx=\"10\"/><text class=\"t m\" x=\"295.0\" y=\"621.0\" text-anchor=\"middle\">stopped_by_pastor<\/text><text class=\"t mu\" x=\"295.0\" y=\"637.0\" text-anchor=\"middle\">Stop at any gate<\/text><rect class=\"b n\" x=\"16\" y=\"668\" width=\"178\" height=\"66\" rx=\"10\"/><text class=\"t m\" x=\"105.0\" y=\"697.0\" text-anchor=\"middle\">escalated<\/text><text class=\"t mu\" x=\"105.0\" y=\"713.0\" text-anchor=\"middle\">3 attempts failed checks<\/text><rect class=\"b n\" x=\"206\" y=\"668\" width=\"178\" height=\"66\" rx=\"10\"/><text class=\"t m\" x=\"295.0\" y=\"689.0\" text-anchor=\"middle\">blocked<\/text><text class=\"t mu\" x=\"295.0\" y=\"705.0\" text-anchor=\"middle\">Gloo blocked every try,<\/text><text class=\"t mu\" x=\"295.0\" y=\"721.0\" text-anchor=\"middle\">or the call failed<\/text><rect class=\"b x\" x=\"16\" y=\"748\" width=\"368\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"772.0\" text-anchor=\"middle\">Nothing is sent. The pastor shares the package.<\/text><text class=\"t mu\" x=\"200.0\" y=\"788.0\" text-anchor=\"middle\">No send path exists in the code.<\/text><\/svg><\/div><div class=\"txt\"><h2>One run, five stages<\/h2><p>Each stage ends at a gate: Approve, Edit, or Stop. Later stages read the approved or edited text, so a pastor's edit carries forward. A run ends in one of four outcomes. Nothing is sent. The pastor shares the package, or saves it as a case.<\/p><div class=\"code-h\">Where it lives<\/div><ul class=\"code\"><li>code/nury/engine.py run_pipeline<\/li><li>code/playbooks/detention/stages.json<\/li><li>code/playbooks/detention/outcomes.json<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"p-loop\" aria-labelledby=\"t-loop\" hidden><div class=\"fig\"><svg viewBox=\"0 0 400 600\" role=\"img\" aria-label=\"Correction loop for one stage, through the privacy layer: draft, checks, reject with a reason category, regenerate up to three attempts, escalate.\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"b n\" x=\"16\" y=\"10\" width=\"236\" height=\"54\" rx=\"10\"/><text class=\"t ti\" x=\"134.0\" y=\"25.0\" text-anchor=\"middle\">Build the prompt<\/text><text class=\"t mu\" x=\"134.0\" y=\"41.0\" text-anchor=\"middle\">rules + playbook prompt + skills<\/text><text class=\"t mu\" x=\"134.0\" y=\"57.0\" text-anchor=\"middle\">+ vetted sources + approved text<\/text><path class=\"ar \" d=\"M134 64 L134 84\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"86\" width=\"236\" height=\"44\" rx=\"10\"/><text class=\"t ti\" x=\"134.0\" y=\"104.0\" text-anchor=\"middle\">Gloo call, through privacy<\/text><text class=\"t mu\" x=\"134.0\" y=\"120.0\" text-anchor=\"middle\">names to tokens and back<\/text><path class=\"ar \" d=\"M134 130 L134 150\" marker-end=\"url(#ae)\"/><rect class=\"b p\" x=\"16\" y=\"152\" width=\"236\" height=\"62\" rx=\"10\"/><text class=\"t ti\" x=\"134.0\" y=\"171.0\" text-anchor=\"middle\">Fault injection (test, demo)<\/text><text class=\"t mu\" x=\"134.0\" y=\"187.0\" text-anchor=\"middle\">appends an unsafe suffix to the<\/text><text class=\"t mu\" x=\"134.0\" y=\"203.0\" text-anchor=\"middle\">first N drafts, before the checks<\/text><path class=\"ar \" d=\"M134 214 L134 234\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"16\" y=\"236\" width=\"236\" height=\"72\" rx=\"10\"/><text class=\"t ti\" x=\"134.0\" y=\"260.0\" text-anchor=\"middle\">Checks<\/text><text class=\"t mu\" x=\"134.0\" y=\"276.0\" text-anchor=\"middle\">floor, playbook and skill checks:<\/text><text class=\"t mu\" x=\"134.0\" y=\"292.0\" text-anchor=\"middle\">phrases, language, links, contacts<\/text><path class=\"ar \" d=\"M134 308 L134 330\" marker-end=\"url(#ae)\"/><polygon class=\"b a\" points=\"134,330.0 198.0,366 134,402.0 70.0,366\"/><text class=\"t ti\" x=\"134\" y=\"371\" text-anchor=\"middle\">clean?<\/text><path class=\"ar \" d=\"M134 402 L134 428\" marker-end=\"url(#ae)\"/><text class=\"t mu lab\" x=\"146\" y=\"420\" text-anchor=\"start\">yes<\/text><rect class=\"b n\" x=\"16\" y=\"430\" width=\"236\" height=\"58\" rx=\"10\"/><text class=\"t ti\" x=\"134.0\" y=\"455.0\" text-anchor=\"middle\">Safe draft goes to the gate<\/text><text class=\"t mu\" x=\"134.0\" y=\"471.0\" text-anchor=\"middle\">pastor sees label + draft + disclaimer<\/text><path class=\"ar \" d=\"M198 366 L268 366\" marker-end=\"url(#ae)\"/><text class=\"t mu lab\" x=\"204\" y=\"358\" text-anchor=\"start\">no<\/text><rect class=\"b x\" x=\"268\" y=\"322\" width=\"116\" height=\"90\" rx=\"10\"/><text class=\"t ti\" x=\"326.0\" y=\"347.0\" text-anchor=\"middle\">Reject<\/text><text class=\"t mu\" x=\"326.0\" y=\"363.0\" text-anchor=\"middle\">reason category<\/text><text class=\"t m\" x=\"326.0\" y=\"379.0\" text-anchor=\"middle\">banned_phrase<\/text><text class=\"t m\" x=\"326.0\" y=\"395.0\" text-anchor=\"middle\">endorsement<\/text><path class=\"ar \" d=\"M326 412 L326 440\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"268\" y=\"442\" width=\"116\" height=\"62\" rx=\"10\"/><text class=\"t ti\" x=\"326.0\" y=\"461.0\" text-anchor=\"middle\">Audit log<\/text><text class=\"t m\" x=\"326.0\" y=\"477.0\" text-anchor=\"middle\">draft_rejected<\/text><text class=\"t mu\" x=\"326.0\" y=\"493.0\" text-anchor=\"middle\">never shown<\/text><path class=\"ar \" d=\"M342 322 L342 108 L252 108\" marker-end=\"url(#ae)\"/><text class=\"t mu lab\" x=\"262\" y=\"190\" text-anchor=\"start\">regenerate<\/text><text class=\"t mu lab\" x=\"262\" y=\"206\" text-anchor=\"start\">with the reasons,<\/text><text class=\"t mu lab\" x=\"262\" y=\"222\" text-anchor=\"start\">not the draft<\/text><path class=\"ar x\" d=\"M384 366 L392 366 L392 552 L384 552\" marker-end=\"url(#ae)\"/><text class=\"t mu lab\" x=\"388\" y=\"518\" text-anchor=\"end\">3rd fail<\/text><rect class=\"b x\" x=\"16\" y=\"524\" width=\"368\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"548.0\" text-anchor=\"middle\">Escalate: no draft is shown<\/text><text class=\"t mu\" x=\"200.0\" y=\"564.0\" text-anchor=\"middle\">\"I'll handle this manually.\"  Outcome: escalated<\/text><\/svg><\/div><div class=\"txt\"><h2>Correction loop, one stage<\/h2><p>The engine drafts through the privacy layer, checks, and either shows a safe draft or rejects it with a reason category. A rejected draft goes to the audit log and the eval record, never to the pastor. The engine regenerates with the reasons, not the draft. Three attempts in total, then it escalates and shows no draft. The fault-injection point is how the demo and the evals force a rejection.<\/p><div class=\"code-h\">Where it lives<\/div><ul class=\"code\"><li>code/nury/engine.py run_stage<\/li><li>code/nury/guardrails.py<\/li><li>code/nury/checks.py<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"p-privacy\" aria-labelledby=\"t-privacy\" hidden><div class=\"fig\"><svg viewBox=\"0 0 400 770\" role=\"img\" aria-label=\"Privacy layer: the pastor confirms names, PrivacyClient swaps identifiers for tokens, Gloo sees tokens only, the map stays local, replies are turned back, the leak test checks the request body.\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"b n\" x=\"16\" y=\"10\" width=\"368\" height=\"44\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"28.0\" text-anchor=\"middle\">Intake<\/text><text class=\"t mu\" x=\"200.0\" y=\"44.0\" text-anchor=\"middle\">what the pastor typed<\/text><path class=\"ar \" d=\"M200 54 L200 74\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"76\" width=\"368\" height=\"58\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"93.0\" text-anchor=\"middle\">The pastor confirms what to protect<\/text><text class=\"t m\" x=\"200.0\" y=\"109.0\" text-anchor=\"middle\">propose_terms()<\/text><text class=\"t mu\" x=\"200.0\" y=\"125.0\" text-anchor=\"middle\">people suggested, places left alone<\/text><path class=\"ar \" d=\"M200 134 L200 156\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"16\" y=\"158\" width=\"368\" height=\"116\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"188.0\" text-anchor=\"middle\">PrivacyClient  \u00b7  nury/privacy.py<\/text><text class=\"t mu\" x=\"200.0\" y=\"204.0\" text-anchor=\"middle\">names, phones, emails, street addresses,<\/text><text class=\"t mu\" x=\"200.0\" y=\"220.0\" text-anchor=\"middle\">dates, A-numbers, case numbers, IDs<\/text><text class=\"t mu\" x=\"200.0\" y=\"236.0\" text-anchor=\"middle\">become tokens: [PERSON_1] [PHONE_1] ...<\/text><text class=\"t mu\" x=\"200.0\" y=\"252.0\" text-anchor=\"middle\">cities and states stay. Vetted contacts stay.<\/text><path class=\"ar \" d=\"M105 274 L105 304\" marker-end=\"url(#ae)\" marker-start=\"url(#as)\"/><path class=\"ar \" d=\"M295 274 L295 304\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"306\" width=\"178\" height=\"92\" rx=\"10\"/><text class=\"t ti\" x=\"105.0\" y=\"332.0\" text-anchor=\"middle\">Token map<\/text><text class=\"t mu\" x=\"105.0\" y=\"348.0\" text-anchor=\"middle\">in memory and in the<\/text><text class=\"t mu\" x=\"105.0\" y=\"364.0\" text-anchor=\"middle\">case file, privacy-map.json<\/text><text class=\"t mu\" x=\"105.0\" y=\"380.0\" text-anchor=\"middle\">never sent<\/text><rect class=\"b n\" x=\"206\" y=\"306\" width=\"178\" height=\"92\" rx=\"10\"/><text class=\"t ti\" x=\"295.0\" y=\"340.0\" text-anchor=\"middle\">Gloo<\/text><text class=\"t mu\" x=\"295.0\" y=\"356.0\" text-anchor=\"middle\">sees tokens only<\/text><text class=\"t m\" x=\"295.0\" y=\"372.0\" text-anchor=\"middle\">GLOO_API_KEY<\/text><path class=\"ar \" d=\"M295 398 L295 424\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"426\" width=\"368\" height=\"78\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"445.0\" text-anchor=\"middle\">The reply comes back<\/text><text class=\"t mu\" x=\"200.0\" y=\"461.0\" text-anchor=\"middle\">tokens turned back into names<\/text><text class=\"t mu\" x=\"200.0\" y=\"477.0\" text-anchor=\"middle\">[PERSON 1] and PERSON_1 are repaired<\/text><text class=\"t mu\" x=\"200.0\" y=\"493.0\" text-anchor=\"middle\">unknown token: ask again, max 2, then [?]<\/text><path class=\"ar \" d=\"M200 504 L200 524\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"526\" width=\"368\" height=\"44\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"552.0\" text-anchor=\"middle\">Checks and the gate see real names<\/text><rect class=\"b a\" x=\"16\" y=\"590\" width=\"368\" height=\"84\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"612.0\" text-anchor=\"middle\">Leak test  \u00b7  tests/test_privacy.py<\/text><text class=\"t mu\" x=\"200.0\" y=\"628.0\" text-anchor=\"middle\">captures the exact request body at the HTTP edge:<\/text><text class=\"t mu\" x=\"200.0\" y=\"644.0\" text-anchor=\"middle\">no canary name, phone, email, address or ID<\/text><text class=\"t mu\" x=\"200.0\" y=\"660.0\" text-anchor=\"middle\">in 5 stages, 2 playbooks, a rejected draft, a new name<\/text><rect class=\"b p\" x=\"16\" y=\"692\" width=\"368\" height=\"66\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"713.0\" text-anchor=\"middle\">Honest limit<\/text><text class=\"t mu\" x=\"200.0\" y=\"729.0\" text-anchor=\"middle\">Direct identifiers only. Context can still hint<\/text><text class=\"t mu\" x=\"200.0\" y=\"745.0\" text-anchor=\"middle\">(14 years, his workplace). An unprotected name stays.<\/text><\/svg><\/div><div class=\"txt\"><h2>Privacy layer<\/h2><p>Nury sends no direct identifiers to a model. The pastor confirms which names to protect. Names, phones, emails, street addresses, dates and ID numbers become tokens before the request leaves, and become real again when the reply returns. The map stays local. A leak test captures the request body and finds none of the canary values. Built and measured live on three scenarios: all passed, about 4 to 5 percent more input tokens. It removes direct identifiers only.<\/p><div class=\"code-h\">Where it lives<\/div><ul class=\"code\"><li>code/nury/privacy.py<\/li><li>code/tests/test_privacy.py<\/li><li>code/INTERFACE.md, section Privacy<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"p-sources\" aria-labelledby=\"t-sources\" hidden><div class=\"fig\"><svg viewBox=\"0 0 400 800\" role=\"img\" aria-label=\"Vetted sources: playbook sources, the DOJ official list and the church network feed the stage prompt and the allowlist, then the checks. No open web.\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"b n\" x=\"16\" y=\"10\" width=\"368\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"26.0\" text-anchor=\"middle\">Playbook sources<\/text><text class=\"t m\" x=\"200.0\" y=\"42.0\" text-anchor=\"middle\">playbooks/&lt;id&gt;/sources<\/text><text class=\"t mu\" x=\"200.0\" y=\"58.0\" text-anchor=\"middle\">rights, directory, hospital: Juan approved<\/text><rect class=\"b p\" x=\"16\" y=\"82\" width=\"368\" height=\"82\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"103.0\" text-anchor=\"middle\">DOJ official list  \u00b7  built, live check pending<\/text><text class=\"t m\" x=\"200.0\" y=\"119.0\" text-anchor=\"middle\">official_list.json<\/text><text class=\"t mu\" x=\"200.0\" y=\"135.0\" text-anchor=\"middle\">18 approved providers, Colorado. 7 held: names only.<\/text><text class=\"t mu\" x=\"200.0\" y=\"151.0\" text-anchor=\"middle\">ABA entry: email route, never the military number<\/text><rect class=\"b p\" x=\"16\" y=\"180\" width=\"368\" height=\"82\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"201.0\" text-anchor=\"middle\">Church network  \u00b7  built, live check pending<\/text><text class=\"t m\" x=\"200.0\" y=\"217.0\" text-anchor=\"middle\">network/network.json (local, the pastor's own)<\/text><text class=\"t mu\" x=\"200.0\" y=\"233.0\" text-anchor=\"middle\">matched by state, language, kind, city<\/text><text class=\"t mu\" x=\"200.0\" y=\"249.0\" text-anchor=\"middle\">the pastor's note is never sent<\/text><path class=\"ar \" d=\"M200 66 L200 82\" marker-end=\"url(#ae)\"/><path class=\"ar \" d=\"M200 164 L200 180\" marker-end=\"url(#ae)\"/><path class=\"ar \" d=\"M200 262 L200 292\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"16\" y=\"294\" width=\"368\" height=\"82\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"315.0\" text-anchor=\"middle\">Into the stage prompt and the allowlist<\/text><text class=\"t mu\" x=\"200.0\" y=\"331.0\" text-anchor=\"middle\">church contacts first, then the DOJ list, then national<\/text><text class=\"t mu\" x=\"200.0\" y=\"347.0\" text-anchor=\"middle\">their phones, links and emails join the allowlist<\/text><text class=\"t mu\" x=\"200.0\" y=\"363.0\" text-anchor=\"middle\">with the privacy layer told not to tokenize them<\/text><path class=\"ar \" d=\"M200 376 L200 402\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"16\" y=\"404\" width=\"368\" height=\"148\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"442.0\" text-anchor=\"middle\">Checks on the draft<\/text><text class=\"t mu\" x=\"200.0\" y=\"458.0\" text-anchor=\"middle\">a contact keeps its exact name and its own contact<\/text><text class=\"t mu\" x=\"200.0\" y=\"474.0\" text-anchor=\"middle\">a held or unknown name, phone, link or email: rejected<\/text><text class=\"t mu\" x=\"200.0\" y=\"490.0\" text-anchor=\"middle\">no best, top or recommended; nothing called free<\/text><text class=\"t mu\" x=\"200.0\" y=\"506.0\" text-anchor=\"middle\">'listed does not mean recommended' must appear<\/text><text class=\"t mu\" x=\"200.0\" y=\"522.0\" text-anchor=\"middle\">bare domains count as links<\/text><path class=\"ar \" d=\"M200 552 L200 578\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"580\" width=\"368\" height=\"58\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"597.0\" text-anchor=\"middle\">What the family gets<\/text><text class=\"t mu\" x=\"200.0\" y=\"613.0\" text-anchor=\"middle\">contacts labeled the church's own or DOJ-listed<\/text><text class=\"t mu\" x=\"200.0\" y=\"629.0\" text-anchor=\"middle\">Nury never ranks, endorses, or invents one<\/text><text class=\"t ti\" x=\"16\" y=\"668\" text-anchor=\"start\">Not in Nury<\/text><rect class=\"b x\" x=\"16\" y=\"678\" width=\"368\" height=\"62\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"705.0\" text-anchor=\"middle\">Open web at runtime<\/text><text class=\"t mu\" x=\"200.0\" y=\"721.0\" text-anchor=\"middle\">a pastor-triggered 'find more' panel is after submission<\/text><path class=\"xm\" d=\"M368 686 l10 10 M378 686 l-10 10\"/><rect class=\"b p\" x=\"16\" y=\"752\" width=\"368\" height=\"38\" rx=\"10\"/><text class=\"t\" x=\"200.0\" y=\"775.0\" text-anchor=\"middle\">Cases and the network never leave this computer<\/text><\/svg><\/div><div class=\"txt\"><h2>Vetted sources, network, official list<\/h2><p>Contacts come from three places: the playbook's approved sources, the DOJ official list as Juan approved it, and the pastor's own church network. All three are built and tested offline. Church contacts are listed first, labeled as the church's own. Nothing is ranked or called free. The live check for the network and the DOJ list is pending.<\/p><div class=\"code-h\">Where it lives<\/div><ul class=\"code\"><li>code/nury/network.py<\/li><li>code/nury/officiallist.py<\/li><li>code/playbooks/detention/sources/official_list.json<\/li><li>code/network_demo/DEMO_NETWORK_FAKE.json<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"p-skills\" aria-labelledby=\"t-skills\" hidden><div class=\"fig\"><svg viewBox=\"0 0 400 640\" role=\"img\" aria-label=\"Skills: stages.json names them, the loader validates and refuses unsafe ones, the text joins the prompt, the audit log records which ran.\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"b n\" x=\"16\" y=\"10\" width=\"368\" height=\"52\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"32.0\" text-anchor=\"middle\">stages.json<\/text><text class=\"t m\" x=\"200.0\" y=\"48.0\" text-anchor=\"middle\">\"skills\": [\"voice\", \"grounding\"]<\/text><p
