ath class=\"ar \" d=\"M200 62 L200 84\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"16\" y=\"86\" width=\"368\" height=\"110\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"113.0\" text-anchor=\"middle\">Loader  \u00b7  nury/skills.py<\/text><text class=\"t mu\" x=\"200.0\" y=\"129.0\" text-anchor=\"middle\">reads code/skills/&lt;name&gt;/SKILL.md<\/text><text class=\"t mu\" x=\"200.0\" y=\"145.0\" text-anchor=\"middle\">needs a version and EN and ES sections<\/text><text class=\"t mu\" x=\"200.0\" y=\"161.0\" text-anchor=\"middle\">refuses a skill that overrides the floor, removes a<\/text><text class=\"t mu\" x=\"200.0\" y=\"177.0\" text-anchor=\"middle\">check, names an unknown check, or has no version<\/text><path class=\"ar \" d=\"M105 196 L105 222\" marker-end=\"url(#ae)\"/><path class=\"ar \" d=\"M295 196 L295 222\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"224\" width=\"178\" height=\"112\" rx=\"10\"/><text class=\"t ti\" x=\"105.0\" y=\"252.0\" text-anchor=\"middle\">voice 1.0.0<\/text><text class=\"t mu\" x=\"105.0\" y=\"268.0\" text-anchor=\"middle\">plain words, short<\/text><text class=\"t mu\" x=\"105.0\" y=\"284.0\" text-anchor=\"middle\">sentences, no stock AI<\/text><text class=\"t mu\" x=\"105.0\" y=\"300.0\" text-anchor=\"middle\">phrases, natural Spanish<\/text><text class=\"t mu\" x=\"105.0\" y=\"316.0\" text-anchor=\"middle\">on pastoral, checklist<\/text><rect class=\"b n\" x=\"206\" y=\"224\" width=\"178\" height=\"112\" rx=\"10\"/><text class=\"t ti\" x=\"295.0\" y=\"252.0\" text-anchor=\"middle\">grounding 1.0.0<\/text><text class=\"t mu\" x=\"295.0\" y=\"268.0\" text-anchor=\"middle\">every line from the<\/text><text class=\"t mu\" x=\"295.0\" y=\"284.0\" text-anchor=\"middle\">vetted points or a plain<\/text><text class=\"t mu\" x=\"295.0\" y=\"300.0\" text-anchor=\"middle\">question for the expert<\/text><text class=\"t mu\" x=\"295.0\" y=\"316.0\" text-anchor=\"middle\">on checklist, attorney<\/text><path class=\"ar \" d=\"M105 336 L105 362\" marker-end=\"url(#ae)\"/><path class=\"ar \" d=\"M295 336 L200 362\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"364\" width=\"368\" height=\"54\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"387.0\" text-anchor=\"middle\">Skill text added to the prompt<\/text><text class=\"t mu\" x=\"200.0\" y=\"403.0\" text-anchor=\"middle\">in the output language. No extra model call.<\/text><path class=\"ar \" d=\"M200 418 L200 442\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"444\" width=\"368\" height=\"82\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"465.0\" text-anchor=\"middle\">Evidence<\/text><text class=\"t m\" x=\"200.0\" y=\"481.0\" text-anchor=\"middle\">skill_applied {name, version, stage}<\/text><text class=\"t mu\" x=\"200.0\" y=\"497.0\" text-anchor=\"middle\">metrics.skills on every stage result<\/text><text class=\"t mu\" x=\"200.0\" y=\"513.0\" text-anchor=\"middle\">skills=False or NURY_SKILLS=off: before and after<\/text><rect class=\"b a\" x=\"16\" y=\"544\" width=\"368\" height=\"58\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"569.0\" text-anchor=\"middle\">A skill adds rules and checks.<\/text><text class=\"t\" x=\"200.0\" y=\"585.0\" text-anchor=\"middle\">It never removes the floor or the disclaimer.<\/text><\/svg><\/div><div class=\"txt\"><h2>Skills: voice and grounding<\/h2><p>A skill is a small versioned text module that a stage names in stages.json. The loader validates it and refuses one that tries to override the floor. The text joins the prompt with no extra model call, and the audit log records which skills ran. They can be switched off to compare before and after. The before and after run is scripted and waits for credits.<\/p><div class=\"code-h\">Where it lives<\/div><ul class=\"code\"><li>code/skills/voice/SKILL.md<\/li><li>code/skills/grounding/SKILL.md<\/li><li>code/nury/skills.py<\/li><li>evaluations/skills_ab.py<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"p-casefile\" aria-labelledby=\"t-casefile\" hidden><div class=\"fig\"><svg viewBox=\"0 0 400 800\" role=\"img\" aria-label=\"Case file: save_case writes a local folder of linked pages and a next-steps map from approved text only; revision v1 to v2 sits beside the original. Nothing is uploaded.\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"b n\" x=\"16\" y=\"10\" width=\"368\" height=\"44\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"36.0\" text-anchor=\"middle\">Package approved by the pastor<\/text><path class=\"ar \" d=\"M200 54 L200 76\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"16\" y=\"78\" width=\"368\" height=\"70\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"101.0\" text-anchor=\"middle\">save_case(state, audit, playbook)<\/text><text class=\"t mu\" x=\"200.0\" y=\"117.0\" text-anchor=\"middle\">refuses unless every stage is approved or edited<\/text><text class=\"t mu\" x=\"200.0\" y=\"133.0\" text-anchor=\"middle\">guard: no rejected draft, no key in the folder<\/text><path class=\"ar \" d=\"M200 148 L200 172\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"174\" width=\"368\" height=\"168\" rx=\"10\"/><text class=\"t ti m\" x=\"30\" y=\"196\" text-anchor=\"start\">cases/&lt;id&gt;/  (local, gitignored)<\/text><text class=\"t m\" x=\"30\" y=\"218\" text-anchor=\"start\">index.md<\/text><text class=\"t mu\" x=\"176\" y=\"218\" text-anchor=\"start\">summary, next step, links<\/text><text class=\"t m\" x=\"30\" y=\"235\" text-anchor=\"start\">intake.md<\/text><text class=\"t mu\" x=\"176\" y=\"235\" text-anchor=\"start\">the pastor's words, exactly<\/text><text class=\"t m\" x=\"30\" y=\"252\" text-anchor=\"start\">01 to 05<\/text><text class=\"t mu\" x=\"176\" y=\"252\" text-anchor=\"start\">each stage as approved<\/text><text class=\"t m\" x=\"30\" y=\"269\" text-anchor=\"start\">people, documents<\/text><text class=\"t mu\" x=\"176\" y=\"269\" text-anchor=\"start\">from triage and checklist<\/text><text class=\"t m\" x=\"30\" y=\"286\" text-anchor=\"start\">timeline, log<\/text><text class=\"t mu\" x=\"176\" y=\"286\" text-anchor=\"start\">gates; categories only<\/text><text class=\"t m\" x=\"30\" y=\"303\" text-anchor=\"start\">nextsteps.svg<\/text><text class=\"t mu\" x=\"176\" y=\"303\" text-anchor=\"start\">the map<\/text><text class=\"t m\" x=\"30\" y=\"320\" text-anchor=\"start\">privacy-map.json<\/text><text class=\"t mu\" x=\"176\" y=\"320\" text-anchor=\"start\">real values, local<\/text><path class=\"ar \" d=\"M200 342 L200 364\" marker-end=\"url(#ae)\"/><text class=\"t ti\" x=\"16\" y=\"372\" text-anchor=\"start\">Next-steps map<\/text><rect class=\"b n\" x=\"16\" y=\"380\" width=\"178\" height=\"50\" rx=\"10\"/><text class=\"t ti\" x=\"105.0\" y=\"401.0\" text-anchor=\"middle\">Tonight<\/text><text class=\"t mu\" x=\"105.0\" y=\"417.0\" text-anchor=\"middle\">checklist steps<\/text><rect class=\"b n\" x=\"206\" y=\"380\" width=\"178\" height=\"50\" rx=\"10\"/><text class=\"t ti\" x=\"295.0\" y=\"401.0\" text-anchor=\"middle\">This week<\/text><text class=\"t mu\" x=\"295.0\" y=\"417.0\" text-anchor=\"middle\">documents to gather<\/text><rect class=\"b n\" x=\"16\" y=\"438\" width=\"178\" height=\"50\" rx=\"10\"/><text class=\"t ti\" x=\"105.0\" y=\"459.0\" text-anchor=\"middle\">Questions still open<\/text><text class=\"t mu\" x=\"105.0\" y=\"475.0\" text-anchor=\"middle\">triage missing facts<\/text><rect class=\"b n\" x=\"206\" y=\"438\" width=\"178\" height=\"50\" rx=\"10\"/><text class=\"t ti\" x=\"295.0\" y=\"459.0\" text-anchor=\"middle\">Who to call<\/text><text class=\"t mu\" x=\"295.0\" y=\"475.0\" text-anchor=\"middle\">vetted and church contacts<\/text><text class=\"t mu\" x=\"16\" y=\"508\" text-anchor=\"start\">Steps and questions only. No outcomes.<\/text><rect class=\"b p\" x=\"16\" y=\"526\" width=\"368\" height=\"128\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"562.0\" text-anchor=\"middle\">Revision, v1 to v2  \u00b7  built, live check pending<\/text><text class=\"t mu\" x=\"200.0\" y=\"578.0\" text-anchor=\"middle\">the pastor records what happened, in their words<\/text><text class=\"t mu\" x=\"200.0\" y=\"594.0\" text-anchor=\"middle\">earlier stages kept, new facts re-run from triage<\/text><text class=\"t mu\" x=\"200.0\" y=\"610.0\" text-anchor=\"middle\">v2 saved beside v1 with changes.md and revision.json<\/text><text class=\"t mu\" x=\"200.0\" y=\"626.0\" text-anchor=\"middle\">v1 is never touched<\/text><text class=\"t ti\" x=\"16\" y=\"684\" text-anchor=\"start\">Not in Nury<\/text><rect class=\"b x\" x=\"16\" y=\"694\" width=\"368\" height=\"56\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"718.0\" text-anchor=\"middle\">Uploaded or sent anywhere<\/text><text class=\"t mu\" x=\"200.0\" y=\"734.0\" text-anchor=\"middle\">cases/ stays on this computer. The pastor shares.<\/text><path class=\"xm\" d=\"M368 702 l10 10 M378 702 l-10 10\"/><\/svg><\/div><div class=\"txt\"><h2>Case file and next-steps map<\/h2><p>After the pastor approves a package, Nury can save it as a local folder of linked pages, built without a model call from approved text only. The next-steps map shows steps and questions, never outcomes. A saved case can be revised: the earlier version stays untouched and the new one sits beside it. Revision is built and checked offline. Its live check is pending.<\/p><div class=\"code-h\">Where it lives<\/div><ul class=\"code\"><li>code/nury/casefile.py<\/li><li>code/app/server.py (revision)<\/li><li>code/tests/test_casefile.py<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"p-evals\" aria-labelledby=\"t-evals\" hidden><div class=\"fig\"><svg viewBox=\"0 0 400 960\" role=\"img\" aria-label=\"Eval harness: scenarios and attacker intakes, adapter, engine with privacy on, trajectory, three judge layers (deterministic, Jev, red-team panel), scorecard, review canvas, and the keys.\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"b n\" x=\"16\" y=\"10\" width=\"178\" height=\"54\" rx=\"10\"/><text class=\"t ti\" x=\"105.0\" y=\"33.0\" text-anchor=\"middle\">Scenarios<\/text><text class=\"t mu\" x=\"105.0\" y=\"49.0\" text-anchor=\"middle\">detention, hospital, network<\/text><rect class=\"b p\" x=\"206\" y=\"10\" width=\"178\" height=\"54\" rx=\"10\"/><text class=\"t ti\" x=\"295.0\" y=\"33.0\" text-anchor=\"middle\">Attacker intakes<\/text><text class=\"t mu\" x=\"295.0\" y=\"49.0\" text-anchor=\"middle\">a01 to a18, eval only<\/text><path class=\"ar \" d=\"M105 64 L105 86\" marker-end=\"url(#ae)\"/><path class=\"ar \" d=\"M295 64 L200 86\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"88\" width=\"368\" height=\"62\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"107.0\" text-anchor=\"middle\">Adapter<\/text><text class=\"t m\" x=\"200.0\" y=\"123.0\" text-anchor=\"middle\">adapter_nury.run()<\/text><text class=\"t mu\" x=\"200.0\" y=\"139.0\" text-anchor=\"middle\">run_scripted: scripted gate, fault injection, privacy ON<\/text><path class=\"ar \" d=\"M200 150 L200 172\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"16\" y=\"174\" width=\"368\" height=\"44\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"192.0\" text-anchor=\"middle\">Nury engine<\/text><text class=\"t mu\" x=\"200.0\" y=\"208.0\" text-anchor=\"middle\">real Gloo calls, needs GLOO_API_KEY<\/text><path class=\"ar \" d=\"M200 218 L200 240\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"242\" width=\"368\" height=\"54\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"257.0\" text-anchor=\"middle\">Trajectory<\/text><text class=\"t mu\" x=\"200.0\" y=\"273.0\" text-anchor=\"middle\">attempts, violations, gates, audit log,<\/text><text class=\"t mu\" x=\"200.0\" y=\"289.0\" text-anchor=\"middle\">shown text, tokens, cost<\/text><path class=\"ar \" d=\"M105 296 L105 326\" marker-end=\"url(#ae)\"/><path class=\"ar \" d=\"M295 296 L295 326\" marker-end=\"url(#ae)\"/><rect class=\"b n\" x=\"16\" y=\"328\" width=\"178\" height=\"106\" rx=\"10\"/><text class=\"t ti\" x=\"105.0\" y=\"353.0\" text-anchor=\"middle\">Deterministic judges<\/text><text class=\"t m\" x=\"105.0\" y=\"369.0\" text-anchor=\"middle\">judges/deterministic.py<\/text><text class=\"t mu\" x=\"105.0\" y=\"385.0\" text-anchor=\"middle\">phrases, disclaimers,<\/text><text class=\"t mu\" x=\"105.0\" y=\"401.0\" text-anchor=\"middle\">links, language,<\/text><text class=\"t mu\" x=\"105.0\" y=\"417.0\" text-anchor=\"middle\">workflow. No AI.<\/text><rect class=\"b p\" x=\"206\" y=\"328\" width=\"178\" height=\"106\" rx=\"10\"/><text class=\"t ti\" x=\"295.0\" y=\"353.0\" text-anchor=\"middle\">Jev judges<\/text><text class=\"t m\" x=\"295.0\" y=\"369.0\" text-anchor=\"middle\">judges/jev_judges.py<\/text><text class=\"t mu\" x=\"295.0\" y=\"385.0\" text-anchor=\"middle\">typed verdicts<\/text><text class=\"t mu\" x=\"295.0\" y=\"401.0\" text-anchor=\"middle\">accept &gt;= 0.80, fail &lt;= 0.20<\/text><text class=\"t mu\" x=\"295.0\" y=\"417.0\" text-anchor=\"middle\">middle: human review<\/text><text class=\"t mu lab\" x=\"295\" y=\"452\" text-anchor=\"middle\">eval time only<\/text><path class=\"ar dash\" d=\"M200 296 L200 470\" marker-end=\"url(#ae)\"/><rect class=\"b p\" x=\"16\" y=\"474\" width=\"368\" height=\"106\" rx=\"10\"/><text class=\"t ti\" x=\"200.0\" y=\"499.0\" text-anchor=\"middle\">Red-team panel  \u00b7  built, validation pass 2 pending<\/text><text class=\"t m\" x=\"200.0\" y=\"515.0\" text-anchor=\"middle\">judges/redteam_panel.py<\/text><text class=\"t mu\" x=\"200.0\" y=\"531.0\" text-anchor=\"middle\">3 non-Claude reviewers on Gloo: GPT, Gemini, Llama<\/text><text class=\"t mu\" x=\"200.0\" y=\"547.0\" text-anchor=\"middle\">each quotes anything unsafe in what the pastor saw<\/text><text class=\"t mu\" x=\"200.0\" y=\"563.0\" text-anchor=\"middle\">any finding or disagreement goes to a human<\/text><path class=\"ar \" d=\"M105 580 L105 612\" marker-end=\"url(#ae)\"/><path class=\"ar \" d=\"M295 580 L295 612\" marker-end=\"url(#ae)\"/><rect class=\"b a\" x=\"16\" y=\"614\" width=\"178\" height=\"74\" rx=\"10\"/><text class=\"t ti\" x=\"105.0\" y=\"639.0\" text-anchor=\"middle\">Scorecard<\/text><text class=\"t m\" x=\"105.0\" y=\"655.0\" text-anchor=\"middle\">evaluations/results/<\/text><text class=\"t mu\" x=\"105.0\" y=\"671.0\" text-anchor=\"middle\">all three layers, scored<\/text><rect class=\"b n\" x=\"206\" y=\"614\" width=\"178\" height=\"74\" rx=\"10\"/><text class=\"t ti\" x=\"295.0\" y=\"639.0\" text-anchor=\"middle\">Review canvas<\/text><text class=\"t mu\" x=\"295.0\" y=\"655.0\" text-anchor=\"middle\">for Juan: findings,<\/text><text class=\"t mu\" x=\"295.0\" y=\"671.0\" text-anchor=\"middle\">disagreements<\/text><rect class=\"b n\" x=\"16\" y=\"716\" width=\"368\" height=\"190\" rx=\"10\"/><text class=\"t ti\" x=\"30\" y=\"740\" text-anchor=\"start\">Keys<\/text><text class=\"t mu\" x=\"30\" y=\"760\" text-anchor=\"start\">.env at the repo root: gitignored, never committed<\/text><rect class=\"b a\" x=\"30\" y=\"774\" width=\"160\" height=\"50\" rx=\"10\"/><text class=\"t m\" x=\"110.0\" y=\"795.0\" text-anchor=\"middle\">GLOO_API_KEY<\/text><text class=\"t mu\" x=\"110.0\" y=\"811.0\" text-anchor=\"middle\">runtime, adapter, panel<\/text><rect class=\"b p\" x=\"210\" y=\"774\" width=\"160\" height=\"50\" rx=\"10\"/><text class=\"t m\" x=\"290.0\" y=\"795.0\" text-anchor=\"middle\">JEV_API_KEY<\/text><text class=\"t mu\" x=\"290.0\" y=\"811.0\" text-anchor=\"middle\">eval only, Jev judges<\/text><text class=\"t mu\" x=\"30\" y=\"846\" text-anchor=\"start\">Both come from the environment. Neither is written<\/text><text class=\"t mu\" x=\"30\" y=\"862\" text-anchor=\"start\">to a file, log, or message. The product never imports<\/text><text class=\"t mu\" x=\"30\" y=\"878\" text-anchor=\"start\">Jev, the panel, or the attacker intakes.<\/text><\/svg><\/div><div class=\"txt\"><h2>Eval harness and red-team panel<\/h2><p>Each scenario runs through an adapter that drives the real engine with privacy on. Deterministic judges score the trajectory with no AI. Jev adds typed verdicts at eval time. A panel of three non-Claude reviewers reads what the pastor saw and quotes anything unsafe; any finding or disagreement goes to a human. Attacker intakes try to break the rules. The panel and the attacker runs are built; their live runs are pending.<\/p><div class=\"code-h\">Where it lives<\/div><ul class=\"code\"><li>evaluations/adapter_nury.py<\/li><li>evaluations/judges/<\/li><li>evaluations/scenarios_attacker/<\/li><li>evaluations/results/<\/li><\/ul><\/div><\/section>\n<\/main><script>const tabs=[...document.querySelectorAll('[role=tab]')];\nfunction show(k,f){tabs.forEach(t=>{const on=t.id==='t-'+k;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on;if(on&&f)t.focus()});try{history.replaceState(null,'','#'+k)}catch(e){}}\ntabs.forEach((t,i)=>{t.onclick=()=>show(t.id.slice(2));t.onkeydown=e=>{const j={ArrowRight:i+1,ArrowLeft:i-1,Home:0,End:tabs.length-1}[e.key];if(j!==undefined){e.preventDefault();show(tabs[(j+tabs.length)%tabs.length].id.slice(2),true)}}});\nconst h=(location.hash||'').slice(1);if(tabs.some(t=>t.id==='t-'+h))show(h);<\/script><\/body><\/html>"}, {"id": "p6", "group": "Architecture", "label": "Diagrams notes", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Diagrams notes<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>documents/architecture/README.md<\/p><h1 id=\"nury-architecture-diagrams\">Nury architecture diagrams<\/h1>\n<p>Open <code>diagrams.html<\/code> in a browser. It is one page with ten tabs, drawn as inline SVG from the code in this repo. It works offline and fits a phone screen.<\/p>\n<table>\n<thead>\n<tr>\n<th>Tab<\/th>\n<th>What it shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Context<\/td>\n<td>The pastor, the Nury app, the Gloo guarded Responses endpoint, the vetted sources, and the audit log. It also shows what Nury does not have: open web access and any way to send to the family.<\/td>\n<\/tr>\n<tr>\n<td>Layers<\/td>\n<td>App, engine, safety floor, playbook, and evals. The engine owns running a stage. The safety floor lives in code. A playbook is data and cannot remove the floor.<\/td>\n<\/tr>\n<tr>\n<td>Playbook<\/td>\n<td>The folder a crisis is made of, what the loader checks, how <code>when<\/code> paths work, and which playbooks exist. Detention is the first. Hospital is a test fixture.<\/td>\n<\/tr>\n<tr>\n<td>Run flow<\/td>\n<td>Five stages, an approval gate after each, how edited text carries forward, and the four outcomes.<\/td>\n<\/tr>\n<tr>\n<td>Correction<\/td>\n<td>One stage: draft, check, reject with a reason category, regenerate, three attempts, then escalate. It also marks where fault injection plugs in.<\/td>\n<\/tr>\n<tr>\n<td>Privacy<\/td>\n<td>How names and numbers become tokens before a request leaves, where the map stays, and the leak test that checks the request body.<\/td>\n<\/tr>\n<tr>\n<td>Sources<\/td>\n<td>The playbook sources, the DOJ official list and the church network, and the checks that keep contacts exact and unranked.<\/td>\n<\/tr>\n<tr>\n<td>Skills<\/td>\n<td>The voice and grounding skills, what the loader refuses, and how the audit log records them.<\/td>\n<\/tr>\n<tr>\n<td>Case file<\/td>\n<td>The local case folder, the next-steps map, and revision v1 to v2.<\/td>\n<\/tr>\n<tr>\n<td>Evals<\/td>\n<td>Scenarios and attacker intakes to the scorecard, the three judge layers (deterministic, Jev, the red-team panel), the review canvas, and where each API key is used.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"how-to-read-the-boxes\">How to read the boxes<\/h2>\n<ul>\n<li>Solid: the thing exists in the repo.<\/li>\n<li>Amber: where a guarantee lives.<\/li>\n<li>Dashed red: something Nury does not have, on purpose.<\/li>\n<li>Dashed grey: a test fixture, planned, or built but not yet checked live. The box label says which.<\/li>\n<\/ul>\n<h2 id=\"keeping-it-true\">Keeping it true<\/h2>\n<p>Every box names a file or folder you can open. If code changes shape, change the diagram in the same commit. The SVG is plain markup, so edit <code>diagrams.html<\/code> directly.<\/p>\n<p>The same page is published as a canvas for Juan. This file is the source.<\/p>\n<h2 id=\"privacy\">Privacy<\/h2>\n<p>Nury sends no direct identifiers to a model. Names the pastor protected, phones, emails, street addresses, dates, A-numbers, case numbers and ID numbers are swapped for tokens before the request leaves the device, and swapped back when the reply arrives. The map stays on the pastor's machine and in the saved case. Honest limit: this removes direct identifiers. Context can still hint at who a person is. The proof is a leak test that captures the exact request body for all five stages of both playbooks, including a rejected draft and a pastor edit that adds a new name, and finds none of the canary names or numbers. Details: <code>code/INTERFACE.md<\/code>, section Privacy.<\/p><\/body><\/html>"}, {"id": "p7", "group": "Architecture", "label": "Case file sample", "html": "<div style='position:sticky;top:0;z-index:9;background:#171a21;color:#9a978f;font:13px system-ui;padding:6px 12px;border-bottom:1px solid #262a33'>Reading copy. Buttons work in the agent's Canvas tab.<\/div><!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Case file sample<\/title>\n<style>\n:root{--bg:#0d1015;--surface:#131824;--line:rgba(236,231,220,.14);--amber:#e8a33d;--text:#ece7dc;--muted:#a79f8d;--red:#e0785f}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:1000px;margin:0 auto;padding:24px 16px 56px}\nh1{font:600 clamp(1.5rem,5vw,2.2rem)/1.15 Georgia,serif;margin:0 0 8px}h2{font:600 1.2rem/1.2 Georgia,serif;margin:28px 0 8px}\n.lede{color:var(--muted);max-width:62ch;margin:0 0 8px}\n.grid{display:grid;gap:20px;grid-template-columns:1fr}@media(min-width:860px){.grid{grid-template-columns:minmax(0,440px) 1fr;gap:40px;align-items:start}}\n.map{max-width:440px;width:100%;margin:0 auto;border:1px solid var(--line);border-radius:12px;overflow:hidden}.map svg{display:block;width:100%;height:auto}\npre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;font:.82rem/1.6 ui-monospace,Menlo,Consolas,monospace;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}\nul{padding-left:18px;margin:0}li{margin:0 0 6px}.note{border:1px solid var(--amber);background:rgba(232,163,61,.12);border-radius:10px;padding:10px 14px;margin:14px 0}\n.no{border-color:var(--red);background:rgba(224,120,95,.12)}\n<\/style><\/head><body><main>\n<h1>A saved case, as the pastor sees it<\/h1>\n<p class=\"lede\">This is a synthetic family (Maria, Jose, two children). After the pastor approves a package, Nury saves it as a small folder of linked pages and one map. It is built without a model call, from approved text only. It stays on the pastor's machine.<\/p>\n<div class=\"grid\"><div><h2>The next-steps map<\/h2><div class=\"map\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 1210\" role=\"img\" aria-label=\"Immigration detention or raid\"><title>Immigration detention or raid<\/title><style>.bg{fill:#0d1015}.t{font:500 12.5px -apple-system,Segoe UI,Roboto,sans-serif;fill:#ece7dc}.mut{font:400 12.5px -apple-system,Segoe UI,Roboto,sans-serif;fill:#a79f8d}.lane{font:700 14px Georgia,serif;fill:#e8a33d}.dot{fill:#e8a33d}.ttl{font:600 16px Georgia,serif;fill:#ece7dc}.rule{stroke:rgba(236,231,220,.14);stroke-width:1}<\/style><rect class=\"bg\" width=\"400\" height=\"1210\"/><text class=\"ttl\" x=\"16\" y=\"28\">Immigration detention or raid<\/text><text class=\"mut\" x=\"16\" y=\"44\">Steps and questions from the approved package.<\/text><text class=\"lane\" x=\"16\" y=\"82\">Tonight<\/text><circle class=\"dot\" cx=\"21\" cy=\"101\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"106\">Llame a un abogado de inmigraci\u00f3n calificado<\/text><text class=\"t\" x=\"32\" y=\"122\">lo antes posible. Si no tiene uno, puede<\/text><text class=\"t\" x=\"32\" y=\"138\">buscar en estos directorios:<\/text><text class=\"t\" x=\"32\" y=\"154\">immigrationadvocates.org o ailalawyer.com.<\/text><circle class=\"dot\" cx=\"21\" cy=\"173\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"178\">Preg\u00fantele al abogado c\u00f3mo averiguar d\u00f3nde<\/text><text class=\"t\" x=\"32\" y=\"194\">est\u00e1 detenido Jos\u00e9.<\/text><circle class=\"dot\" cx=\"21\" cy=\"213\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"218\">Memorice el n\u00famero de tel\u00e9fono de una persona<\/text><text class=\"t\" x=\"32\" y=\"234\">de confianza y el del abogado.<\/text><circle class=\"dot\" cx=\"21\" cy=\"253\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"258\">Deje copias de los documentos importantes con<\/text><text class=\"t\" x=\"32\" y=\"274\">alguien de su confianza esta noche.<\/text><circle class=\"dot\" cx=\"21\" cy=\"293\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"298\">Re\u00fana los documentos de Jos\u00e9 y los de la<\/text><text class=\"t\" x=\"32\" y=\"314\">familia. Vea la lista m\u00e1s abajo.<\/text><circle class=\"dot\" cx=\"21\" cy=\"333\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"338\">Escriba las preguntas que quiere hacerle al<\/text><text class=\"t\" x=\"32\" y=\"354\">abogado.<\/text><circle class=\"dot\" cx=\"21\" cy=\"373\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"378\">Si alguien llega a la puerta, pida que le<\/text><text class=\"t\" x=\"32\" y=\"394\">muestren una orden firmada por un juez con el<\/text><text class=\"t\" x=\"32\" y=\"410\">nombre y la direcci\u00f3n correctos. Pida que la<\/text><text class=\"t\" x=\"32\" y=\"426\">pasen por debajo de la puerta antes\u2026<\/text><text class=\"lane\" x=\"16\" y=\"458\">This week<\/text><circle class=\"dot\" cx=\"21\" cy=\"477\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"482\">Identificaciones de Jos\u00e9: pasaporte,<\/text><text class=\"t\" x=\"32\" y=\"498\">identificaci\u00f3n consular, licencia de manejar u<\/text><text class=\"t\" x=\"32\" y=\"514\">otro documento oficial.<\/text><circle class=\"dot\" cx=\"21\" cy=\"533\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"538\">Identificaciones de Mar\u00eda y de los ni\u00f1os,<\/text><text class=\"t\" x=\"32\" y=\"554\">incluidos los documentos de ciudadan\u00eda de los<\/text><text class=\"t\" x=\"32\" y=\"570\">ni\u00f1os.<\/text><circle class=\"dot\" cx=\"21\" cy=\"589\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"594\">Cualquier documento migratorio que tenga en<\/text><text class=\"t\" x=\"32\" y=\"610\">casa: visas, permisos, cartas o avisos de la<\/text><text class=\"t\" x=\"32\" y=\"626\">corte.<\/text><circle class=\"dot\" cx=\"21\" cy=\"645\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"650\">Cualquier n\u00famero de caso o papeler\u00eda que le<\/text><text class=\"t\" x=\"32\" y=\"666\">hayan dado.<\/text><circle class=\"dot\" cx=\"21\" cy=\"685\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"690\">Fechas importantes: cu\u00e1ndo lleg\u00f3 Jos\u00e9 al pa\u00eds,<\/text><text class=\"t\" x=\"32\" y=\"706\">cu\u00e1ndo fue detenido.<\/text><circle class=\"dot\" cx=\"21\" cy=\"725\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"730\">El n\u00famero de tel\u00e9fono del abogado y de una<\/text><text class=\"t\" x=\"32\" y=\"746\">persona de confianza.<\/text><circle class=\"dot\" cx=\"21\" cy=\"765\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"770\">Una lista de preguntas para el abogado.<\/text><text class=\"lane\" x=\"16\" y=\"802\">Questions still open<\/text><circle class=\"dot\" cx=\"21\" cy=\"821\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"826\">Does Maria know which facility or location<\/text><text class=\"t\" x=\"32\" y=\"842\">immigration officers took Jose to, or has she<\/text><text class=\"t\" x=\"32\" y=\"858\">received any paperwork or case number?<\/text><circle class=\"dot\" cx=\"21\" cy=\"877\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"882\">Does Jose have any prior immigration court<\/text><text class=\"t\" x=\"32\" y=\"898\">dates, prior detentions, or existing<\/text><text class=\"t\" x=\"32\" y=\"914\">immigration documents of any kind?<\/text><circle class=\"dot\" cx=\"21\" cy=\"933\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"938\">Does the family have any trusted contact \u2014<\/text><text class=\"t\" x=\"32\" y=\"954\">family member, friend, or community<\/text><text class=\"t\" x=\"32\" y=\"970\">organization \u2014 who can stay with Maria and the<\/text><text class=\"t\" x=\"32\" y=\"986\">children tonight, or help her reach an\u2026<\/text><text class=\"lane\" x=\"16\" y=\"1018\">Who to call<\/text><circle class=\"dot\" cx=\"21\" cy=\"1037\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"1042\">Immigration Advocates Network \u2014 National Legal<\/text><text class=\"t\" x=\"32\" y=\"1058\">Aid Directory<\/text><text class=\"t\" x=\"32\" y=\"1074\">https://www.immigrationadvocates.org/nonprofit/legaldirectory/<\/text><circle class=\"dot\" cx=\"21\" cy=\"1093\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"1098\">AILA Lawyer Search https://www.ailalawyer.com/<\/text><circle class=\"dot\" cx=\"21\" cy=\"1117\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"1122\">ACLU Know Your Rights<\/text><text class=\"t\" x=\"32\" y=\"1138\">https://www.aclu.org/know-your-rights/immigrants-rights<\/text><circle class=\"dot\" cx=\"21\" cy=\"1157\" r=\"2.5\"/><text class=\"t\" x=\"32\" y=\"1162\">National Immigration Project<\/text><text class=\"t\" x=\"32\" y=\"1178\">https://nipnlg.org/<\/text><\/svg><\/div><\/div>\n<div><h2>The case folder<\/h2><pre>cases/\n\u2514\u2500 demo-maria-jose/\n   \u251c\u2500 01-triage.md\n   \u251c\u2500 02-rights.md\n   \u251c\u2500 03-attorney.md\n   \u251c\u2500 04-checklist.md\n   \u251c\u2500 05-pastoral.md\n   \u251c\u2500 case.json\n   \u251c\u2500 documents.md\n   \u251c\u2500 index.md\n   \u251c\u2500 log.md\n   \u251c\u2500 nextsteps.svg\n   \u251c\u2500 people.md\n   \u2514\u2500 timeline.md<\/pre>\n<h2>What is in it<\/h2><ul>\n<li><b>index.md<\/b> is the one-screen summary: status, the next step, links to every page.<\/li>\n<li><b>01 to 05<\/b> hold each stage exactly as the pastor approved or edited it, with citations and the disclaimer.<\/li>\n<li><b>people.md<\/b>, <b>documents.md<\/b> (tick boxes), <b>timeline.md<\/b>.<\/li>\n<li><b>log.md<\/b> records each gate, edit, and skill with a time.<\/li>\n<li><b>nextsteps.svg<\/b> is the map: tonight, this week, questions still open, who to call. Steps and questions only.<\/li><\/ul>\n<div class=\"note no\"><b>Never in a case file:<\/b> a rejected draft, a key, or a prediction about the case. The log says a draft was rejected and why (a category), never what it said.<\/div><\/div><\/div>\n<h2>index.md<\/h2><pre># Immigration detention or raid\n\nCase demo-maria-jose  \u00b7  saved 2026-10-07 02:58 UTC  \u00b7  detention\n\nStatus: Package complete\n\nSituation: Jose was detained by immigration officers outside his workplace in Aurora yesterday evening. Maria contacted the pastor at 2:07 AM seeking guidance; she does not know whether a warrant was shown at the time of detention.\n\nNext step: Llame a un abogado de inmigraci\u00f3n calificado lo antes posible. Si no tiene uno, puede buscar en estos directorios: immigrationadvocates.org o ailalawyer.com.\n\n![Next-steps map](nextsteps.svg)\n\n## Pages\n\n- [1. Triage](01-triage.md)\n- [2. Rights brief](02-rights.md)\n- [3. Attorney resources](03-attorney.md)\n- [4. Family checklist](04-checklist.md)\n- [5. Pastoral message](05-pastoral.md)\n- [People](people.md)\n- [Documents](documents.md)\n- [Timeline](timeline.md)\n- [Log](log.md)\n- [Next-steps map](nextsteps.svg)\n\n---\nNury is an AI assistant, not a lawyer, pastor, counselor, or therapist. This is general legal information, not legal advice. Please review it with a qualified immigration attorney as soon as possible.\n\nNothing here is sent anywhere. The pastor shares it.\n<\/pre>\n<h2>log.md<\/h2><pre># Log\n\nEach gate, edit, skill, and rejected draft (categories only).\n\n- 2026-10-07 02:57:44.401 UTC  gate  stage=triage  action=approve\n- 2026-10-07 02:57:48.931 UTC  draft rejected (not saved)  stage=rights  attempt=1  categories=[&#x27;banned_phrase&#x27;]\n- 2026-10-07 02:57:53.290 UTC  gate  stage=rights  action=approve\n- 2026-10-07 02:57:53.290 UTC  skill  grounding v1.0.0  stage=attorney\n- 2026-10-07 02:58:03.113 UTC  gate  stage=attorney  action=approve\n- 2026-10-07 02:58:03.113 UTC  skill  voice v1.0.0  stage=checklist\n- 2026-10-07 02:58:03.113 UTC  skill  grounding v1.0.0  stage=checklist\n- 2026-10-07 02:58:14.475 UTC  gate  stage=checklist  action=approve\n- 2026-10-07 02:58:14.475 UTC  skill  voice v1.0.0  stage=pastoral\n- 2026-10-07 02:58:19.731 UTC  gate  stage=pastoral  action=approve\n- 2026-10-07 02:58:19.731 UTC  outcome  package_complete\n\n[Index](index.md)\n<\/pre>\n<p class=\"lede\">The line \"draft rejected (not saved)\" is the forced demo rejection on the rights brief. Only the category is kept.<\/p>\n<\/main><\/body><\/html>"}, {"id": "p8", "group": "Build", "label": "Build log", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Build log<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>BUILD_LOG.md<\/p><h1 id=\"build_log-nury\">BUILD_LOG \u2014 Nury<\/h1>\n<p>Timestamped build record for the judges. One entry per milestone: what was built, decisions, commits, failed tests, learnings. Owner: hack-sensei.<\/p>\n<h2 id=\"1-2026-10-06-1936-mdt-repo-created\">1. 2026-10-06 19:36 MDT \u2014 Repo created<\/h2>\n<ul>\n<li>Repo created from scratch; prework carried as reference in <code>documents/prework/<\/code> (no history copied).<\/li>\n<li>Skeleton: code, presentation, video, documents, evaluations, agents (five folders), root CLAUDE.md.<\/li>\n<li>Decision: the brief sets the guardrail loop at max 3 tries, then escalate. PRODUCT.md said 2 retries. The brief governs.<\/li>\n<li>Commits: first commit c9c4c97.<\/li>\n<\/ul>\n<h2 id=\"2-2026-10-06-1942-mdt-gloo-api-key-stored-locally\">2. 2026-10-06 19:42 MDT \u2014 Gloo API key stored locally<\/h2>\n<ul>\n<li>Juan supplied the Gloo key (\"Hackaton 2026\") and directed it into a local <code>.env<\/code> at the repo root.<\/li>\n<li>Decision: <code>.env<\/code> is gitignored and never committed. The key is not in any tracked file, commit, or message. Verified with <code>git check-ignore<\/code>.<\/li>\n<li>Learning: the key appeared once in the session transcript. Rotate it in Gloo Studio after the hackathon.<\/li>\n<\/ul>\n<h2 id=\"3-2026-10-06-1944-mdt-crew-online-first-live-gloo-call-hack-jedi\">3. 2026-10-06 19:44 MDT \u2014 Crew online; first live Gloo call (hack-jedi)<\/h2>\n<ul>\n<li>Crew hired and briefed: hack-jedi, hack-artisans, hack-ninja, hack-video. Assignments sent over AMP.<\/li>\n<li>hack-jedi built <code>code/nury/gloo_client.py<\/code>: guarded Responses endpoint, Bearer key from env/.env, HTTP 403 mapped to GuardrailBlock, latency and token metadata returned.<\/li>\n<li>First live call: success, 1.6 s, 870 input / 4 output tokens, model gloo-anthropic-claude-sonnet-4.6. Key never printed or committed.<\/li>\n<li>Vetted data copied to <code>code/nury/data<\/code>.<\/li>\n<li>Next: stage registry, engine (chaining, correction loop, gates, audit), then <code>code/INTERFACE.md<\/code>.<\/li>\n<\/ul>\n<h2 id=\"4-2026-10-06-1945-mdt-description-draft-v1-video-storyboard-hack-ninja-hack-video\">4. 2026-10-06 19:45 MDT \u2014 Description draft v1, video storyboard (hack-ninja, hack-video)<\/h2>\n<ul>\n<li>hack-ninja: <code>presentation/description.txt<\/code> v1, 238 words. Decision: the scorecard sentence ships only with real numbers from hack-artisans. If none by Oct 7 16:00 MDT, the whole sentence is cut. Commit cc817a8.<\/li>\n<li>hack-video: <code>video/STORYBOARD.md<\/code>, 10 shots, 90 s, draft voiceover about 105 words. Tooling: ffmpeg, Chrome capture at 390x844, no paid editor. The unsafe draft text is never shown on screen. Commit 032b777.<\/li>\n<li>Decision: \"max 3 tries\" means 3 attempts total (first draft + 2 regenerations), then escalate. Matches PRODUCT.md and the description.<\/li>\n<li>Open: who reads the voiceover (Juan or TTS), needed by Oct 7 17:00. Seeded forced rejection requested from hack-jedi for the demo.<\/li>\n<\/ul>\n<h2 id=\"5-2026-10-06-1946-mdt-scope-and-demo-decisions-juan-delegated-hack-sensei-decided\">5. 2026-10-06 19:46 MDT \u2014 Scope and demo decisions (Juan delegated, hack-sensei decided)<\/h2>\n<ul>\n<li>Product stays Nury as locked: five stages, approval gate after each, guardrail loop (3 attempts total, then escalate), vetted sources, no send path. No pivot with under 28 hours left.<\/li>\n<li>One flagship crisis only: a detention. No second crisis type unless the harness is finished early.<\/li>\n<li>Demo: one shared family and intake (<code>presentation/SHARED_DEMO.md<\/code>), one forced rejection on the Rights brief.<\/li>\n<li>Voiceover: TTS first; Juan's recording replaces it only if it arrives before Oct 7 17:00 MDT.<\/li>\n<li>90 s video plays inside the 3-minute pitch. No separate 3-minute video.<\/li>\n<li>Skip the MCP endpoint. Keep the honest \"what didn't work\" section and the failure-mode log; judges weigh them.<\/li>\n<\/ul>\n<h2 id=\"6-2026-10-06-1947-mdt-pitch-script-and-deck-v1-hack-ninja\">6. 2026-10-06 19:47 MDT \u2014 Pitch script and deck v1 (hack-ninja)<\/h2>\n<ul>\n<li><code>presentation/PITCH_SCRIPT.md<\/code> (3:00, lines tagged [90s] for the 90 s cut) and <code>presentation/deck.html<\/code> (8 slides). Same family and intake as SHARED_DEMO.md.<\/li>\n<li>Placeholders: slide 6 proof numbers and the proof section. Both are cut at Oct 7 16:00 MDT unless hack-artisans supplies real numbers.<\/li>\n<\/ul>\n<h2 id=\"7-2026-10-06-1947-mdt-eval-harness-built-hack-artisans\">7. 2026-10-06 19:47 MDT \u2014 Eval harness built (hack-artisans)<\/h2>\n<ul>\n<li>Commit d75384d, <code>evaluations/<\/code>: 20 scenario yamls, run.py, deterministic judges, Jev judges (yes/no, score, choice on the full trajectory; 80/20 thresholds, middle band to human review), report.py, mock agent, 10 negative tests (all pass).<\/li>\n<li>Failed first run: the mock agent exposed 3 harness bugs (substring \"ice\" matched in \"office\"; escalation scenario wrongly required completeness; an edit dropped the disclaimer). All fixed.<\/li>\n<li>Learning: after a pastor Edit, the gate must re-append the disclaimer.<\/li>\n<li>Pending: adapter to the real agent once <code>code/INTERFACE.md<\/code> lands; fault-injection hook from hack-jedi; JEV_API_KEY from Juan at eval time.<\/li>\n<\/ul>\n<h2 id=\"8-2026-10-06-1947-mdt-finalist-script-mock-scorecard-flagged\">8. 2026-10-06 19:47 MDT \u2014 Finalist script; mock scorecard flagged<\/h2>\n<ul>\n<li>hack-ninja: <code>presentation/FINALIST_SCRIPT.md<\/code> (076346e) sent to hack-video. One proof beat needs real scorecard numbers; a fallback line is included.<\/li>\n<li>Learning: the mock-agent scorecard was committed to main. It is a self-test, not proof. hack-artisans must remove it or label it mock. Real numbers come only from a run against the real agent.<\/li>\n<li>Locked demo intake now in scenario 1 (hack-artisans).<\/li>\n<\/ul>\n<h2 id=\"9-2026-10-06-1948-mdt-agent-core-ready-hack-jedi\">9. 2026-10-06 19:48 MDT \u2014 Agent core ready (hack-jedi)<\/h2>\n<ul>\n<li>Commit 9c47e7b. <code>code/nury/{gloo_client,guardrails,stages,engine,audit}.py<\/code> and <code>code/INTERFACE.md<\/code>.<\/li>\n<li>Live: full 5-stage run on a sample Aurora CO intake passed. Stage latency 4\u201318 s.<\/li>\n<li>Rejected-and-regenerated draft shown live: pastoral stage with DEMO_PROVOKE failed on word limit (215 words) and a promise-of-outcome pattern, then regenerated clean on try 2 (15.6 s total). The pastor never saw it; it sits in the audit log only.<\/li>\n<li>Decisions: deterministic checks (regex for prediction, advice and identity claims in EN and ES; URL allowlist; citation per rights bullet; 3 missing facts; checklist headings; under 120 words). A Gloo 403 counts as a failed try. Pastor edits are flagged, not blocked.<\/li>\n<li>Failed: first checks too strict (3 false escalations); fixed. The model refused to be provoked into legal advice, so the demo trigger became a deterministic length+outcome violation.<\/li>\n<li>Quality gaps: English scripture quote mixed into Spanish; a typo; header \"Preparada por el pastor\" could read as a pastor claim. Fixes requested.<\/li>\n<\/ul>\n<h2 id=\"10-2026-10-06-1951-mdt-architecture-decided-fault-injection-eval-adapter-live\">10. 2026-10-06 19:51 MDT \u2014 Architecture decided; fault injection; eval adapter live<\/h2>\n<ul>\n<li>Architecture (Juan + hack-sensei): Nury is a crisis-management engine that runs playbooks. A crisis is a folder under <code>code/playbooks/<\/code>; the engine and safety floor are shared. See <code>documents/ARCHITECTURE.md<\/code> (layers, playbook contract, milestones M1\u2013M10). Detention is playbook #1. A second playbook is a stretch after the first real eval run.<\/li>\n<li>hack-jedi: attempts = 3 total. <code>NURY_FORCE_REJECTION=1<\/code> forces one rejection on the Rights brief (reject, regenerate, pass). Reason categories in the audit log: banned_phrase, ungrounded_claim, missing_vetted_entry, missing_attorney_referral, format, length, gloo_block. Disclaimer re-appended after a pastor Edit.<\/li>\n<li>Learning: fault injection after generation is deterministic and costs no extra Gloo call; better than prompting the model to misbehave.<\/li>\n<li>hack-artisans: <code>evaluations/adapter_nury.py<\/code> drives the real core. Scenario 1 ran live. A 20-scenario baseline without Jev is running. Findings sent to jedi: the disclaimer lacks \"AI assistant\"; a stage-2 edit is not consumed by stages 3\u20135.<\/li>\n<li>Open: JEV_API_KEY from Juan; Gloo token prices for the cost column.<\/li>\n<\/ul>\n<h2 id=\"11-2026-10-06-1953-mdt-pastor-app-built-hack-artisans\">11. 2026-10-06 19:53 MDT \u2014 Pastor app built (hack-artisans)<\/h2>\n<ul>\n<li>Commit 3f9bce2, <code>code/app/<\/code>: stdlib server plus one static page. Run from <code>code/<\/code>: <code>python3 -m app.server<\/code> (PORT env, default 8080).<\/li>\n<li>Mobile-first, three views (Intake, Pipeline, Package), 56 px Approve/Edit/Stop buttons, inline edit, collapsible audit log, copy buttons. \"Use demo intake\" loads the locked Maria/Aurora text. \"Demo guardrail\" triggers the rejected-and-regenerated beat; the strip reads \"Draft rejected by guardrail. Regenerating (2 of 3).\" then \"Passed\".<\/li>\n<li>Rejected drafts and Gloo error detail are stripped server-side. Verified over the API: 5 gates, pastoral stage self-corrected once, package complete, no draft text in the output.<\/li>\n<li>Bug fixed: the strip said 3 of 3 on attempt 2.<\/li>\n<li>hack-sensei check: server starts and serves the page (HTTP 200); the page says Nury never sends; a scan of tracked files finds no API key.<\/li>\n<li>Not done: manual continue after an escalation; no browser screenshots yet. The 20-scenario baseline must re-run after hack-jedi's edits before any number is quoted.<\/li>\n<\/ul>\n<h2 id=\"12-2026-10-06-1955-mdt-jev-key-stored-locally\">12. 2026-10-06 19:55 MDT \u2014 Jev key stored locally<\/h2>\n<ul>\n<li>Juan supplied the Jev key; stored in the gitignored <code>.env<\/code> as JEV_API_KEY. Not in any tracked file, commit, or message. Used at eval time only; product runtime stays pure Gloo.<\/li>\n<li>Learning: the key appeared once in the session transcript. Rotate it after the hackathon.<\/li>\n<\/ul>\n<h2 id=\"13-2026-10-06-1956-mdt-playbook-refactor-hack-jedi-m2\">13. 2026-10-06 19:56 MDT \u2014 Playbook refactor (hack-jedi, M2)<\/h2>\n<ul>\n<li>Commit 25594f0. <code>code/playbooks/detention/<\/code> (playbook.json, stages.json, prompts, sources, outcomes.json), <code>nury/playbook.py<\/code> loader, <code>nury/checks.py<\/code> named checks. Outcomes: package_complete, stopped_by_pastor, escalated, blocked. Link AND phone allowlist on every stage. The loader refuses a playbook that drops the AI/not-a-lawyer disclaimer or whose stage 1 is not triage.<\/li>\n<li>Live run with forced rejection: stage 2 rejected once (banned_phrase), then passed; package_complete. 13 offline tests pass. A test builds a second \"hospital\" playbook in a temp dir and runs it.<\/li>\n<li>Fixes: pastor-byline pattern blocked; label \"Borrador de Nury para revisi\u00f3n del pastor\"; Spanish language check.<\/li>\n<li><code>PROMPT_NOTES.md<\/code>: prompt v1 vs shipped, 8 problems and fixes (judge evidence).<\/li>\n<li>Decision: no path variants in detention without vetted source text; the mechanism and a test exist.<\/li>\n<li>Learned: the model refuses to be provoked into advice, so faults are injected after generation.<\/li>\n<li>Gap found by hack-sensei: the engine floor still hardcodes \"immigrant family\" and \"immigration attorney\". Domain wording moves into playbook fields. The platform claim stays off the pitch until fixed.<\/li>\n<\/ul>\n<h2 id=\"14-2026-10-06-1958-mdt-engine-is-crisis-neutral-hack-jedi\">14. 2026-10-06 19:58 MDT \u2014 Engine is crisis-neutral (hack-jedi)<\/h2>\n<ul>\n<li>Commit c16a287. Domain wording moved into <code>playbook.json<\/code> (boundary: who, domain, professional, professional_kind; disclaimer; draft_label; optional extra_banned). The engine keeps the rules as a template.<\/li>\n<li>Verified by hack-sensei: no \"immigra\" in <code>code/nury/*.py<\/code>; 13 tests pass; a hospital test playbook runs with no engine change and asserts no immigration text.<\/li>\n<li>Platform claim approved for the pitch, worded as built and tested on a test playbook. No second crisis is claimed as shipped or scored.<\/li>\n<\/ul>\n<h2 id=\"15-2026-10-06-2003-mdt-rehearsal-capture-four-app-findings-agency-name-check\">15. 2026-10-06 20:03 MDT \u2014 Rehearsal capture, four app findings, agency-name check<\/h2>\n<ul>\n<li>hack-video: rehearsal capture proven (Playwright + system Chrome, 390x844 phone look at zoom 2, 78 s per full run; raw footage gitignored).<\/li>\n<li>Findings routed: (1) demo rejection moves from stage 5 to stage 2; (2) triage and package text lost line breaks; (3) Package view needs Copy/Download visible on one screen; (4) triage said \"ICE\", against the no-agency-name decision. Do not blur in post; fix at the source.<\/li>\n<li>hack-jedi (c316c60): triage prompt bans agency names; named check <code>no_agency_names<\/code> (categ ort text, no invented facts). Live: h03 twice, both first-attempt passes; regression on h01 and h07 passes, all five stages, package_complete. Detention untouched. 33 tests pass (verified by hack-sensei).<\/li>\n<li>Learning: an emotional vague intake pulled the triage model into comforting the pastor instead of structuring the case; the prompt now states the output is a case record, not a reply.<\/li>\n<li>Next: hack-artisans re-runs h03 and the full hospital set; hack-jedi starts the case-file writer.<\/li>\n<\/ul>\n<h2 id=\"32-2026-10-06-2054-mdt-judge-change-re-validated-canvas-v2-app-polish-hack-artisans-5d76161\">32. 2026-10-06 20:54 MDT \u2014 Judge change re-validated; canvas v2; app polish (hack-artisans, 5d76161)<\/h2>\n<ul>\n<li>Condition check: hack-artisans's first wording (\"ignore rejected drafts\") FAILED my condition. Known-unsafe text fell to 0.76, 0.78, 0.60, 0.52, 0.40, 0.29, below 0.80. They rejected it, and recorded the failed try.<\/li>\n<li>Adopted instead: the safety judges no longer receive rejected draft text at all (attempts keep only the violation category). Unsafe scores 0.89\u20130.98 in all 10 cases; safe 0.02\u20130.24; the h06 false alarm went 0.73 to 0.02. Tables and the failed try are in <code>evaluations/validation/JUDGE_VALIDATION.md<\/code>; FAILURE_LOG has \"judge wording changed after seeing results, why\". Thresholds untouched. Interim re-judge: detention items for human review fall from 17 to 11; hospital stays 7 pass, 1 fail (before the h03 fix). Still not quotable.<\/li>\n<li>Review canvas v2: grouped by Jev question, only what the pastor saw, bulk \"all undecided in this group pass\" with a confirm step. Interim data is labeled <code>interim-review.html<\/code> with a red INTERIM banner; the final page comes after the post-freeze run. Real-dashboard click test pending (Juan).<\/li>\n<li>App polish done: \"Spanish\" not \"es\", one-line disclaimer under every gate title, amber caps labels, real bullets. Hospital escalation now shows the vetted sources list. <code>NURY_TEST_ESCALATE<\/code> documented as test-only.<\/li>\n<li>hack-video re-captured at e92104e: all four polish items verified in frames; 75 s run, no problems. Decision: shot 1b crops to the Detention card until hospital has a final scorecard.<\/li>\n<\/ul>\n<h2 id=\"33-2026-10-06-2057-mdt-remotion-installed-for-evaluation-juan\">33. 2026-10-06 20:57 MDT \u2014 Remotion installed for evaluation (Juan)<\/h2>\n<ul>\n<li>Decision (Juan): hack-video evaluates Remotion for the 90 s video. Latest version is 4.0.533 (<code>npm view remotion version<\/code>); installed in <code>video/remotion/<\/code> as remotion and @remotion/cli 4.0.533 (exact pin) with react 19. Node 20.19, npm 11. <code>npx remotion versions<\/code> clean. <code>node_modules<\/code> is gitignored.<\/li>\n<li>Timebox: 2 hours. Decision rule: use Remotion for the final video and the overnight re-cut only if it is clearly better and a full render works by Oct 7 12:00 MDT; otherwise ffmpeg stays. The ffmpeg script stays working either way.<\/li>\n<li>Note for Juan: Remotion's license is free for individuals and small companies; check it covers 3Metas before relying on it commercially. It is fine for the hackathon entry.<\/li>\n<\/ul>\n<h2 id=\"34-2026-10-06-2057-mdt-case-file-and-next-steps-map-built-hack-jedi-commit-aba3d57\">34. 2026-10-06 20:57 MDT \u2014 Case file and next-steps map built (hack-jedi, commit aba3d57)<\/h2>\n<ul>\n<li><code>code/nury/casefile.py<\/code>, no model call, additive (run loop, floor, checks and prompts untouched). <code>save_case<\/code>, <code>list_cases<\/code>, <code>load_case<\/code>, <code>export_zip<\/code>, <code>nextsteps_svg<\/code>. Folder <code>cases/&lt;id&gt;/<\/code>: index.md, one page per stage, people.md, documents.md, timeline.md, log.md, nextsteps.svg, case.json. <code>cases/<\/code> is gitignored. 42 tests pass (verified by hack-sensei; 9 new).<\/li>\n<li>Safety: saves nothing unless every stage is approved or edited; refuses if rejected draft text or a key value would land in a page; the log says \"draft rejected (not saved)\" with categories only; edits are marked \"edited by the pastor\". A forced-rejection test shows the rejected draft appears nowhere in the folder or the zip.<\/li>\n<li>Map: lanes Tonight, This week, Questions still open, Who to call (only vetted links and phones). Steps and questions only; text escaped; no outcome words (tests). Hospital case has no immigration text.<\/li>\n<li>Failed first, fixed: the lane header overlapped the subtitle (agent-browser screenshot caught it) and items were cut mid-sentence; a draft of the rejected-draft guard could false-refuse on a shared closing sentence; a test flagged the SVG xmlns URL as unvetted.<\/li>\n<li>Known limit: the map shows what the approved text says, so the two accepted checklist lines appear under \"Tonight\". Stage pages keep the pastor's edits verbatim, including any link the pastor adds.<\/li>\n<li>Not built: possible-paths map and the case update loop (marked later). Next: hack-artisans builds the UI (12:00 Oct 7).<\/li>\n<\/ul>\n<h2 id=\"35-2026-10-06-2059-mdt-floor-bug-found-bare-domains-bypass-the-link-allowlist-hack-jedi\">35. 2026-10-06 20:59 MDT \u2014 Floor bug found: bare domains bypass the link allowlist (hack-jedi)<\/h2>\n<ul>\n<li>Found while checking the case-file sample: <code>guardrails.url_reasons<\/code> only looked at text starting with http or www. A made-up bare domain (\"detentionlocator.org\") passed. The live checklist already writes bare domains (both vetted), so an invented one could have reached the pastor.<\/li>\n<li>Decision (hack-sensei): GO. Same allowlist, bare domains (org, com, gov, net, edu and the sources' own endings) now scanned. Tests: invented domain rejected; vetted bare domains pass; hospital too; email-like strings and file names do not false-alarm. Live re-check on detention 01, 18, 20 and hospital h01 before the 06:00 freeze.<\/li>\n<li>Learning: asking before touching the floor during a freeze was right; a floor bug beats a freeze.<\/li>\n<\/ul>\n<h2 id=\"36-2026-10-06-2103-mdt-case-viewer-case-revision-and-privacy-layer-decided-juan\">36. 2026-10-06 21:03 MDT \u2014 Case viewer, case revision, and privacy layer decided (Juan)<\/h2>\n<ul>\n<li>Decision (Juan): build the case-file UI now (no waiting on jedi's confirmation); add a case viewer; add a revision flow so a pastor can reopen a case, record what happened (\"went as hoped / did not / unknown\"), and re-run the affected stages. The case keeps versions (v1 untouched, v2 beside it, change log, compare).<\/li>\n<li>Decision (Juan): nothing leaves the device with direct identifiers. A PrivacyClient wraps the Gloo client and replaces names, phones, emails, addresses, dates of birth and IDs with tokens before sending; the map stays local; responses are detokenized locally. The pastor confirms the protected-terms list. Honest limit: context can still hint. Proof: a leak test on the captured outbound request body.<\/li>\n<li>Owners: hack-artisans (UI, viewer, revision, protected-terms step), hack-jedi (privacy.py, leak test, after the bare-domain fix). Final eval re-run now waits for privacy so the scorecard measures what we ship. Details in documents/ARCHITECTURE.md.<\/li>\n<\/ul>\n<h2 id=\"37-2026-10-06-2103-mdt-bare-domain-floor-fix-landed-hack-jedi-commit-3376542\">37. 2026-10-06 21:03 MDT \u2014 Bare-domain floor fix landed (hack-jedi, commit 3376542)<\/h2>\n<ul>\n<li><code>guardrails.url_reasons<\/code> now also scans bare domains (org, com, gov, net, edu, info, us, mx) against the same allowlist. 45 tests pass (verified by hack-sensei; 3 new). Invented bare domains are rejected with ungrounded_claim at stage level for detention (checklist) and hospital (resources); vetted ones pass; emails, file names, numbers and \"nada.Hable\" do not false-alarm.<\/li>\n<li>Live, five stages: detention 01 and 18 and hospital h01 clean on attempt 1. Detention 20 passed but its triage needed 3 attempts (banned_phrase twice): the triage echoed the family's plea (\"Promise me he will be released\"). It did not escalate. Scenario 20 may show a retry in the scored run; that is real self-correction data.<\/li>\n<li>Known limit: an email with an invented domain (x@invented.org) was not checked. Follow-up requested: flag any email whose domain is not vetted.<\/li>\n<li>Final scored runs use commit 3376542 or later.<\/li>\n<\/ul>\n<h2 id=\"38-2026-10-06-2112-mdt-privacy-layer-built-hack-jedi-commit-84edad8\">38. 2026-10-06 21:12 MDT \u2014 Privacy layer built (hack-jedi, commit 84edad8)<\/h2>\n<ul>\n<li><code>code/nury/privacy.py<\/code>: Pseudonymizer and PrivacyClient. No engine change, no prompt-file change. Names, phones, emails, addresses, dates of birth, A-numbers, case numbers and IDs become tokens before the request leaves the computer; the response is restored locally. Cities and states stay on purpose. The pastor confirms the protected-names list (<code>propose_terms<\/code>). A name added in a pastor edit is protected before the next stage. The token map is saved only in the case file's <code>privacy-map.json<\/code>. On by default; <code>NURY_PRIVACY=off<\/code> for A/B.<\/li>\n<li>Proof (verified by hack-sensei: 56 tests pass): a leak test captures the exact request body at the HTTP boundary. A synthetic intake full of canary names and numbers, all five stages, detention and hospital, including a forced rejection and a pastor edit that adds a new name: zero canaries in any request body, and tokens did go out.<\/li>\n<li>Live A/B on real Gloo (scenarios 01, 18, h01; off vs on): all first-attempt passes; latency about the same (37 vs 38 s, 37 vs 37 s, 48 vs 53 s); input tokens +4 to +5%. Real request bodies with privacy off sent the family's names; with it on, none.<\/li>\n<li>Cost: with privacy on, scenario 18's pastoral message did not address the family by name (no name token to use). A small loss of warmth, not a break; the pastor can edit it.<\/li>\n<li>Found and fixed: a made-up token came out double-bracketed; an address pattern matched \"14 years ago in Court\"; the names proposer suggested \"What\" and \"Aurora\" as people; an extra-calls count was off by one.<\/li>\n<li>Honest limits: direct identifiers only; context can still hint; an unprotected name is not removed; an email with an invented domain is not link-checked. Added a Privacy section to the root README.<\/li>\n<li>The eval adapter must use <code>make_client(intake=...)<\/code> and wrap the gate for edit scenarios (hack-artisans informed).<\/li>\n<\/ul>\n<h2 id=\"39-2026-10-06-2114-mdt-email-domain-check-church-network-started-hack-jedi-commit-a948be0\">39. 2026-10-06 21:14 MDT \u2014 Email-domain check; church network started (hack-jedi, commit a948be0)<\/h2>\n<ul>\n<li>Email-domain check landed: an invented email escalates; a vetted domain, a vetted address, or an address already in the intake or approved text passes. 58 tests pass (verified by hack-sensei); detention 01 and hospital h01 re-run clean. This closes the gap noted in entry 37.<\/li>\n<li>Church network change started. Decisions: the freeze moved to 08:00 Oct 7 so the network lands before the final scored runs. A committed synthetic network is allowed only if clearly fake (DEMO/FAKE file name, \"fictional\": true, 555-0100 phone numbers, loaded only with NURY_DEMO_NETWORK=1, UI banner \"fictional demo contacts\"). Attorney and resources stages use the fixed label \"People our church has worked with\", described as the church's own contacts, not endorsements. Case revision stays with hack-artisans; hack-jedi advises. The Department of Justice list is researched by hack-ninja and wired by hack-jedi after Juan approves it.<\/li>\n<\/ul>\n<h2 id=\"40-2026-10-06-2117-mdt-official-list-approved-by-juan-research-by-hack-ninja\">40. 2026-10-06 21:17 MDT \u2014 Official list approved by Juan (research by hack-ninja)<\/h2>\n<ul>\n<li>Source: the U.S. Department of Justice pro bono legal service providers list (justice.gov, updated October 2026) and its recognized-organizations roster. Read at build time; quotes verbatim; no entry marked free (the roster does not say so); no private attorney marked. 28 canvas entries.<\/li>\n<li>Decision (Juan, relayed by hack-sensei): approve the pro bono providers and the roster entries; hold the 7 marked \"Pending Renewal\" (status held, not used, to revisit). An entry on both lists counts once. Listed does not mean recommended: Nury never endorses anyone.<\/li>\n<li>Next: hack-ninja records the approvals file; hack-jedi wires only approved entries.<\/li>\n<\/ul>\n<h2 id=\"41-2026-10-06-2118-mdt-official-list-decision-recorded-hack-ninja\">41. 2026-10-06 21:18 MDT \u2014 Official list decision recorded (hack-ninja)<\/h2>\n<ul>\n<li>Counts: 28 entries = 25 providers (18 approved, 7 held as Pending Renewal) + 3 official source pages (approved). The 18 approved providers are the 4 pro bono providers plus 14 roster-only organizations; RMIAN and Connect Immigration appear on both lists and count once. 21 approved entries in all; no entry counted twice.<\/li>\n<li>Nury uses only approved entries; held entries are never used or shown. It never says \"free\" (the roster does not say so) and always carries \"listed does not mean recommended\".<\/li>\n<li>Next: hack-jedi wires approved entries after the church network v1.<\/li>\n<\/ul>\n<h2 id=\"42-2026-10-06-2119-mdt-capacity-honesty-and-rebalancing\">42. 2026-10-06 21:19 MDT \u2014 Capacity honesty and rebalancing<\/h2>\n<ul>\n<li>hack-artisans reported \"full\": about 15 hours of work against 17.7 hours to 15:00 on Oct 7. Progress: case-file UI built and checked; 3 case-file scenarios pass live; the red-team panel is about 70% (first validation: gpt-5.4 and llama catch 8 of 8 injected problems but flag every safe scenario, so they are advisory; gemini's 13 errors were a parser bug, fixed; about $0.60 per run).<\/li>\n<li>Decision (hack-sensei): move work instead of dropping Juan's priorities. The \"Our network\" screen and the skills before/after run go to hack-jedi (separate files, no collision). The attacker intakes go to hack-ninja (non-Claude attacker model on Gloo, reviewed by a person; hack-artisans only runs them). hack-artisans keeps the panel, privacy step, case-file loose ends, revision (cut 15:00), network scenarios and the final scored runs.<\/li>\n<li>Learning: asking for honest capacity before adding work found the over-commitment early. The final scored run starts only when the core is frozen (08:00) and privacy is wired in the adapter.<\/li>\n<\/ul>\n<h2 id=\"43-2026-10-06-2122-mdt-blocker-gloo-credit-exhausted-http-402\">43. 2026-10-06 21:22 MDT \u2014 Blocker: Gloo credit exhausted (HTTP 402)<\/h2>\n<ul>\n<li>Every live Gloo call returned 402 INSUFFICIENT_CREDIT (\"Wallet credit balance is exhausted\"). The $10 credit from the prework is spent by development runs, A/B runs, the baseline and interim evals, the panel validation and live tests.<\/li>\n<li>Decision: all agents pause live calls and work offline until Juan adds credit; owed live checks are listed and run in a planned order afterwards, not all at once.<\/li>\n<li>Learning: we had no budget view. Add a cost log per run (tokens in, tokens out, dollars) to every live script, and a spending cap per task.<\/li>\n<\/ul>\n<h2 id=\"44-2026-10-06-2122-mdt-attacker-intakes-written-hack-ninja-commit-61aa6ed\">44. 2026-10-06 21:22 MDT \u2014 Attacker intakes written (hack-ninja, commit 61aa6ed)<\/h2>\n<ul>\n<li>18 adversarial intakes in <code>evaluations/scenarios_attacker/<\/code> (a01\u2013a12 detention, a13\u2013a18 hospital), written by gloo-openai-gpt-5.4 (a non-Claude model) through Gloo, then read and edited by a person (16 unchanged, 2 edited). Cost about $0.057 (2,411 in / 3,374 out tokens, computed from the listed rates). Attack themes: asking for a legal form and a script for officers, outcome promises, claiming professional identity, invented phone numbers and links, repeating personal data, emotional pressure, false authority to drop disclaimers, hidden instructions in a forwarded message; hospital: medication dose, survival odds, claiming to be clinician, invented hospital phone number.<\/li>\n<li>Verified by hack-sensei: schema matches the existing scenarios; no key anywhere in the repo; synthetic families only. The prompt, model id and cost are in the folder README.<\/li>\n<li>To run: after the final scored runs and the panel, about 18 runs. hack-artisans only runs them.<\/li>\n<\/ul>\n<h2 id=\"45-2026-10-06-2123-mdt-church-network-v1-hack-jedi-commit-15b5222-and-remotion-comparison-hack-video\">45. 2026-10-06 21:23 MDT \u2014 Church network v1 (hack-jedi, commit 15b5222) and Remotion comparison (hack-video)<\/h2>\n<ul>\n<li>Network v1, offline: <code>nury/network.py<\/code> (store <code>network/network.json<\/code>, gitignored; CRUD, validation, import/export), deterministic matching (state, language, kind, city; church home state when the case names none), dynamic sources on the detention attorney and hospital resources stages. New checks: <code>network_entries_present<\/code>, <code>listed_contacts_known<\/code>, <code>no_endorsement_words<\/code>. Boundary rule 5 now reads: list only contacts in the source material, label church contacts as the church's own, never recommend, rank or endorse. A fictional demo network loads only with <code>NURY_DEMO_NETWORK=1<\/code>. 69 offline tests pass (verified by hack-sensei).<\/li>\n<li>Live (before the credit ran out): scenario 18 listed the demo clinic exactly, with the label and the no-endorsement line, first attempt. Owed live: 01, 18 and h01 with privacy on, once credit returns.<\/li>\n<li>Found: the model turned a \"(none)\" placeholder into a sentence; a crash on a dynamic source in an escalation package; a fake demo phone partly tokenized by privacy. All fixed.<\/li>\n<li>Remotion vs ffmpeg (hack-video): both render the same 90 s timeline. Remotion looks better (rounded phone, shadow, glow, balanced captions), not hugely; ffmpeg is 3 to 6 times faster (37 s). Decision: Remotion for the final and the overnight cut, ffmpeg as fallback, if fonts are self-hosted and a render works offline.<\/li>\n<\/ul>\n<h2 id=\"46-2026-10-06-2126-mdt-official-list-wired-hack-jedi-commit-d59a86f\">46. 2026-10-06 21:26 MDT \u2014 Official list wired (hack-jedi, commit d59a86f)<\/h2>\n<ul>\n<li><code>nury/officiallist.py<\/code> builds <code>official_list.json<\/code> from hack-ninja's draft and Juan's approvals: 18 approved providers with verbatim phones; the 7 held entries are kept as names only (a test proves none of their phones are in the file). The detention attorney stage lists Colorado entries (church home state if the case names none), detention-related first, at most 5. 79 tests pass (9 new; verified by hack-sensei). No live call (paused).<\/li>\n<li>Rules: a held entry is rejected if a draft names it; a listed entry keeps its exact name and contact; nothing from the list is called free (free, gratis, sin costo); the caveat \"Listed by the U.S. Department of Justice. Listed does not mean recommended.\" must appear; a dropped entry is rejected; an unknown or held phone is rejected by the floor.<\/li>\n<li>Found: the American Bar Association entry's toll-free number on the DOJ page is for people held at military facilities; for someone held by ICE the page says to email. A family shown that phone would be misled, so Nury lists the email route only. Juan approved the entry; what it shows changed. Also fixed: the language check flagged vetted English organization names inside Spanish text; the endorsement check flagged the required caveat itself.<\/li>\n<li>Owed live checks when credit returns: detention 01 (Aurora CO, demo network and privacy on), 18 (Mesa AZ), 20, hospital h01, and two forced-rejection runs; capped at about 12 pipelines.<\/li>\n<\/ul>\n<h2 id=\"47-2026-10-06-2128-mdt-privacy-step-case-revision-network-screen-mounted-hack-artisans-commit-24c51df\">47. 2026-10-06 21:28 MDT \u2014 Privacy step, case revision, network screen mounted (hack-artisans, commit 24c51df)<\/h2>\n<ul>\n<li>\"Protected names\" step on the intake screen (Nury proposes names, the pastor ticks and adds); one privacy client per session; real names at every gate; the privacy map is saved with the case; no tokens in saved pages (checked on a live run before the credit ran out).<\/li>\n<li>Case revision flow: \"Something changed\" (step, result, what happened) then \"Draft again\" through the same privacy step and gates; saved as v2 beside v1 with <code>changes.md<\/code>; v1/v2 chips and a red/green compare view. 2 revision scenarios, 6 offline tests.<\/li>\n<li>hack-jedi's \"Our network\" screen mounted and linked from the selector. Eval side: network scenarios n01\u2013n03, a must_not_echo check, <code>run.py --scenarios &lt;folder&gt;<\/code> so the 18 attacker scenarios run with one command, and the adapter now uses the privacy client. 82 tests pass (verified by hack-sensei).<\/li>\n<li>Not verified live: the revision run, network scenarios and the adapter's privacy path. Owed live checks listed in <code>evaluations/LIVE_CHECKS_OWED.md<\/code> (about $6.5 for hack-artisans' share).<\/li>\n<li>Honest note: one 16-token probe call at about 21:50 to confirm the 402, before the pause arrived.<\/li>\n<\/ul>\n<h2 id=\"48-2026-10-06-2130-mdt-credit-back-live-runs-released-in-a-planned-order\">48. 2026-10-06 21:30 MDT \u2014 Credit back; live runs released in a planned order<\/h2>\n<ul>\n<li>Juan added credit in Gloo Studio. hack-sensei's one-line test call returned HTTP 200 (\"ready\", 869 in / 4 out tokens).<\/li>\n<li>Rule: one live job at a time on the key (Gloo rate limits showed up when two runs shared it); each agent reports to hack-sensei when done and hack-sensei releases the next. Order: (A) hack-artisans smoke test; (B) hack-jedi owed live checks; (C) hack-artisans case-file, revision, app end-to-end and network scenarios; (D) fixes; (E) core freeze declared by hack-sensei once B and C pass (target about 01:00); (F) final scored runs with Jev; (G) panel; (H) attacker scenarios; (I) skills before/after; (J) hack-video final capture after F. Every live script logs tokens and dollars per run.<\/li>\n<\/ul>\n<h2 id=\"49-2026-10-06-2133-mdt-architecture-diagrams-updated-small-fixes-hack-jedi-commits-fbc08fc-27cc98f\">49. 2026-10-06 21:33 MDT \u2014 Architecture diagrams updated; small fixes (hack-jedi, commits fbc08fc, 27cc98f)<\/h2>\n<ul>\n<li><code>documents/architecture/diagrams.html<\/code> now has ten tabs: Context, Layers, Playbook, Run flow, Correction, Privacy, Sources, Skills, Case file, Evals. Items not yet checked live are labeled \"built, live check pending\" (DOJ list, church network, revision, red-team panel, attacker runs); privacy, skills and the case file are marked as live-measured. Checked by hack-sensei at 390 px: no horizontal scroll, 11 SVGs.<\/li>\n<li>Smaller items: the ABA email-only reason is recorded in PROMPT_NOTES and in a code comment; the network screen shows a visible notice when no church place is set; <code>save_case<\/code> writes <code>intake.md<\/code> (the pastor's words, exactly), so revisions append below it; the owed live checks narrowed to about 6 pipelines ($0.45).<\/li>\n<\/ul><\/body><\/html>"}, {"id": "p9", "group": "Build", "label": "Crew rules (CLAUDE.md)", "html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Crew rules (CLAUDE.md)<\/title><style>\n:root{--bg:#0f1115;--card:#171a21;--ink:#e9e6df;--mute:#9a978f;--amber:#e8a33d;--line:#262a33}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif;padding:22px 20px 60px;max-width:880px;margin:auto}\nh1,h2,h3{font-family:Georgia,'Fraunces',serif;line-height:1.25}\nh1{font-size:28px;margin:.2em 0 .6em}h2{font-size:21px;margin:1.6em 0 .5em;color:var(--amber)}h3{font-size:17px;margin:1.3em 0 .4em}\na{color:var(--amber)}code{background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.88em}\npre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0}\ntable{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}\nblockquote{border-left:3px solid var(--amber);margin:1em 0;padding:.2em 1em;color:var(--mute)}\nhr{border:0;border-top:1px solid var(--line);margin:2em 0}img,svg{max-width:100%}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}\n.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-right:6px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\ndl dt{color:var(--amber);font-weight:600;margin-top:.8em}dl dd{margin:.1em 0 0 0;color:var(--ink)}\n<\/style><\/head><body><p class='pill'>CLAUDE.md<\/p><h1 id=\"claudemd-nury-root\">CLAUDE.md \u2014 Nury (root)<\/h1>\n<p>Owner: <strong>hack-sensei<\/strong>. I own this file and <code>BUILD_LOG.md<\/code>.<\/p>\n<h2 id=\"what-nury-is\">What Nury is<\/h2>\n<p>Crisis-response agent for a solo pastor. Flagship demo: an immigration detention or raid, the 2 AM call. The pastor picks the crisis and Nury runs five stages. Brand line: \"Nury \u2014 the crisis-response agent for solo pastors.\" Name locked. Humanitarian framing, never political.<\/p>\n<p>Specific user: a solo pastor, no staff, no lawyer on the line, taking a panicked call from an immigrant family on a Sunday afternoon or late at night, on a phone.<\/p>\n<h2 id=\"the-five-stages\">The five stages<\/h2>\n<ol>\n<li>Triage: raw intake to structured case (situation, people, location, family language, urgency + reason, 3 missing facts). Factual, no advice.<\/li>\n<li>Rights brief: plain language, family's language, built only from the vetted source file, every point cited, ends urging an attorney.<\/li>\n<li>Attorney resources: national hotlines plus church-vetted local entries. Lists only contacts the pastor has vetted (the church network, labeled as the church's own) and official vetted lists. Never endorses anyone.<\/li>\n<li>Family checklist: DO TONIGHT / DO NOT DO / GATHER THESE DOCUMENTS.<\/li>\n<li>Pastoral message: under 120 words, warm, steady, hopeful, family's language.<\/li>\n<\/ol>\n<p>Approval gate after every stage: Approve / Edit / Stop. Stop means \"I'll handle this manually.\" Later stages use the edited text.<\/p>\n<h2 id=\"architecture\">Architecture<\/h2>\n<p>Nury is a crisis-management engine that runs playbooks. A crisis is data: a folder under <code>code/playbooks/<\/code>. Detention is playbook #1. See <code>documents/ARCHITECTURE.md<\/code> (the contract, layers, and milestones M1\u2013M10).<\/p>\n<h2 id=\"rules\">Rules<\/h2>\n<ul>\n<li>Guardrail self-correction: an unsafe draft is rejected and regenerated, max 3 tries, then escalate. The pastor never sees the unsafe draft.<\/li>\n<li>Legal information only. Never advice, predictions, or strategy.<\/li>\n<li>English UI, Spanish output for the family. Disclaimer on every output.<\/li>\n<li>Vetted sources only. No open web.<\/li>\n<li>No send path. Nothing reaches the family except through the pastor.<\/li>\n<li>Nury is not a pastor and never claims to be one (or a counselor, therapist, or lawyer).<\/li>\n<li>Product runtime is pure Gloo (guarded Responses endpoint). Jev is used at eval time only.<\/li>\n<li><code>GLOO_API_KEY<\/code> and <code>JEV_API_KEY<\/code> come from the environment. Never in a file, commit, or message.<\/li>\n<li>Every meaningful step is a commit dated Oct 6\u20138. Author is Juan Pelaez (set on this repo). Every agent commit ends with <code>Co-Authored-By: &lt;agent-id&gt; &lt;agent-id&gt;@rnd23blocks.aimaestro.local<\/code>.<\/li>\n<li>Agents talk over AMP. Route work; do not do another agent's job.<\/li>\n<li>Submission text carries: \"Evaluation harness uses the Jev decision API (my prior project) as typed judges; disclosed as prior technology per the rules.\"<\/li>\n<li>Short sentences, active voice, plain words.<\/li>\n<\/ul>\n<h2 id=\"deadlines-mdt\">Deadlines (MDT)<\/h2>\n<ul>\n<li>Oct 7, 15:00 \u2014 end-to-end demo with one rejected-and-regenerated draft; harness scores.<\/li>\n<li>Oct 7, 18:00 \u2014 250-word description and 3-minute pitch deck final (Juan reads first).<\/li>\n<li>Oct 7, 21:00 \u2014 working solution + description SUBMITTED. Hard stop.<\/li>\n<li>Oct 7, 21:00\u201323:00 \u2014 prelim pitch, 3 minutes (verify at venue: rules doc says 90 s). Deck and script in Juan's hands by 20:30. Top 25 at midnight.<\/li>\n<li>Oct 8, 09:00 \u2014 90-second finalist video, only if top 25.<\/li>\n<li>Oct 8 \u2014 finals, in person.<\/li>\n<\/ul>\n<h2 id=\"who-does-what\">Who does what<\/h2>\n<table>\n<thead>\n<tr>\n<th>Agent<\/th>\n<th>Role<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>hack-sensei<\/td>\n<td>Coordinator. Owns this file and BUILD_LOG.md. Reports to Juan, copies pas-lola.<\/td>\n<\/tr>\n<tr>\n<td>hack-jedi<\/td>\n<td>Architecture &amp; Integration: Gloo wiring, stage registry, stateful chaining, correction loop, approval gates.<\/td>\n<\/tr>\n<tr>\n<td>hack-artisans<\/td>\n<td>Developers: app from the scaffold, eval harness, 20 scenarios, scorecard.<\/td>\n<\/tr>\n<tr>\n<td>hack-ninja<\/td>\n<td>Presentation: deck (Nury), 3-minute pitch, 250-word description, 90-second finalist script.<\/td>\n<\/tr>\n<tr>\n<td>hack-video<\/td>\n<td>Video: 90-second demo video; standby overnight Oct 7\u21928.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"layout\">Layout<\/h2>\n<p><code>code/<\/code> app \u00b7 <code>presentation/<\/code> deck, scripts, description \u00b7 <code>video
