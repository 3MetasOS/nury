<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"><rect width="640" height="360" fill="#e9e2d2"/><g transform="translate(180.0 72.0) scale(0.625)"><g fill="#b8680f" stroke="#b8680f"><path fill="none" stroke-width="4.2" stroke-linejoin="round" d="M21 25.4 H43 L40.8 50 H23.2 Z"/><path fill="none" stroke-width="4.2" stroke-linecap="round" d="M16.6 25.4 H47.4 M18.6 53.8 H45.4"/><circle cx="32" cy="12.2" r="4.6" fill="none" stroke-width="2.8"/><path fill="none" stroke-width="2.8" d="M32 16.8 V22"/><path stroke="none" d="M32 31.4 C35.8 35.6 37.4 38.4 37.4 41.2 A5.4 5.4 0 0 1 26.6 41.2 C26.6 38.4 28.2 35.6 32 31.4 Z"/></g></g><text x="230" y="110" font-family="Georgia,serif" font-size="54" fill="#0d1015" text-anchor="start" font-weight="600">Nury</text><text x="230" y="138" font-family="Arial,sans-serif" font-size="16" fill="#8d887c" text-anchor="start" font-weight="400" font-style="italic">/NOO-ree/  proper noun</text><text x="230" y="170" font-family="Arial,sans-serif" font-size="18" fill="#0d1015" text-anchor="start" font-weight="400">1. A given name from Arabic nūr, “light”.</text><text x="230" y="196" font-family="Arial,sans-serif" font-size="18" fill="#0d1015" text-anchor="start" font-weight="400">2. The crisis-response agent for solo pastors.</text><text x="230" y="226" font-family="Arial,sans-serif" font-size="14" fill="#8d887c" text-anchor="start" font-weight="400" font-style="italic">see also: lantern</text><rect x="12" y="304" width="153.39999999999998" height="26" rx="13" fill="#000" opacity=".55"/><text x="26" y="322" font-family="Arial,sans-serif" font-size="14" fill="#ece7dc" text-anchor="start" font-weight="400">Eric: “This is Nury.”</text><text x="12" y="348" font-family="Georgia,serif" font-size="13" fill="#6f6a5f">0:15</text></svg>