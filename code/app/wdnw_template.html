<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nury-theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>@@TITLE@@, Nury</title>
<meta name="description" content="@@DESC@@">
<link rel="stylesheet" href="/shell.css">
<style>
/* Generated by code/app/build_docs.py (build_wdnw) from documents/product/WHAT_DID_NOT_WORK.md. Page rules only; the shell owns the header, footer and tokens. */
main{max-width:1120px;margin:0 auto;padding:16px 16px 24px}
@media(min-width:960px){main{padding:24px 24px 24px}}
h1{font:600 clamp(1.6rem,6vw,2rem)/1.15 var(--serif);margin:0;color:var(--text)}
a{color:var(--amber-text)}a:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.band{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:12px;display:grid;gap:8px;background:var(--surface)}
.band .hnote{margin-top:8px;width:auto;max-width:100%}.band .hnote .hn-t{white-space:normal}
@media(min-width:960px){.band{padding:24px 28px}}
.filters{position:sticky;top:var(--hh,76px);z-index:10;background:var(--bg);padding:8px 0;margin:0 0 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
.fchip{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:600 14px var(--sans);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber-text)}
@media(max-width:480px){.filters{gap:6px}.fchip{padding:0 12px}}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:960px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0;scroll-margin-top:calc(var(--hh,76px) + 72px)}
.item:target{border-color:var(--amber-line)}
.item[hidden]{display:none}
.ihead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.badge{width:34px;height:34px;border-radius:50%;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-text);display:grid;place-items:center;font:700 15px var(--sans);font-variant-numeric:tabular-nums;grid-row:1}
.item h2{font:500 20px/1.3 var(--serif);margin:0;grid-column:2;color:var(--text)}
.take{grid-column:2;margin:0;font-weight:700;line-height:1.45;color:var(--text)}
.body{display:grid;gap:10px;font-variant-numeric:tabular-nums}
.clip .rows{display:grid;gap:10px;max-height:calc(4.8em + 4px);overflow:hidden;position:relative}
.clip .rows::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.8em;background:linear-gradient(transparent,var(--surface))}
.row{display:grid;gap:2px;line-height:1.6;font-size:15.5px}
.lab{font:600 11.5px var(--mono,ui-monospace,monospace);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row p{margin:0}
.row.nk{border-left:3px solid var(--amber);background:var(--amber-soft);border-radius:0 10px 10px 0;padding:10px 12px}
.row.nk .lab{color:var(--amber-text)}
.more{justify-self:start;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:transparent;color:var(--amber-text);font:600 14px var(--sans);cursor:pointer}
code{font:.9em ui-monospace,monospace;background:var(--surface-2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.closing{margin:20px 0 0;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);max-width:none}
.closing h2{font:500 1.25rem/1.3 var(--serif);margin:0 0 6px}.closing p{margin:0 0 8px;line-height:1.6}
.empty{color:var(--muted);padding:12px 0}
@media print{.filters,.more{display:none!important}.clip .rows{max-height:none}.clip .rows::after{display:none}}
</style>
</head>
<body data-nav="how">
<script src="/shell.js"></script>
<main id="main">
<div class="band"><h1 id="h-wdnw" tabindex="-1" data-note="what we tried that failed, and what we do not know yet" data-arrow="up" data-rot="-1.2">What did not work</h1></div>
<div class="filters" role="group" aria-label="Show">@@CHIPS@@</div>
<p class="empty" id="f-status" role="status" aria-live="polite" hidden></p>
<div class="grid" id="items">
@@ITEMS@@
</div>
@@CLOSING@@
</main>
<script>
(function(){
var hh=function(){var t=document.querySelector(".top");if(t)document.documentElement.style.setProperty("--hh",t.getBoundingClientRect().height+"px")};hh();addEventListener("resize",hh);addEventListener("load",hh);
var items=[].slice.call(document.querySelectorAll(".item")),chips=[].slice.call(document.querySelectorAll(".fchip")),st=document.getElementById("f-status");
chips.forEach(function(c){c.onclick=function(){chips.forEach(function(x){x.setAttribute("aria-pressed",x===c?"true":"false")});var g=c.dataset.g,n=0;items.forEach(function(it){var show=g==="all"||it.dataset.g===g;it.hidden=!show;if(show)n++});
  st.hidden=n>0;st.textContent=n?"":"Nothing here.";}});
/* long items fold to about three lines; the Not known row stays visible */
items.forEach(function(it){var rows=it.querySelector(".rows"),b=it.querySelector(".more");if(!rows||!b)return;
  it.classList.add("clip");var long=rows.scrollHeight>rows.clientHeight+6;if(!long){it.classList.remove("clip");b.hidden=true;return}
  b.hidden=false;b.onclick=function(){var open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",open?"false":"true");b.textContent=open?"Read more":"Read less";it.classList.toggle("clip",open)}});
function openHash(){var id=location.hash.slice(1);if(!id)return;var it=document.getElementById(id);if(!it||!it.classList.contains("item"))return;
  chips[0].click();var b=it.querySelector(".more");if(b&&!b.hidden&&b.getAttribute("aria-expanded")!=="true")b.click();it.scrollIntoView()}
addEventListener("hashchange",openHash);setTimeout(openHash,60);
})();
</script>
</body>
</html>
