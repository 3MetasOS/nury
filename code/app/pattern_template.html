<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nury-theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>@@TITLE@@, Nury</title>
<meta name="description" content="@@DESC@@">
<link rel="stylesheet" href="/shell.css">
<style>
/* Generated by code/app/build_docs.py (build_pattern) from documents/product/PATTERN.md. Page rules only; the shell owns the header, footer and tokens. */
main{max-width:1120px;margin:0 auto;padding:16px 16px 24px}
@media(min-width:960px){main{padding:24px 24px 24px}}
h1{font:600 clamp(1.6rem,6vw,2rem)/1.15 var(--serif);margin:0;color:var(--text)}
h2{font:500 clamp(1.4rem,4.5vw,1.7rem)/1.25 var(--serif);margin:40px 0 12px;scroll-margin-top:90px}
a{color:var(--amber-text)}a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.band{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;display:grid;gap:8px;background:var(--surface)}
.band .hnote{margin-top:8px;width:auto;max-width:100%}.band .hnote .hn-t{white-space:normal}
.band p{margin:0;color:var(--muted);max-width:68ch;line-height:1.55}
@media(min-width:960px){.band{padding:24px 28px}}
.pull{margin:0;padding:22px 24px;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:16px;background:var(--surface);font:400 clamp(1.2rem,4.2vw,1.5rem)/1.5 var(--serif);color:var(--text)}
.pull p{margin:0}.pull+.after{margin:12px 0 0}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px 18px}
.col h3{font:600 12px var(--mono,ui-monospace,monospace);letter-spacing:.08em;text-transform:uppercase;color:var(--amber-text);margin:0 0 8px}
.col ul{margin:0;padding-left:20px;display:grid;gap:8px;line-height:1.55}.col p{margin:0;line-height:1.6}
.col.no{background:var(--surface-2)}
.seq{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.seq li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.seq li.sa{display:none}
.seq a.stn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:var(--text);padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:44px;line-height:1.35;font:600 14px/1.35 var(--sans)}
.seq a.stn:hover{border-color:var(--amber-line);background:var(--amber-soft)}
.seq .nd{width:44px;height:44px;border-radius:50%;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-text);display:grid;place-items:center;font:700 16px var(--sans);font-variant-numeric:tabular-nums}
@media(min-width:960px){
 .seq{grid-template-columns:repeat(9,auto);justify-content:space-between;align-items:stretch}
 .seq li.sa{display:grid;align-items:center;color:var(--muted)}
 .seq li:not(.sa){grid-template-columns:1fr}.seq a.stn{grid-template-columns:1fr;justify-items:center;text-align:center;align-content:start;gap:8px;padding:12px 10px;height:100%}
}
.arr{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cards{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.cards.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px;display:grid;gap:10px;align-content:start;min-width:0;scroll-margin-top:90px}
.card:target{border-color:var(--amber-line)}
.card .head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.badge{width:34px;height:34px;border-radius:50%;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-text);display:grid;place-items:center;font:700 15px var(--sans);font-variant-numeric:tabular-nums}
.card h3{font:500 20px/1.3 var(--serif);margin:0;color:var(--text)}
.card p{margin:0;line-height:1.6;font-size:15.5px}
.files{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted);line-height:1.6}
.files .lab,.tag{font:600 11.5px var(--mono,ui-monospace,monospace);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
code.chip{font:13px ui-monospace,monospace;background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:99px;color:var(--text);overflow-wrap:anywhere}
code{font:.9em ui-monospace,monospace;background:var(--surface-2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.list{margin:0;padding-left:20px;display:grid;gap:10px;line-height:1.6;max-width:80ch}
.card.nope{border-left:3px solid var(--amber);background:var(--amber-soft);border-radius:0 16px 16px 0}
.card.nope b{display:block;font:600 1.02rem/1.35 var(--sans);color:var(--text)}
.card.idea{background:var(--surface-2);border-style:dashed}
.tag{color:var(--amber-text)}
.muted{color:var(--muted)}.after{margin:16px 0 0;line-height:1.6;max-width:80ch}
@media print{.seq a.stn{border-color:#bbb}}
</style>
</head>
<body data-nav="how">
<script src="/shell.js"></script>
<main id="main">
<div class="band"><h1 id="h-pattern" tabindex="-1" data-note="the part you can reuse" data-arrow="up" data-rot="-1.2">The pattern</h1>@@INTRO@@</div>
@@BODY@@
</main>
</body>
</html>
