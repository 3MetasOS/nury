<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nury-theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>@@TITLE@@, Nury</title>
<meta name="description" content="@@DESC@@">
<link rel="stylesheet" href="/shell.css">
<style>
/* Generated by code/app/build_docs.py from documents/product/STANDARDS_PAGE.md. Page rules only; the shell owns the header, tabs and tokens. */
main{max-width:1120px;margin:0 auto;padding:16px 16px 24px}
.doc{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.hero-doc{padding:8px 0 4px}.hero-doc h1{font:600 clamp(1.8rem,7vw,2.6rem)/1.12 var(--serif);margin:0 0 8px;color:var(--amber-text)}
.hero-doc p{margin:0 0 10px;max-width:68ch;color:var(--muted)}
.toc{border:1px solid var(--line);border-radius:14px;background:var(--surface);align-self:start}
.toc summary{cursor:pointer;min-height:48px;display:flex;align-items:center;padding:0 16px;font:600 16px var(--sans)}
.toc ol{list-style:none;margin:0;padding:0 8px 12px}
.toc a{display:block;padding:10px 12px;border-radius:10px;color:var(--text);text-decoration:none;min-height:44px;line-height:1.35}
.toc a:hover{background:var(--amber-soft)}.toc a[aria-current="true"]{background:var(--amber-soft);color:var(--amber-text);font-weight:600}
article{min-width:0;font-size:17px;line-height:1.65}
article h2{font:500 clamp(1.5rem,5vw,1.9rem)/1.2 var(--serif);margin:40px 0 12px;padding-top:8px;border-top:1px solid var(--line)}
article h3{font:500 1.3rem/1.3 var(--serif);margin:28px 0 8px}
article h4{font:600 1.05rem/1.4 var(--sans);margin:18px 0 4px}
article h5{font:600 .98rem/1.4 var(--sans);margin:14px 0 2px;color:var(--amber-text)}
.tw table{min-width:560px}
article p,article li{max-width:72ch;overflow-wrap:anywhere}article ul,article ol{padding-left:1.3em}article li{margin:4px 0}
article a{color:var(--amber-text)}
article h2:target,article h3:target{scroll-margin-top:84px}
.anc{margin-left:8px;opacity:0;text-decoration:none;font-size:.8em}h2:hover .anc,h3:hover .anc,.anc:focus{opacity:1}
code{font:500 .88em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
pre{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;font-size:.82rem;line-height:1.5;max-width:100%}pre code{background:none;padding:0;overflow-wrap:normal}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.95rem;line-height:1.5}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{background:var(--surface-2);font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}
td:first-child code{white-space:nowrap}
.st{display:inline-block;font:600 .72rem/1 var(--sans);letter-spacing:.04em;padding:4px 8px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface-2);white-space:nowrap;vertical-align:.1em}
.st-built-live{color:var(--green);border-color:var(--green)}.st-built-off{color:var(--green);border-style:dashed;border-color:var(--green)}
.st-inprog{color:var(--amber-text);border-color:var(--amber-line)}.st-planned{color:var(--muted)}.st-notbuilt{color:var(--red);border-color:var(--red)}
.pipe{list-style:none;margin:14px 0;padding:0;display:grid;gap:0;counter-reset:s;max-width:720px}
.pipe li{position:relative;display:grid;gap:2px;padding:12px 14px 12px 52px;border:1px solid var(--line);background:var(--surface);margin:0 0 -1px;max-width:none}
.pipe li:first-child{border-radius:12px 12px 0 0}.pipe li:last-child{border-radius:0 0 12px 12px}
.pipe li::before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--amber-line);color:var(--amber-text);display:grid;place-items:center;font:600 13px var(--sans)}
.pipe li b{font:600 1rem var(--sans)}.pipe li span{color:var(--muted);font-size:.95rem}
.astext{margin:10px 0}.astext summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--amber-text);font-weight:600}
.consent{margin:0 0 6px}
.live{margin:14px 0}.live .ldg{color:var(--muted);font-size:.95rem}
.pbk{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:12px 0}
.pbk>summary{cursor:pointer;min-height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;font:500 1.15rem var(--serif)}
.pbk .in{padding:0 16px 16px}
.stg{border-top:1px solid var(--line);padding:12px 0}.stg h4{margin:0 0 2px}.stg p{margin:4px 0;color:var(--muted);font-size:.95rem}
.stg .kv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0;padding:0;list-style:none}.stg .kv li{margin:0;max-width:none}
.stg .kv a,.stg .kv span{display:inline-block;font:500 .82rem ui-monospace,Menlo,monospace;padding:3px 8px;border-radius:8px;border:1px solid var(--line-2);color:var(--text);text-decoration:none;background:var(--surface-2)}
.stg .kv .lab{border:0;background:none;color:var(--muted);font:600 .8rem var(--sans)}
.rt tr:target td{background:var(--amber-soft)}
.disclose{margin-top:36px}
@media(min-width:960px){
  main{padding:24px 24px 24px}
  .doc{grid-template-columns:260px minmax(0,1fr);gap:40px}
  .toc{position:sticky;top:84px;max-height:calc(100vh - 108px);overflow:auto}
  .toc summary{pointer-events:none}
  .hero-doc{grid-column:1/-1}
}
@media print{
  .top,.tabs,.toc,.anc,.skip{display:none!important}
  :root,:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface-2:#f3f3f3;--text:#000;--muted:#333;--line:#bbb;--line-2:#999;--amber-text:#000;--green:#000;--red:#000}
  body{background:#fff;color:#000}.doc{display:block}article{font-size:11pt}pre,.tw{overflow:visible;break-inside:avoid}h2,h3{break-after:avoid}details>*{display:block!important}
}
.fig{margin:20px 0}.fig figcaption{color:var(--muted);font-size:.9rem;margin-top:6px}
.fdiag{width:100%;max-width:640px;height:auto;display:block}
.fdiag .fbox,.fdiag .fbox2{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}.fdiag .fbox2{stroke-dasharray:0}
.fdiag .ffn{font:600 17px var(--serif);fill:var(--text)}.fdiag .fwh{font:400 13px var(--sans);fill:var(--muted)}
.fdiag .farrow{fill:none;stroke:var(--amber-text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fdiag .fpill{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5}.fdiag .fst{font:600 13px var(--sans);fill:var(--text)}
.fdiag .yes .fpill{stroke:var(--green);fill:transparent}.fdiag .yes .fst{fill:var(--green)}
.fdiag .partly .fpill{stroke:var(--amber-text);fill:transparent}.fdiag .partly .fst{fill:var(--amber-text)}
.fdiag .barely .fpill,.fdiag .no .fpill{stroke:var(--muted);stroke-dasharray:4 3;fill:transparent}.fdiag .barely .fst,.fdiag .no .fst{fill:var(--muted)}
</style>
</head>
<body data-nav="">
<script src="/shell.js"></script>
<main id="main" class="nv">
  <div class="doc">
    <div class="hero-doc">
      <h1 id="top" tabindex="-1">@@TITLE@@</h1>
    </div>
    <details class="toc" id="toc"><summary>Contents</summary><nav aria-label="On this page"><ol>@@TOC@@</ol></nav></details>
    <article id="doc">
@@BODY@@
    </article>
  </div>
</main>
<script>
(()=>{
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const code=t=>el("code",null,t);
async function getJSON(u){try{const r=await fetch(u);if(!r.ok)throw 0;return await r.json()}catch(e){return null}}
function wrapTable(t){const w=el("div","tw");w.tabIndex=0;w.setAttribute("role","region");w.setAttribute("aria-label","Table, scrolls sideways if needed");w.append(t);return w}
async function rules(box){
  const d=await getJSON("/api/rules");
  if(!d){box.replaceChildren(el("p","ldg","The rules list could not be loaded. Check that the server is running."));return}
  const t=el("table","rt"),hd=el("tr"),th=el("thead");["Name","Kind","What it checks","Used by","Where"].forEach(h=>hd.append(el("th",null,h)));th.append(hd);t.append(th);
  const tb=el("tbody");
  d.rules.forEach(r=>{const tr=el("tr");tr.id="rule-"+r.name;
    const a=el("td");a.append(code(r.name));const w=el("td");w.append(code(r.where||""));tr.append(a,el("td",null,{floor:"Safety floor",check:"Named check",classifier:"Jev question"}[r.kind]||r.kind),el("td",null,r.explanation),el("td",null,r.stages.join("; ")),w);tb.append(tr)});
  t.append(tb);
  box.replaceChildren(el("p","ldg",`${d.count_floor} safety-floor rules, ${d.count_named} named checks and ${d.count_jev} Jev questions, read from the app when this page loaded.`),wrapTable(t))}
async function playbooks(box){
  const d=await getJSON("/api/playbooks");
  if(!d||!d.playbooks){box.replaceChildren(el("p","ldg","The playbook list could not be loaded."));return}
  box.replaceChildren(el("p","ldg","Read from the app when this page loaded. Stages, checks and sources are the real files."));
  for(const p of d.playbooks){
    const det=el("details","pbk");const sm=el("summary",null,p.title);
    sm.append(el("span","st "+(p.status==="live"?"st-built-live":"st-planned"),p.status==="live"?"BUILT, live":"PLANNED"));det.append(sm);
    const inn=el("div","in");det.append(inn);
    if(p.status==="live"){
      det.open=true;const x=await getJSON("/api/playbook/"+encodeURIComponent(p.id));
      if(x){
        inn.append(el("p","ldg",`${x.stages.length} stages. Family languages: ${(x.languages||[]).join(", ")||"none listed"}.`));
        x.stages.forEach(s=>{const g=el("div","stg");g.append(el("h4",null,s.title),el("p",null,s.summary));
          const kv=(label,items,link)=>{if(!items.length)return;const u=el("ul","kv");const l0=el("li");l0.append(el("span","lab",label));u.append(l0);items.forEach(i=>{const li=el("li");if(link){const a=el("a",null,i);a.href="#rule-"+i;li.append(a)}else li.append(el("span",null,i));u.append(li)});g.append(u)};
          kv("Checks",s.checks,true);kv("Sources",s.sources.map(String),false);kv("Jev questions",s.jev,false);kv("Waits for",s.deps,false);
          kv("Prompt",s.prompt?[s.prompt]:[],false);inn.append(g)});
        if(x.outcomes.length){const g=el("div","stg");g.append(el("h4",null,"How a run can end"));const u=el("ul","kv");x.outcomes.forEach(o=>{const li=el("li");li.append(el("span",null,o));u.append(li)});g.append(u);inn.append(g)}
      }else inn.append(el("p","ldg","Details could not be loaded."))
    }else inn.append(el("p","ldg","A card that says coming soon. No prompts, sources or checks exist yet."));
    box.append(det)}}
document.querySelectorAll("[data-live]").forEach(b=>{b.dataset.live==="rules"?rules(b):playbooks(b)});
// contents: open on laptop, collapsed on phone; the current section is marked
const toc=document.getElementById("toc"),mq=matchMedia("(min-width:960px)");const sync=()=>{toc.open=mq.matches};sync();mq.addEventListener("change",sync);
toc.addEventListener("click",e=>{if(e.target.closest("a")&&!mq.matches)toc.open=false});
const links=[...toc.querySelectorAll("a")],secs=links.map(a=>document.getElementById(a.getAttribute("href").slice(1)));
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.removeAttribute("aria-current"));links[secs.indexOf(e.target)]?.setAttribute("aria-current","true")}})},{rootMargin:"-80px 0px -70% 0px"});
secs.forEach(s=>s&&io.observe(s));
// a deep link to a live row works after the rows exist
addEventListener("load",()=>{if(location.hash){setTimeout(()=>document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView(),600)}});
})();
</script>
</body>
</html>
