name: CI

# Offline checks only. No key is set, no secret is used, and nothing here calls Gloo, Jev or YouVersion.
# This workflow has not run yet: there was no runner to try it on when it was written (see documents/product/OBSERVABILITY.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python3 -m pip install -r code/requirements-dev.txt

      - name: Product tests (offline)
        run: code/test.sh

      - name: Evaluation tests (offline)
        run: python3 -m pytest -q evaluations/tests

  key-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fail if a tracked file holds a key-like string
        run: python3 code/tools/scan_keys.py
